<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cc-bridge</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    /* Type: four steps, not the nine spanning 1.7x that this file grew into. Sizes are set against
       the reference, where the message text measures ~17pt and the chat title ~20pt — so body moves
       UP (15 -> 16) rather than down. Mono runs a step below its neighbour: at the same nominal size
       a monospace face reads larger. */
    --t-meta: 12px;    /* chips, feet, uppercase labels */
    /* The bubble's time + delivery mark, and a REAL step in the scale rather than a one-off sprinkled
       at the call site: the owner asked for it below --t-meta, and the answer to that is to extend the
       scale so the next reader can see where the value comes from. It is the reference's own
       proportion — its meta ink measures 15px of cap against the message text's 21px, so 0.714 of
       --t-msg, which is 11.4 at our 16px. Rounded down, since the scale prefers integers.
       Measure ink with a threshold ABOVE the bubble fill (lum 135) — a lower one measures bubble, not
       glyph, and that mistake is what produced an earlier "0.56" and a plan to drop this to 9px. */
    --t-stamp: 11px;
    --t-sub: 14px;     /* secondary lines — task summaries, hints, small controls */
    --t-body: 16px;    /* list rows, values, and the composer field */
    /* The feed's message text, and its OWN step rather than a bump to --t-body, for the reason
       --fold-h gives above: --t-body also sizes the composer textarea, whose line box sets the
       settled 52px pill and the six-line cap. Raising it there would have quietly grown both.
       Set on .msg so BOTH sides move together — the two must stay matched.
       It currently COINCIDES with --t-body, by the owner's call after living with 18 at full width
       on his own phone. That coincidence is not a reason to collapse the two: --t-body drags the
       composer's geometry with it and this one does not, which is the whole point of the split. */
    --t-msg: 16px;
    --t-title: 20px;   /* the one title size */
    --t-mono: 13px;    /* code blocks, inline code, and the command chip */
    /* Spacing and radius. NOTE for anyone re-running the design lint: tokenising these also makes
       them invisible to it, because it only reads literals. flat-type-hierarchy stops firing for
       the same reason — it is NOT evidence the scale now spans its 2x threshold. It doesn't: 20/12
       is 1.67. Nothing in a chat console legitimately carries a 24px display size, so the honest
       fix was fewer, better-separated steps rather than a big number invented to clear a rule. */
    --w-semi: 600;     /* the one weight step above body */
    --lh-snug: 1.25;   /* title blocks; body keeps its looser 1.45 */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
    /* The collapsed-message fold bar's reserved strip. Deliberately its OWN variable and not --sp-5:
       it is a geometric invariant (must be >= the bar's height, pinned at 12px glyph + 4 + 6 = 22),
       not a spacing choice. Tying it to the general scale is how it silently broke once already. */
    --fold-h: 24px;
    /* The composer capsule is DERIVED from the mic, never the reverse: the round button keeps its
       diameter and the pill is whatever clears it with an even ring. --pill-h is the sum; nothing
       sets a pill height by hand.
       The ring is 6px by the owner's choice, not by the reference's proportion — the reference is
       tighter (a 67px button in a 78px pill, 5.5/67 ≈ 0.082 of the diameter, which scales to ~3px
       here) and he asked for more air around the button after seeing that version. Keep it an
       INTEGER: it is half the pill's spare height, so an odd total would land the button on a half
       pixel and reintroduce exactly the paint snap the .sendbtn svg note describes. */
    --mic-d: 40px;
    /* The chat header's three containers — two circles and the name capsule, ONE size, derived
       capsule-FIRST: the pill's height is its own two line boxes plus padding and the circles take
       that, so the three share a height by construction. It ran the other way once, off the
       reference's mic ratio (81.0 : 66.7 → 48.6), which pinned the row at 48.
       The line boxes are px, not --lh-snug: 1.25 on the 11px sub gives 13.75, and a fractional row
       height puts .chatbtn's integer padding back on a half pixel. 20/14 are --lh-snug rounded, so
       the sum is 44 — under a toolbar row, and exactly the 44px touch floor it may not go below.
       Keep --hbtn-d MINUS --hbtn-glyph EVEN (44 - 24 = 20): the button centres its glyph with half
       the difference as padding, and an odd one lands it on a half pixel — see .chatbtn. */
    --h-l1: 20px; --h-l2: 14px; --h-pad: 5px;
    --hbtn-d: calc(var(--h-l1) + var(--h-l2) + 2 * var(--h-pad));
    --hbtn-glyph: 24px;
    /* Those three containers are one family, so their raised look is one constant rather than the
       same two shadows written out per container. */
    --chip-lift: inset 0 1px 0 rgba(255,255,255,.06), 0 2px 6px rgba(0,0,0,.35);
    /* The paperclip glyph. Its own constant rather than a step off --sp-*, for the reason --fold-h
       gives above: it is a geometric size answering to the reference, not a spacing choice. */
    --clip-d: 24px;
    /* The composer's model/effort chip. Same derivation as --clip-d and --hbtn-d: a proportion of
       the reference measured against the mic both frames contain (56.1 : 66.7), not a chosen size. */
    --dial-h: 34px;
    --pill-ring: 6px;
    /* The pill's height AT ONE LINE, and the name matters: the pill now grows with the textarea,
       but the corner radius must NOT follow it. Tie the radius to the live height and a six-line
       pill becomes a 74px lozenge instead of a chat field. Fixed at the one-line radius, a tall
       pill is a rounded rectangle whose bottom-right corner keeps the curve the mic sits in. */
    --pill-h-1: calc(var(--mic-d) + 2 * var(--pill-ring));
    /* The composer's growth cap, in LINES. Six fully visible lines, then the text scrolls inside
       the field — measured off a real Telegram client by the owner, not chosen here. It is derived
       from the line box rather than written as a pixel height on purpose: a pixel cap that is not
       an exact multiple of the line box puts the ceiling mid-line, so the sixth line shows as a
       sliver — the same clipped-glyph symptom this change exists to remove, moved to the scroll
       boundary. The old inert `max-height: 110px` was exactly that: 4.26 lines. */
    --ta-lines: 6;
    --ta-lh: 1.35;
    --ta-pad-y: 9px;
    --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-xl: 16px; --r-2xl: 20px;
    --bg: var(--tg-theme-bg-color, #17212b);
    --sec: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #7d8b99);
    --link: var(--tg-theme-link-color, #6ab3f3);
    --btn: var(--tg-theme-button-color, #5288c1);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    /* Hint grey is tuned for the page ground. On a raised --sec surface it falls to 3.94:1 at 12px,
       under AA — and hint-on-raised is this app's dominant secondary-text pattern, so the debt is
       the pattern's, not one label's. Lifting it toward the theme's OWN text colour rather than
       hardcoding a grey keeps it following a custom Telegram theme.
       Deliberately NOT applied to .dot: its idle state is var(--hint) and stays byte-exact. */
    --hint-raised: var(--hint);
    /* Stop red. Saturation taken from the stop-sign emoji, NOT sampled from the reference JPEG (whose
       circle is duller and slightly pink) — the owner asked for the emoji's red specifically.
       Tokenised on purpose, and note this is the OPPOSITE call from .dot.on's hardcoded green: that
       one stays literal because a token would make the frozen indicator inheritable. Nothing here is
       frozen, so the lint's raw-color finding is real and the token is the answer. */
    --stop-red: #ea3323;
    /* Added / removed lines. There is no light-theme block in this file to hold a second pair — the
       theme arrives entirely through --tg-theme-* — so ONE pair has to clear contrast on both
       grounds. These two are tuned for the dark one; the @supports below pulls each toward whatever
       --text is, which lightens them on a dark ground and darkens them on a light one. */
    --add: #3fb950;
    --del: #f85149;
  }
  @supports (color: color-mix(in srgb, red 50%, blue)) {
    :root { --hint-raised: color-mix(in srgb, var(--hint) 80%, var(--text));
      --add: color-mix(in srgb, #3fb950 80%, var(--text)); --del: color-mix(in srgb, #f85149 80%, var(--text)); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: var(--t-body)/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  /* Form controls don't inherit fonts by default (the composer was silently falling back to the
     UA's monospace); give them the app stack — later per-element rules (#vedit-area) still win. */
  input, button, select, textarea { font: inherit; }
  header { position: sticky; top: 0; background: var(--bg); padding: var(--sp-3); border-bottom: 1px solid var(--sec); }
  .crumbs { font-size: var(--t-meta); color: var(--hint); word-break: break-all; margin-bottom: var(--sp-2); }
  .crumbs a { color: var(--link); text-decoration: none; }
  .search { display: flex; gap: 6px; }
  .search input { flex: 1; padding: var(--sp-2) 10px; border-radius: var(--r-sm); border: none; background: var(--sec); color: var(--text); font-size: var(--t-sub); }
  .search button { padding: var(--sp-2) var(--sp-3); border: none; border-radius: var(--r-sm); background: var(--btn); color: var(--btn-text); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 11px var(--sp-3); border-bottom: 1px solid var(--sec); display: flex; gap: 10px; align-items: center; cursor: pointer; }
  li:active { background: var(--sec); }
  .ico { width: 20px; text-align: center; }
  .name { flex: 1; word-break: break-all; }
  .meta { color: var(--hint); font-size: var(--t-meta); white-space: nowrap; }
  #viewer { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; }
  #viewer.show { display: flex; }
  .vhead { padding: 10px var(--sp-3); border-bottom: 1px solid var(--sec); display: flex; gap: var(--sp-2); align-items: center; }
  .vhead .name { font-size: var(--t-sub); }
  /* Scoped to #viewer, which is the only header these solid pills were ever for. It used to be
     `.vhead button:not(.ghost)`, and the exclusion existed only because the rule also reached the CHAT
     header — so it had to be told which buttons not to eat. Narrowing the rule removes the need for the
     exclusion, and with it a base rule that outranked (0,2,1) anything a variant would naturally carry.
     Proven, not theorised: moving the chat buttons off .ghost made them match this rule, which painted
     the stop blue and shrank its glyph with `padding: 7px 11px`. Two over-broad base rules produced both
     of tonight's inert-modifier bugs; this is the second one going. */
  #viewer .vhead button { padding: 7px 11px; border: none; border-radius: var(--r-sm); background: var(--btn); color: var(--btn-text); }
  /* Chat header — the drill-in ONLY (the file viewer keeps the flat bar; it isn't this screen).
     THREE separate containers with gaps between them, per the reference: a standalone circle, the
     name capsule, a standalone circle. The BAR paints nothing; each container carries its own lift.
     They used to be one island with the two buttons sitting inside it. On a near-black canvas there
     is no ambient light for a surface to catch, so the lift has to be manufactured: an opaque raised
     fill plus a hairline rim along the top edge where light would land. Deliberately NO accent bloom
     — a glow is for the one thing you want clicked, and these are utility controls. */
  /* 10px matches the composer's inset, so the two surfaces that bracket the screen line up. The 6px
     gap is the reference's own (10.6 and 9.7 image px against its 66.7px mic). */
  /* --title-align is the ONE declaration that walks the centred title back to left-anchored, because
     the owner asked for centred provisionally. Centring is honest here rather than approximate: the
     row holds one identically-sized circle on each side, so the space either side of the capsule is
     symmetric and centring within it centres against the ROW. Add a third control and that stops
     being true — give the side slots equal fixed widths at that point. */
  #drill .vhead { --title-align: center; margin: 10px 10px 2px; padding: 0; border-bottom: none;
    background: transparent; gap: 6px; }
  /* SELF-CONTAINED, and a single class on purpose. These buttons are deliberately NOT .ghost, and the
     shared appearance deliberately does NOT live on a `#drill .vhead > *` rule: the base used to be
     `#drill .vhead .ghost` (1,2,0), which meant every variant had to out-rank an id plus two
     descendants, and a variant written the obvious way — `#dstop.recording` (1,1,0) — silently lost and
     did nothing. Twice that night, counting the ✕ that lost its red to `.vhead .ghost` (0,2,0). At (0,1,0) any
     `.chatbtn.x` variant wins by construction, and scoping is now by markup rather than by location,
     so it cannot accidentally capture the file viewer's own .vhead buttons either. */
  /* Both circles are the same painted chip as the capsule between them — same fill, same rim — which
     is what makes the three read as one row of containers rather than three unrelated shapes.
     No ::after touch-target lift any more: it existed to bring a 34px button up to the 44px standard,
     and the button now meets 44 on its own — which is why --hbtn-d's floor is that number. */
  .chatbtn { width: var(--hbtn-d); height: var(--hbtn-d); border: none; border-radius: 50%;
    background: var(--sec); box-shadow: var(--chip-lift); color: var(--text); cursor: pointer; flex: none;
    /* The PADDING is what fixes the glyph's origin — an integer, so it lands on whole pixels at any
       button size. Centring it by halving flex free space instead is what put the 19-in-34 button's
       glyph half a pixel down and right: 15px of free space halves to 7.5, and Blink snaps the SVG's
       paint origin up to the whole pixel. Measured at exactly +0.50, +0.50 on both of these buttons
       before this change — the same defect fixed on the composer mic, which CLAUDE.md had recorded
       here as merely suspected. The flex box below then has zero free space left to halve. */
    padding: calc((var(--hbtn-d) - var(--hbtn-glyph)) / 2);
    display: flex; align-items: center; justify-content: center; }
  .chatbtn svg { width: var(--hbtn-glyph); height: var(--hbtn-glyph); display: block; }
  /* 24px, up from 19. Sized against the owner's reference rather than by eye: its paperclip carries
     34x39px of ink beside a 67px mic button, which at our 40px mic scales to 20.3 x 23.3 — a 24px
     glyph puts ours at 21.4 x 22.6, the closest of the sizes tried. `.ghost` has exactly one user
     (#datt), so this reaches nothing else. The glyph stays on whole pixels at ANY size here because
     .ghost centres it with integer padding rather than by halving flex free space — the trap that
     caught .sendbtn does not exist on this button. */
  .ghost svg { width: var(--clip-d); height: var(--clip-d); display: block; }
  /* Two-line title: name over the session's dial line, as the reference has name over "bot". The
     status dot rides ON the name line — centred against a two-line block it would float in the
     gutter, belonging to neither line. (Its own rules stay untouched; only its context moves.) */
  /* The MIDDLE CONTAINER: a capsule spanning the gap between the two circles and exactly as tall as
     they are — equal height is what makes the three read as one row. It is now the SOURCE of that
     height (two line boxes + --h-pad, which --hbtn-d is calc'd from), so min-height restates the
     number rather than setting it, and earns its keep in one case: #dsub EMPTY, which a deep-linked
     open really renders (openDrill runs before the snapshot lands). An empty block box is 0 tall,
     so without it the capsule would collapse between two taller circles. */
  .dtitle { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;
    min-height: var(--hbtn-d); padding: var(--h-pad) var(--sp-3); border-radius: calc(var(--hbtn-d) / 2);
    background: var(--sec); box-shadow: var(--chip-lift);
    line-height: var(--lh-snug); text-align: var(--title-align, left); }
  .dtitle .nmrow { display: flex; align-items: center; gap: 7px; min-width: 0; justify-content: var(--title-align, flex-start); }
  /* An inert mirror of the status dot on the trailing side. Without it the dot widens the name row on
     one side only, so the centred NAME lands ~9px right of the centred subtitle — two lines of one
     title block on different axes, which is precisely the "slightly off" that gets noticed without
     being diagnosed. Cheaper and less fragile than taking the dot out of flow. */
  .dtitle .nmrow::after { content: ""; width: 9px; flex: none; }
  /* A long session name truncates rather than shoving the title into a control. It stays centred until
     it fills the space, then behaves like any other overlong label. */
  /* flex: 0 1 auto DEFEATS the generic `.name { flex: 1 }` above. Inheriting it made the name box span
     the whole row, so `justify-content` on .nmrow was inert and the status dot sat pinned at the title
     block's left edge, 77px from the name it labels and touching the back button — the centring looked
     like a bug rather than a decision, and the indicator lost its referent. */
  /* One step down each (title → body, meta → stamp); these two line boxes are the row's height. */
  .dtitle .name { flex: 0 1 auto; min-width: 0; font-size: var(--t-body); line-height: var(--h-l1); font-weight: var(--w-semi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dtitle .sub { display: block; font-size: var(--t-stamp); line-height: var(--h-l2); color: var(--hint-raised); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The interrupt keeps NO rule of its own: same fill and same glyph as the back chip, by the owner's
     call, so the base rule above is the whole of it. That supersedes an optical correction that shrank
     its painted disc — both discs measured exactly equal in the rendered PNG, so the size complaint was
     never geometry (a fully saturated shape reads larger than a low-contrast one of identical extent).
     Nothing here is red, so the composer's recording button has no lookalike, which is why this control
     no longer hides itself mid-recording. And it has ONE constant appearance — deliberately not dimmed
     while the session is idle: the green-to-grey status dot beside the name already says that, and
     pressing it while idle is a harmless no-op. */
  pre { margin: 0; padding: var(--sp-3); overflow: auto; flex: 1; white-space: pre; font: var(--t-mono)/1.45 ui-monospace, Menlo, Consolas, monospace; }
  .notice { padding: var(--sp-5) var(--sp-4); color: var(--hint); text-align: center; }
  .err { background: #c0392b; color: #fff; padding: var(--sp-2) var(--sp-3); font-size: var(--t-sub); display: none; }
  .err.show { display: block; }
  .err.ok { background: #2e7d32; }
  button.rowbtn { background: transparent; border: none; color: var(--hint); font-size: var(--t-title); line-height: 1; padding: 2px var(--sp-2); cursor: pointer; }
  textarea#vedit-area { margin: 0; padding: var(--sp-3); border: none; outline: none; flex: 1; width: 100%; resize: none; background: var(--bg); color: var(--text); font: var(--t-mono)/1.45 ui-monospace, Menlo, Consolas, monospace; }
  /* Tab bar: icon-over-label, one stroke-icon family (inherits color via currentColor) */
  .tabs { display: flex; position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--sec); }
  .tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: var(--sp-2) var(--sp-1) 7px; border: none; background: transparent; color: var(--hint); font-size: var(--t-meta); cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button svg { width: 20px; height: 20px; }
  .tabs button.active { color: var(--btn); border-bottom-color: var(--btn); }
  .tab { display: none; }
  .tab.show { display: block; }
  /* Console (Settings / Usage / Diff) */
  .panel { padding: var(--sp-3); }
  .card { background: var(--sec); border-radius: 10px; padding: var(--sp-3) 14px; margin-bottom: 10px; }
  .card .k { color: var(--hint-raised); font-size: var(--t-meta); }
  .card .v { font-size: var(--t-body); margin-top: 2px; word-break: break-word; }
  .setrow { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--sec); }
  .setrow:last-child { border-bottom: none; }
  .setrow .lbl { flex: 1; }
  .setrow .lbl .sub { color: var(--hint); font-size: var(--t-meta); }
  .setrow .ro { color: var(--hint); font-size: var(--t-sub); }
  .toggle { padding: 6px var(--sp-3); border: none; border-radius: var(--r-sm); background: var(--btn); color: var(--btn-text); font-size: var(--t-sub); cursor: pointer; min-width: 56px; }
  .toggle.off { background: var(--sec); color: var(--hint-raised); box-shadow: inset 0 0 0 1px var(--hint); }
  select.seg { padding: 6px var(--sp-2); border-radius: var(--r-sm); border: none; background: var(--bg); color: var(--text); font-size: var(--t-sub); box-shadow: inset 0 0 0 1px var(--sec); }
  .bar { height: var(--sp-2); border-radius: var(--r-xs); background: var(--bg); overflow: hidden; margin-top: 6px; box-shadow: inset 0 0 0 1px var(--sec); }
  .bar > span { display: block; height: 100%; background: var(--btn); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* Sessions dashboard */
  .sess { background: var(--sec); border-radius: var(--r-md); padding: var(--sp-3) 14px; margin: 0 0 10px; cursor: pointer; }
  .sess:active { filter: brightness(1.1); }
  .sess .top { display: flex; align-items: center; gap: var(--sp-2); }
  /* Top-right of each card, and its geometry is the safety, not its colour.
     - A 44px box: this is the one destructive control you meet mid-scroll, so it gets a real target.
     - NO negative LEFT margin. A symmetric one cancelled `.sess .top`'s 8px gap exactly, leaving zero
       dead pixels between "open this session" and "end this session" — one px either side of a boundary.
     - Negative vertical margins so an oversized target doesn't grow the row.
     - HINT grey, not red. Red once per row reads as "three things are wrong" before "three things can be
       closed", and `.dot.dead` uses that identical red on the SAME row to mean the opposite. The confirm
       carries the danger; the icon needn't shout it. */
  .cardx { background: transparent; border: none; color: var(--hint-raised); cursor: pointer; flex: none;
    width: 44px; height: 44px; margin: -10px calc(-1 * var(--sp-2)) -10px 0; padding: 0;
    display: flex; align-items: center; justify-content: center; }
  .cardx svg { width: 17px; height: 17px; display: block; }
  .sess .nm { font-weight: var(--w-semi); flex: 1; word-break: break-word; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hint); flex: none; }
  .dot.on { background: #4caf50; animation: pulse 1.6s ease-in-out infinite; }
  .dot.dead { background: #e05555; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .chip { font-size: var(--t-meta); color: var(--hint); background: var(--bg); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  .sess .task { color: var(--hint-raised); font-size: var(--t-sub); margin-top: 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .sess .foot { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); font-size: var(--t-meta); color: var(--hint-raised); }
  .sess .foot .bar { flex: 1; margin-top: 0; height: 5px; }
  /* Drill-in (session detail) */
  #drill { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 5; }
  #drill.show { display: flex; }
  #dfeed { flex: 1; overflow-y: auto; padding: var(--sp-3); }
  /* ASYMMETRIC padding, and the asymmetry is the point: the bubble hugs the meta block far tighter
     than it pads a line of text, which is what makes the time read as tucked into the corner. Pulling
     all four sides in instead would drag the top edge onto the first line and change every bubble
     that is already right. Only the BOTTOM moves (8 → 3). */
  .msg { max-width: 88%; margin-bottom: var(--sp-2); padding: var(--sp-2) 11px 3px; border-radius: var(--r-md); font-size: var(--t-msg); white-space: pre-wrap; word-break: break-word; display: flow-root; }
  .msg.user { background: var(--btn); color: var(--btn-text); margin-left: auto; border-bottom-right-radius: var(--r-xs); }
  .msg.user.pending { opacity: .55; }
  /* Session replies carry NO bubble: full content width on the page background, as the reference
     has them. The gutter is #dfeed's own padding — "full width" means the content column, not the
     glass. With the fill gone it is vertical rhythm that separates one reply from the next, so the
     margin doubles; at the old 8px, unbubbled replies ran together into one wall of text. The
     bubble now marks the USER side alone, which is what tells the two apart.
     A turn joins the rule rather than restating it: the same unbubbled, full-width column. */
  .msg.assistant, .msg.turn { background: transparent; max-width: 100%; padding: 0; border-radius: 0; margin-bottom: var(--sp-4); }
  .msg.turn .tp + .tp { margin-top: var(--sp-2); }
  /* A LINE, not a card: it drops .chip's fill, which belongs to the sessions list — a chip that
     paints a surface here reads as a nested message. Demoted by size and colour, never by weight.
     .cv is the exception, at full text colour: the chevron is the affordance, not decoration. */
  .msg.turn .chip { display: flex; align-items: center; gap: 6px; width: 100%; padding: 3px 0;
    background: transparent; border: none; font-size: var(--t-sub); cursor: pointer; }
  .msg.turn .chip .cl { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .msg.turn .chip .cv { margin-left: auto; color: var(--text); font-size: var(--t-body); }
  /* Chip and sheet row share these. Colour ONLY — a tinted pill re-cards the line above uncards. */
  .cp { color: var(--add); font-style: normal; }
  .cm { color: var(--del); font-style: normal; }
  /* A concluded turn folds its thinking into a native <details>: the marker is the affordance, so
     only type is set. Open state survives the repaint in JS — see openTurns. */
  .msg.turn summary { cursor: pointer; color: var(--hint); font-size: var(--t-sub); }
  /* Left padding drops to 0 with the assistant's: the 11px existed to line these up with bubbled
     text, and against an unbubbled reply it reads as an indent that means nothing.
     Type and colour are deliberately ABSENT: these lines carry no font, size or colour of their own,
     so they inherit .msg's --t-msg and the page's text colour and read as the same prose as a reply.
     They were an italic 12px monospace in --hint; the owner asked for the prose face, the prose size
     and no dimming, which retires a demotion an earlier release kept on purpose. Nothing replaces it
     — no rule, no gutter, no residual tint — so do not reintroduce one here. */
  .msg.activity { background: transparent; padding: 2px 0; margin-bottom: 3px; }
  /* The quote bar is NOT a demotion and stays: it is the DOM counterpart of the <blockquote> the
     Telegram live card renders this same narration in, i.e. structure carried across from the other
     surface rather than styling invented here. */
  .msg.thought { background: transparent; max-width: 100%; padding: 1px 0 1px 10px; margin: var(--sp-1) 0 6px 0; border-left: 2px solid var(--sec); white-space: pre-wrap; }
  /* The CLI's own working line, surfaced because this surface has none of Telegram's limits: the
     rotating glyph, the turn's randomised verb, its elapsed time and its token count.
     It DOES recede to --hint, and that does not contradict the note above. Those lines are the
     transcript — content, and prose by instruction. This one is transient status that never enters
     the transcript and is gone when the turn ends, so it is the one thing here that should sit under
     the prose rather than in it. Do not "fix" it into --t-msg to match its neighbours.
     The glyph box is a fixed width: the six spinner characters have different advances, and letting
     the row re-flow on every frame is a jitter you feel more than see. Numbers take the mono
     register (they are live machine values, and tabular digits stop the elapsed time shivering as
     it counts), and sit right so the line needs ONE separator rather than three. */
  .work { display: flex; align-items: baseline; gap: 8px; padding: 3px 0 7px; color: var(--hint); font-size: var(--t-meta); }
  .work .g { width: 1.1em; flex: none; text-align: center; }
  .work .v { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .work .m { margin-left: auto; flex: none; font: var(--t-mono) ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  /* Reduced motion stops the CYCLE, not the signal — the glyph rests on a single character while the
     elapsed and token counts keep climbing on the poll, which is the liveness cue that matters and
     is text, not animation. Handled in startWorkGlyph(), which never starts the timer; the resting
     glyph ships in the DOM either way. */
  /* Telegram-style composer: ONE pill spanning the strip, with the paperclip and the round
     mic/send button living INSIDE it — the pill wraps around the mic rather than sitting beside it. */
  /* No divider rule: in the reference the capsule's own fill is what separates the composer from the
     feed. The rim belongs on the capsule, where it lights an actual edge — put it on this full-bleed
     strip instead and it draws the very hairline the line above says the design doesn't have. */
  .composer { display: flex; gap: var(--sp-2); padding: var(--sp-2) 10px calc(var(--sp-2) + env(safe-area-inset-bottom)); align-items: flex-end; }
  /* `align-items: flex-end`, and it is load-bearing twice over. It is what keeps the mic ROUND —
     the default `stretch` would pull a 40px button to the pill's full content height and the glyph
     would no longer sit centred in a circle. It is also what pins both controls to the BOTTOM of
     the pill, as the reference has them, if the textarea ever grows past one line.
     `border-radius` is half the height, so the pill's right end is a semicircle centred on exactly
     the same point as the mic (ring 3 + radius 20 = 23) — that concentricity is what makes the ring
     read as even all the way around the button rather than only above and below it. */
  /* padding-left drops 14 → the ring, because the capsule's first item is now the dial pill rather
     than the text: 14px was the placeholder's inset and the pill wants the same air as the mic on the
     other end. The text's own inset moved onto the textarea below, so the placeholder is unmoved. */
  /* `min-width: 0` on BOTH the capsule and the field, and it takes both. The field's lets it shrink;
     the capsule's is what stops its own automatic minimum size — computed from the textarea's
     cols-based min-content width, which does not care that the field itself was told it may shrink —
     from holding the capsule open past the screen. With only one of the two, a long model name on
     the pill pushed the capsule to 508px inside a 390px strip and carried the mic off-screen. It
     does not scroll the PAGE, because a fixed-position subtree contributes no scrollable overflow —
     so this fails silently, with the send button simply unreachable. */
  .inputwrap { flex: 1; min-width: 0; display: flex; align-items: flex-end; background: var(--sec); border-radius: calc(var(--pill-h-1) / 2); padding: var(--pill-ring); min-height: var(--pill-h-1); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  /* The model/effort pill, styled after the reference's blue "Open" chip: text only, no icon.
     Height is the reference's proportion against the one control both frames share — a 56.1px chip
     beside a 66.7px mic, so 0.84 of our 40px mic. The margin is NOT a nudge: at one line the
     reference centres this chip on the same axis as the mic (measured 46.9 vs 47.4 in a 102px crop),
     and since `align-items: flex-end` pins it to the capsule's floor, half the difference between it
     and the mic is exactly what puts the two back on one axis. It stays bottom-anchored when the
     field grows, like the clip and the mic. */
  .dialpill { flex: none; height: var(--dial-h); margin-bottom: calc((var(--mic-d) - var(--dial-h)) / 2);
    border: none; border-radius: calc(var(--dial-h) / 2); background: var(--btn); color: var(--btn-text);
    font-size: var(--t-sub); line-height: 1; padding: 0 12px; cursor: pointer;
    display: flex; align-items: center; gap: 5px; max-width: 40%; }
  /* The model name carries the weight; the effort rides beside it at the same size, unbolded — the
     one is what you picked, the other is how hard it is being pushed. */
  .dialpill b { font-weight: var(--w-semi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dialpill .eff { opacity: .85; white-space: nowrap; }
  /* Explicit font (not `inherit`): Android WebViews don't reliably propagate an inherited font
     into the IME composition / autofill layer, which then renders in the UA default. */
  /* max-height is the six-line cap spelled as six line boxes plus the field's own padding, so it
     stays six lines if the type scale or line-height ever moves. box-sizing is border-box here,
     which is why the padding term belongs in the sum. */
  /* `min-width: 0` is load-bearing and only became so when the dial pill joined the capsule. A flex
     item's automatic minimum size is its intrinsic width, and a <textarea>'s is its `cols` default
     (~20 characters) — so the field REFUSED to shrink below ~200px and the capsule overflowed the
     screen instead, at which point the whole page scrolls sideways. Measured: a long model name blew
     the capsule from 370 to 508px on a 390px viewport. Every other flex child here is `flex: none`,
     so this is the only item that can give, and it has to be allowed to. */
  .inputwrap textarea { flex: 1; min-width: 0; resize: none; border: none; outline: none; background: transparent; color: var(--text); padding: var(--ta-pad-y) 0 var(--ta-pad-y) var(--sp-2); font: var(--t-body)/var(--ta-lh) -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; max-height: calc(var(--ta-lines) * var(--ta-lh) * 1em + 2 * var(--ta-pad-y)); overflow-y: auto; }
  .ghost { background: transparent; border: none; color: var(--hint); padding: var(--sp-2) 7px; cursor: pointer; line-height: 1; flex: none; }
  /* The capsule's controls should sit a step above its placeholder, as they do in the reference —
     at one tone the whole capsule reads as decoration rather than two affordances beside a label. */
  .inputwrap .ghost { color: var(--text); opacity: .72; }
  /* Recording turns the round button itself red rather than tinting a glyph, because in this state it
     IS the recorder. It does NOT inherit the old pulse: that animated a 19px glyph, and a 40px filled
     circle dropping to .35 opacity reads as a button dying rather than a recorder running. A red fill
     behind a stop square is unambiguous on its own — the square only exists while recording. */
  .sendbtn.recing { background: var(--stop-red); }
  /* Reduced motion: still the two pulses, additively — the base rules and @keyframes pulse are left
     byte-exact rather than edited, because both indicators are load-bearing and shared. Nothing is
     lost when the animation stops: colour already carries both states (green vs grey, red vs hint). */
  @media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
  /* `flex: none` is the other half of keeping this button exactly itself: inside the pill it is a
     flex item, and without it the mic would shrink when the textarea wanted the room. */
  .sendbtn { width: var(--mic-d); height: var(--mic-d); border-radius: 50%; border: none; background: var(--btn); color: var(--btn-text); flex: none; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  /* 20px, not 19: an ODD icon in the 40px button leaves a 10.5px flex gap each side, and Blink
     snaps the SVG's paint origin up to the whole pixel — which put every glyph in here half a pixel
     down and right of centre, at DPR 1, 2, 3 and 4 alike. An even size divides exactly. */
  .sendbtn svg { width: 20px; height: 20px; display: block; }
  /* The plane's bounding box is symmetric but its MASS is not: centroid (13.8, 10.2) against a box
     centre of (12, 12), i.e. 1.8 units up and right. Nudge down-left by that, scaled 20/24. The
     nudge is the PLANE's alone: as `.sendbtn svg` it also displaced the mic and the record-stop
     square, whose artwork is already centred, and that is what knocked the mic's glyph off centre. */
  #dsend svg { transform: translate(-1.5px, 1.5px); }
  /* Feed extras: command chip, attachment chip, inline photo, light markdown */
  .msg.cmd { background: transparent; color: var(--link); font: var(--t-mono)/1.4 ui-monospace, Menlo, monospace; margin-left: auto; padding: 2px 11px; max-width: 88%; }
  /* Long message: collapsed to a readable height, tapping opens it. Fading the fold makes the cut
     legible as "there is more" rather than as a sentence that just stops. */
  /* --fold-h reserves the label's row so the fold never draws over a line of text. The bar's height
     is pinned below (line-height 1) precisely so the reservation can be derived rather than guessed.
     It used to be 26px against an inherited 1.45 line-height, which the type scale's 11->12px bump
     silently pushed to 27.4 — the bar drew over the text, and nothing in CSS complains about that. */
  .msg.clip { position: relative; max-height: 268px; overflow: hidden; padding-bottom: var(--fold-h); }
  /* The fold fades to whatever is BEHIND the text. That used to be the assistant bubble's fill;
     now the assistant sits on the page, so the base case is --bg and the user bubble keeps its
     own override below. Left at --sec this paints a grey band across the page background. */
  .msg.clip::after { content: ""; position: absolute; left: 0; right: 0; bottom: calc(var(--fold-h) - 4px); height: 52px; background: linear-gradient(transparent, var(--bg)); pointer-events: none; }
  .msg.user.clip::after { background: linear-gradient(transparent, var(--btn)); }
  /* ONE line, always: `.msg.clip`'s padding-bottom reserves exactly this bar's height, so a label
     that wraps to two lines overflows the strip and draws over the text. Ellipsis rather than wrap,
     and the time leads so it is never the part that gets cut. */
  .msg.clip .more { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: var(--t-meta); line-height: 1; opacity: .8; padding: var(--sp-1) 0 6px; background: var(--bg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg.user.clip .more { background: var(--btn); }
  .msg.clip.open { max-height: none; padding-bottom: var(--sp-2); }
  .msg.clip.open::after { display: none; }
  .msg.clip.open .more { display: none; }
  .msg .attchip { font-size: var(--t-sub); opacity: .92; margin-bottom: var(--sp-1); }
  .msg img.thumb { max-width: 100%; min-height: 40px; border-radius: 9px; display: block; }
  .msg img.thumb + .cap { margin-top: 6px; }
  .msg code { background: rgba(125,139,153,.25); border-radius: var(--r-xs); padding: 0 var(--sp-1); font: var(--t-mono) ui-monospace, Menlo, monospace; }
  /* Code WRAPS rather than scrolls. A horizontally-scrolling region nested inside a vertically
     scrolling feed has no affordance on touch — real transcript lines run past 600 chars, so the
     tail was simply invisible. Wrapping mangles an ASCII table's columns; silently hiding the end of
     a command does worse. */
  .msg pre.code { background: rgba(0,0,0,.28); border-radius: var(--r-sm); padding: var(--sp-2) 10px; font: var(--t-mono)/1.45 ui-monospace, Menlo, monospace; margin: var(--sp-1) 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* Timestamp: floated INSIDE the bubble at bottom-right so the last line of text wraps around it,
     as the reference does, instead of reserving a row under every message. `.msg` gets flow-root so
     the float is contained and can't escape the bubble's height. */
  /* The vertical placement is TWO ported ratios, not two nudged numbers. In the reference the meta's
     baseline sits 0.53 of its own cap height BELOW the last text line's baseline (that drop is what
     makes it read as tucked into a corner rather than as a short line of text), and 0.73 of its cap
     above the bubble's inner bottom edge. Ours was 1.8 caps above the bottom — two and a half times
     the reference's, which is the gap the owner saw. margin-top drops it onto the line's floor;
     .msg's asymmetric bottom padding closes the rest. */
  /* NO negative bottom margin, and this is the dropped-line case earning its own rule: in the shared
     case the text sets the bubble's height so a negative margin here changes nothing, but when the
     meta drops to its own line the float IS the height, and -2px took its clearance from 4.2px down
     to 1.0 — the two cases silently disagreeing by 3px, the tighter one looking clipped. Measured on
     both, which is the only way that shows up. */
  .tstamp { float: right; margin: 11px 0 0 5px; font-size: var(--t-stamp); opacity: .55; white-space: nowrap; line-height: 1; }
  .msg.user .tstamp { opacity: .8; }
  /* Delivery marks, and they mean something narrower than Telegram's: one tick = the daemon accepted
     it, two = the session's OWN transcript echoed it back. Neither claims it was read.
     Height is tied to the meta's own cap height rather than written in px, so the mark and the time
     stay one size if the type step moves; the -1px is the reference's own overhang below the
     baseline, measured, not an optical nudge. */
  /* Re-derived at --t-stamp, not inherited from the 12px version: the block's height is EXACTLY the
     meta's cap height (15/15 in the reference), its width 1.93x its height, and its bottom sits ON
     the baseline — which is where an inline SVG sits by default, so there is no vertical-align at all
     any more. The previous -1px came from the same bad threshold as the "0.56". */
  .tstamp .ticks { margin-left: 5px; height: 8px; width: 10px; }
  .tstamp .ticks2 { width: 15px; }
  /* "+" new-session row + bottom sheet */
  .newsess { border: 1px dashed var(--hint); border-radius: var(--r-md); padding: var(--sp-3) 14px; margin: 0 0 10px; color: var(--link); text-align: center; cursor: pointer; font-size: var(--t-sub); }
  #spawn, #sched { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 9; align-items: flex-end; }
  #spawn.show, #sched.show { display: flex; }
  .sheet { background: var(--bg); border-radius: var(--r-xl) var(--r-xl) 0 0; padding: var(--sp-4) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom)); width: 100%; }
  .sheet .shead { font-weight: var(--w-semi); font-size: var(--t-title); margin-bottom: var(--sp-3); }
  .sheet input, .sheet textarea { width: 100%; padding: 10px var(--sp-3); border-radius: 10px; border: none; background: var(--sec); color: var(--text); font-size: var(--t-sub); }
  .sheet textarea { resize: none; font-family: inherit; }
  .seglbl { color: var(--hint); font-size: var(--t-meta); margin: var(--sp-3) 0 6px; text-transform: uppercase; letter-spacing: .4px; }
  .segrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .selchip { border: none; border-radius: 14px; padding: 6px var(--sp-3); background: var(--sec); color: var(--hint-raised); font-size: var(--t-sub); cursor: pointer; }
  .selchip.on { background: var(--btn); color: var(--btn-text); }
  /* Model/effort picker — ONE sheet that slides sideways into a second page, not two sheets. Its own
     rules rather than .sheet's: this one animates, is edge-to-edge, and its rows are the content. */
  /* #calls (a chip's call list) is the SAME sheet — it joins these lists rather than restating the
     backdrop, the slide and the reduced-motion gate, so the two cannot drift. */
  #dial, #calls { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 10; align-items: flex-end; }
  #dial.show, #calls.show { display: flex; }
  /* Quick, per the brief — 180ms is about as long as a sheet can take before it reads as sluggish.
     The transform starts off-screen and the .up class is added on the next frame, so the browser has
     a start value to animate FROM; setting display and transform in one tick animates nothing. */
  .dialsheet, .callsheet { width: 100%; background: var(--bg); border-radius: var(--r-xl) var(--r-xl) 0 0;
    padding-bottom: env(safe-area-inset-bottom); transform: translateY(100%); transition: transform .18s ease-out; overflow: hidden; }
  #dial.up .dialsheet, #calls.up .callsheet { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .dialsheet, .dialpages, .callsheet { transition: none; } }
  /* A FIXED height, never one that fits the rows: a sheet that sizes to its content rises a
     different distance each time it opens. Rows sit at the top; the space below stays empty. */
  .callsheet { height: 72vh; display: flex; flex-direction: column; }
  #calllist { flex: 1; overflow-y: auto; padding: 0 var(--sp-4) var(--sp-3); }
  /* line-height stays under the node's 19px so the NODE is the tallest item and the row's content
     box is exactly it — the gap to the next node is then the 9px padding twice, which the connector
     assumes. The node is 17 + 2 borders because `*` does not match a pseudo-element, so it keeps
     content-box sizing; an ODD 19 puts its centre on 9.5, where a 1px rule sits exactly. */
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; position: relative; font-size: var(--t-sub); line-height: 18px; }
  .row::before { content: ""; width: 17px; height: 17px; flex: none; border: 1px solid var(--hint); border-radius: 50%; }
  /* ONE rule, on the PAIR: the connector exists BETWEEN nodes, so a border per row hangs a stub off
     the first and the last. -9/18 is exactly the gap the 9px padding leaves in the gutter. */
  .row + .row::after { content: ""; position: absolute; left: 9px; top: -9px; width: 1px; height: 18px; background: var(--sec); }
  /* Mono is the TARGET's alone: it is the only part that is a literal string from the machine. */
  .row .tgt { flex: 1; min-width: 0; color: var(--hint); font: var(--t-mono) ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The grab handle is decoration, not a control — the sheet is dismissed by the ✕, the backdrop or
     Back. Sized off the reference against its mic (64x5 : 66.7). */
  .dialgrab { width: 38px; height: 3px; border-radius: 2px; background: var(--hint); opacity: .5; margin: 8px auto 0; }
  .dialhead { display: flex; align-items: center; padding: var(--sp-3) var(--sp-4) var(--sp-2); }
  .dialhead .t { flex: 1; text-align: center; font-size: var(--t-title); font-weight: var(--w-semi); }
  /* The leading control is ✕ on page one and ← on page two — same slot, same size, so the title does
     not shift as the sheet changes page. The trailing spacer is the ✕'s mirror: without it the
     centred title would sit half a button right of the sheet's centre. */
  .dialhead .lead, .dialhead::after { width: 30px; flex: none; }
  .dialhead::after { content: ""; }
  .dialhead .lead { height: 30px; padding: 3px; border: none; background: transparent; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .dialhead .lead svg { width: 24px; height: 24px; display: block; }
  /* Two pages side by side inside a 200%-wide track; changing page slides the track. Its HEIGHT is
     set from the live page in JS — a track that is as tall as its tallest child leaves the shorter
     page sitting above dead space, which reads as a rendering fault rather than a short list. */
  .dialpages { display: flex; width: 200%; transition: transform .22s ease-out, height .22s ease-out; }
  #dial.p2 .dialpages { transform: translateX(-50%); }
  .dialpage { width: 50%; flex: none; padding: 0 var(--sp-3) var(--sp-3); align-self: flex-start; }
  /* One rounded card per group, rows divided by a hairline — the reference's shape. */
  .diallist { background: var(--sec); border-radius: var(--r-md); overflow: hidden; margin-top: var(--sp-2); }
  .dialrow { display: flex; align-items: center; gap: var(--sp-3); width: 100%; text-align: left;
    background: transparent; border: none; border-top: 1px solid var(--bg); color: var(--text);
    padding: 12px 14px; cursor: pointer; font-size: var(--t-body); }
  .dialrow:first-child { border-top: none; }
  .dialrow:active { background: var(--bg); }
  .dialrow .nm { flex: 1; min-width: 0; }
  .dialrow .nm .n { display: flex; align-items: center; gap: var(--sp-2); }
  .dialrow .nm .d { font-size: var(--t-sub); color: var(--hint-raised); margin-top: 2px; }
  /* Selected = the session's CURRENT dial (accent text + check). Default = what /settings 🐣 spawns
     with. Deliberately two different marks: they land on the same row as often as not, and a reader
     who only ever sees them together would take one for the other. */
  .dialrow.on { color: var(--link); }
  .dialrow.on .d { color: var(--link); }
  .dialrow .tick { width: 20px; height: 20px; flex: none; color: var(--link); display: none; }
  .dialrow.on .tick { display: block; }
  .dialrow .badge { flex: none; font-size: var(--t-meta); font-weight: var(--w-semi); color: var(--text);
    background: var(--bg); border-radius: 9px; padding: 2px 8px; }
  .dialrow .chev { width: 20px; height: 20px; flex: none; color: var(--hint); }
  .sprow { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: 18px; }
  .sprow .cancel { border: none; background: transparent; color: var(--hint); padding: 9px var(--sp-3); font-size: var(--t-sub); cursor: pointer; }
  .sprow .create { border: none; border-radius: 10px; background: var(--btn); color: var(--btn-text); padding: 9px 18px; font-size: var(--t-sub); cursor: pointer; }
  /* Scheduled board */
  .evrow { display: flex; gap: var(--sp-2); padding: var(--sp-2) 2px; border-bottom: 1px solid var(--sec); font-size: var(--t-sub); align-items: baseline; }
  .evrow .who { color: var(--link); white-space: nowrap; }
  .evrow .tx { color: var(--hint); flex: 1; word-break: break-word; }
  .xbtn { background: transparent; border: none; color: #e05555; font-size: var(--t-body); padding: 2px var(--sp-2); cursor: pointer; }
  .sechead { color: var(--hint); font-size: var(--t-meta); text-transform: uppercase; letter-spacing: .4px; margin: var(--sp-4) 2px var(--sp-2); }
</style>
</head>
<body>
<nav class="tabs" id="tabs">
  <button data-tab="sessions" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span>Sessions</span></button>
  <button data-tab="files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span>Files</span></button>
  <button data-tab="auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Scheduled</span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span>Settings</span></button>
</nav>
<div class="err" id="err"></div>

<div class="tab show panel" id="tab-sessions"><div class="notice">Loading sessions…</div></div>
<div class="tab panel" id="tab-auto"></div>

<div class="tab" id="tab-files">
  <header>
    <div class="crumbs" id="crumbs"></div>
    <div class="search">
      <input id="q" placeholder="find in this folder…" inputmode="search">
      <button id="go">Find</button>
    </div>
  </header>
  <ul id="list"></ul>
</div>
<input type="file" id="upload-input" multiple style="display:none">

<div class="tab panel" id="tab-settings"></div>

<div id="drill">
  <div class="vhead">
    <button id="dback" class="chatbtn back" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <div class="dtitle"><span class="nmrow"><span class="dot" id="ddot"></span><span class="name" id="dname"></span></span><span class="sub" id="dsub"></span></div>
    <!-- A filled red octagon: the drawn equivalent of 🛑, which is what it has to read as instantly.
         Drawn rather than the emoji so it matches the paperclip and mic, holds one colour instead of
         rendering differently per platform, and keeps this bar free of the clip-art it was cleared of.
         With the ✕ gone from this bar, nothing else competes for that red. -->
    <!-- A PAUSE glyph, and the word is true: this sends a single Escape, Claude Code's own interrupt.
         The turn halts, the session stays alive at its prompt and the conversation is intact, so the
         header's only remaining action really is a halt rather than a terminate; terminating moved to
         the session cards. Two bars in the square's exact bounding box (12.9 units), canonical pause
         proportions, caps rounded to match the softness of the reference's square. -->
    <button class="chatbtn stop" id="dstop" title="Interrupt" aria-label="Interrupt this session"><svg viewBox="0 0 24 24"><rect x="5.55" y="5.55" width="3.9" height="12.9" rx="1.7" fill="currentColor"/><rect x="14.55" y="5.55" width="3.9" height="12.9" rx="1.7" fill="currentColor"/></svg></button>
  </div>
  <div id="dfeed"></div>
  <div class="composer">
    <div class="inputwrap">
      <!-- Text only, no icon and no emoji, by the owner's call: the model name is the label. It leads
           the capsule the way the reference's blue "Open" chip does. -->
      <button id="ddial" class="dialpill" title="Model and effort"><b id="ddialm">Model</b><span class="eff" id="ddiale"></span></button>
      <textarea id="dtext" rows="1" placeholder="Message" autocomplete="off" spellcheck="false"></textarea>
      <button id="datt" class="ghost" title="Attach a file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
      <!-- The round button is mic OR send, never both. The PAPERCLIP stays inside the capsule through
         both states on purpose: type-then-attach is a real workflow, and sweeping the clip away with
         the mic the moment text appears would break it silently.
         Both round buttons are SIBLINGS OF THE TEXTAREA, not overlaid on it: the textarea is the only
         flex item that grows, so the buttons' width is reserved by the layout itself and text can
         never run underneath them, however long the placeholder gets. -->
      <button id="dmic" class="sendbtn" title="Record a voice note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>
      <!-- Solid, not outlined: this is the loudest element on the screen, and an outline plane is the
         quietest glyph treatment there is. Every chat app puts a filled mark on a filled button. -->
      <button id="dsend" class="sendbtn" title="Send"><svg viewBox="0 0 24 24"><polygon points="22 2 15 22 11 13 2 9 22 2" fill="currentColor"/></svg></button>
    </div>
    <input id="dfile" type="file" hidden>
  </div>
</div>

<!-- Model / effort picker for the OPEN session. Two pages in one sheet: the model list, and the
     effort list the "Effort" row slides across to. Rows are built in JS from the lists below. -->
<div id="dial">
  <div class="dialsheet">

          <div class="t">Select model</div>
        </div>
        <div class="diallist" id="dialmodels"></div>
        <div class="diallist"><button class="dialrow" id="dialeffort">
          <span class="nm"><span class="n">Effort</span><span class="d" id="dialeffnow"></span></span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button></div>
      </div>
      <div class="dialpage" id="dialp2">
        <div class="dialhead">
          <button class="lead" id="dialback" title="Back" aria-label="Back to models"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
          <div class="t">Effort</div>
        </div>
        <div class="diallist" id="dialefforts"></div>
      </div>

</div>

<!-- One chip's calls, in the dial's own chrome (grab, centred title, ✕ in the LEADING i.e. left slot). -->
<div id="calls">
  <div class="callsheet">
    <div class="dialgrab"></div>
    <div class="dialhead">
      <button class="lead" id="callx" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <div class="t" id="calltitle"></div>
    </div>
    <div id="calllist"></div>
  </div>
</div>

<div id="spawn">
  <div class="sheet">
    <div class="shead">New session</div>
    <input id="spname" placeholder="Name (topic + folder under the base dir)">
    <div class="seglbl">Model</div><div class="segrow" id="spmodel"></div>
    <div class="seglbl">Effort</div><div class="segrow" id="speffort"></div>
    <div class="seglbl">Mode</div><div class="segrow" id="spmode"></div>
    <div class="seglbl">Surface</div><div class="segrow" id="spsurface"></div>
    <div class="sprow"><button id="spcancel" class="cancel">Cancel</button><button id="spgo" class="create">Create</button></div>
  </div>
</div>

<div id="sched">
  <div class="sheet">
    <div class="shead">New schedule</div>
    <input id="scwhen" placeholder="2h · every 09:00 · */30 9-17 * * 1-5">
    <div class="seglbl">Session</div><div class="segrow" id="scsess"></div>
    <div class="seglbl">Message</div>
    <textarea id="sctext" rows="3" placeholder="What to send when it fires"></textarea>
    <div class="sprow"><button id="sccancel" class="cancel">Cancel</button><button id="scgo" class="create">Create</button></div>
  </div>
</div>

<div id="viewer">
  <div class="vhead">
    <button id="vback">←</button>
    <span class="name" id="vname"></span>
    <button id="vedit" style="display:none">✏️</button>
    <button id="vsave" style="display:none">💾</button>
    <button id="vdl">⬇️</button>
    <button id="vclose">✕</button>
  </div>
  <pre id="vbody"></pre>
  <textarea id="vedit-area" style="display:none"></textarea>
  <div class="notice" id="vnotice" style="display:none"></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const INIT = (tg && tg.initData) || "";
const AUTH = { Authorization: "tma " + INIT };

const $ = id => document.getElementById(id);
const errBox = $("err");
function showErr(m) { errBox.textContent = m; errBox.classList.add("show"); setTimeout(() => errBox.classList.remove("show"), 4000); }
function showOk(m) { errBox.textContent = m; errBox.classList.add("show", "ok"); setTimeout(() => errBox.classList.remove("show", "ok"), 2500); }

const LONG_MSG = 700;   // chars past which a feed bubble collapses behind a tap-to-expand
let WRITE = false;   // set from /api/ls (.write) — gates all edit/delete UI; mirrors WEBAPP_WRITE on the server

// POST a JSON write op with auth; surface server errors (incl. 409 edit conflicts). Returns parsed body or null.
async function writeOp(endpoint, body) {
  try {
    const r = await fetch(new URL(endpoint, location.origin), {
      method: "POST", headers: { ...AUTH, "content-type": "application/json" }, body: JSON.stringify(body),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { showErr(d.reason || d.error || ("HTTP " + r.status)); return null; }
    return d;
  } catch { showErr("request failed"); return null; }
}

async function api(path, params) {
  const u = new URL(path, location.origin);
  for (const k in (params || {})) u.searchParams.set(k, params[k]);
  const r = await fetch(u, { headers: AUTH });
  if (!r.ok) { showErr("API " + r.status + (r.status === 401 ? " — open from Telegram" : r.status === 403 ? " — not authorized" : "")); throw new Error(r.status); }
  return r.json();
}

function fmtSize(n) { if (n < 1024) return n + "B"; if (n < 1048576) return (n / 1024).toFixed(0) + "KB"; return (n / 1048576).toFixed(1) + "MB"; }

let cur = new URLSearchParams(location.search).get("start") || "/";

function renderCrumbs(path) {
  const parts = path.split("/").filter(Boolean);
  let acc = "";
  const links = ['<a href="#" data-p="/">/</a>'];
  for (const p of parts) { acc += "/" + p; links.push('<a href="#" data-p="' + acc + '">' + p + '</a>'); }
  $("crumbs").innerHTML = links.join(" <span style=color:var(--hint)>›</span> ");
  $("crumbs").querySelectorAll("a").forEach(a => a.onclick = e => { e.preventDefault(); ls(a.dataset.p); });
}

async function ls(path) {
  let data;
  try { data = await api("/api/ls", { path }); } catch { return; }
  cur = data.path;
  WRITE = !!data.write;
  renderCrumbs(cur);
  const list = $("list");
  list.innerHTML = "";
  if (data.parent) list.appendChild(row("⬆️", "..", "", () => ls(data.parent)));
  if (WRITE) { list.appendChild(row("📤", "Upload file", "", pickUpload)); list.appendChild(row("➕", "New folder…", "", newFolder)); }
  for (const e of data.entries) {
    const ico = e.type === "dir" ? "📁" : e.type === "symlink" ? "🔗" : "📄";
    const meta = e.type === "dir" ? "" : fmtSize(e.size);
    const full = (cur === "/" ? "" : cur) + "/" + e.name;
    list.appendChild(row(ico, e.name, meta, e.type === "dir" ? () => ls(full) : () => openFile(full), { path: full, type: e.type }));
  }
}

function row(ico, name, meta, onclick, opts) {
  const li = document.createElement("li");
  li.innerHTML = '<span class="ico"></span><span class="name"></span><span class="meta"></span>';
  li.children[0].textContent = ico; li.children[1].textContent = name; li.children[2].textContent = meta;
  li.onclick = onclick;
  // Show the ⋯ menu for every file (Download is read-only-safe) and, when WRITE, for folders too.
  if (opts && opts.path && (opts.type === "file" || WRITE)) {
    const b = document.createElement("button");
    b.className = "rowbtn"; b.textContent = "⋯";
    b.onclick = e => { e.stopPropagation(); rowMenu(opts.path, opts.type); };
    li.appendChild(b);
  }
  return li;
}

let vPath = null, vMtime = 0, vEditable = false;

async function openFile(path) {
  let data;
  try { data = await api("/api/read", { path }); } catch { return; }
  $("vname").textContent = path.split("/").pop();
  const body = $("vbody"), notice = $("vnotice"), ta = $("vedit-area");
  vPath = path; vMtime = data.mtime || 0; vEditable = !data.binary && !data.tooLarge;
  $("vdl").onclick = () => download(path);
  ta.style.display = "none"; $("vsave").style.display = "none";          // reset to view state every open
  $("vedit").style.display = (WRITE && vEditable) ? "" : "none";
  if (data.binary || data.tooLarge) {
    body.style.display = "none"; notice.style.display = "block";
    notice.textContent = data.binary ? "Binary file — download to view." : "File too large to preview (" + fmtSize(data.size) + ") — download it.";
  } else {
    notice.style.display = "none"; body.style.display = "block";
    body.textContent = data.content;
  }
  $("viewer").classList.add("show");
}
$("vclose").onclick = () => $("viewer").classList.remove("show");
// Back: leave the viewer and land in the folder the file lives in (robust even after a search).
$("vback").onclick = () => { $("viewer").classList.remove("show"); ls(vPath ? (vPath.split("/").slice(0, -1).join("/") || "/") : cur); };

// Edit: swap the <pre> for an editable textarea; Save POSTs /api/write with the mtime we read, so the
// server 409s if the file changed underneath us. Edit/Save buttons only render when WRITE && text file.
$("vedit").onclick = () => {
  const ta = $("vedit-area");
  ta.value = $("vbody").textContent;
  $("vbody").style.display = "none"; ta.style.display = "block";
  $("vedit").style.display = "none"; $("vsave").style.display = "";
  ta.focus();
};
$("vsave").onclick = async () => {
  const ta = $("vedit-area");
  const d = await writeOp("/api/write", { path: vPath, content: ta.value, mtime: vMtime });
  if (!d) return;   // error (incl. conflict) already surfaced
  vMtime = d.mtime; $("vbody").textContent = ta.value;
  ta.style.display = "none"; $("vbody").style.display = "block";
  $("vsave").style.display = "none"; $("vedit").style.display = "";
  showOk("Saved");
};

// Per-row ⋯ menu (rename / delete-to-trash); native Telegram popups when available, prompt() otherwise.
function rowMenu(path, type) {
  const name = path.split("/").pop() || path;
  const buttons = [];
  if (type === "file") buttons.push({ id: "download", text: "Download" });
  if (WRITE) { buttons.push({ id: "rename", text: "Rename" }); buttons.push({ id: "delete", type: "destructive", text: "Delete" }); }
  if (buttons.length < 3) buttons.push({ id: "cancel", type: "cancel" });   // Telegram popups allow ≤3 buttons
  const act = id => {
    if (id === "download") download(path);
    else if (id === "rename") { const nn = prompt('Rename "' + name + '" to:', name); if (nn && nn !== name) writeOp("/api/rename", { path, newName: nn }).then(d => { if (d) { showOk("Renamed"); ls(cur); } }); }
    else if (id === "delete") confirmDelete(path, name);
  };
  if (tg && tg.showPopup) tg.showPopup({ title: name, message: "File actions", buttons }, act);
  else {
    const keys = [type === "file" ? "S to save" : null, WRITE ? "R to rename" : null, WRITE ? "D to delete" : null].filter(Boolean).join(", ");
    const c = prompt('"' + name + '" — type ' + keys);
    if (c === "S" || c === "s") act("download"); else if (c === "R" || c === "r") act("rename"); else if (c === "D" || c === "d") act("delete");
  }
}
function confirmDelete(path, name) {
  const go = () => writeOp("/api/rm", { path }).then(d => { if (d) { showOk("Moved to trash"); ls(cur); } });
  if (tg && tg.showConfirm) tg.showConfirm('Move "' + name + '" to trash?', ok => { if (ok) go(); });
  else if (confirm('Move "' + name + '" to trash?')) go();
}
async function newFolder() {
  const n = prompt("New folder name:");
  if (!n) return;
  const d = await writeOp("/api/mkdir", { path: cur, name: n });
  if (d) { showOk("Folder created"); ls(cur); }
}
// Upload from device: a hidden <input type=file> opens the native picker; each chosen file is POSTed
// as multipart to /api/upload (into the folder open when picked), then the folder refreshes. Collisions
// auto-dedup server-side, so re-uploading never clobbers. FormData sets its own content-type → AUTH only.
const uploadInput = $("upload-input");
function pickUpload() { uploadInput.value = ""; uploadInput.click(); }
uploadInput.onchange = async () => {
  const files = [...uploadInput.files];
  if (!files.length) return;
  const dir = cur;   // capture now — the user could navigate before uploads finish
  let okN = 0;
  for (const f of files) {
    const fd = new FormData();
    fd.append("dir", dir); fd.append("file", f, f.name);
    try {
      const r = await fetch(new URL("/api/upload", location.origin), { method: "POST", headers: AUTH, body: fd });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { showErr((f.name) + ": " + (d.reason || d.error || ("HTTP " + r.status))); continue; }
      okN++;
    } catch { showErr("upload failed: " + f.name); }
  }
  if (okN) { showOk("Uploaded " + okN + " file" + (okN === 1 ? "" : "s")); if (cur === dir) ls(dir); }
};

// Mint a short-lived download token (authed) so a header-less fetch — Telegram's native saver or the
// external browser — can pull the file. Returns the token, or null on failure.
async function dlToken(path) {
  try {
    const r = await fetch(new URL("/api/dl-token", location.origin), {
      method: "POST", headers: { ...AUTH, "content-type": "application/json" }, body: JSON.stringify({ path }),
    });
    const d = await r.json().catch(() => ({}));
    return r.ok ? d.token : null;
  } catch { return null; }
}

// Save a file to the device. Prefer Telegram's native "Save to Files" dialog (downloadFile, Bot API
// 8.0+); else open the tokenized URL in the external browser (it downloads via Content-Disposition);
// else (plain browser / dev) fetch with auth and click a blob <a download>. The first two fetch the URL
// without our header, so they go through a token; the blob path stays header-authed.
async function download(path) {
  const name = path.split("/").pop();
  const canNative = tg && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") && tg.downloadFile;
  const canOpen = tg && tg.openLink;
  if (canNative || canOpen) {
    const tok = await dlToken(path);
    if (tok) {
      const u = new URL("/api/download", location.origin);
      u.searchParams.set("path", path); u.searchParams.set("t", tok);
      const abs = u.toString();
      if (canNative) { tg.downloadFile({ url: abs, file_name: name }); return; }
      tg.openLink(abs); return;
    }
    // token mint failed — fall through to the blob path
  }
  try {
    const r = await fetch(new URL("/api/download?path=" + encodeURIComponent(path), location.origin), { headers: AUTH });
    if (!r.ok) { showErr("download " + r.status); return; }
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch { showErr("download failed"); }
}

async function find() {
  const q = $("q").value.trim();
  if (!q) return ls(cur);
  let data;
  try { data = await api("/api/find", { root: cur, q }); } catch { return; }
  renderCrumbs(cur);
  const list = $("list"); list.innerHTML = "";
  list.appendChild(row("🔍", q + " — " + data.matches.length + (data.capped ? "+" : "") + " match(es)", "", () => ls(cur)));
  for (const m of data.matches) list.appendChild(row("📄", m.replace(cur === "/" ? "" : cur, "") || m, "", () => openFile(m)));
}
$("go").onclick = find;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") find(); });

// ---- Tabs (Sessions / Files / Scheduled / Settings) ----
// Sessions is the homepage. It refreshes on an interval while visible; the interval is torn down
// on every tab switch and paused when Telegram backgrounds the webview.
let curTab = "sessions";
let tabTimer = null;
let filesLoaded = false;
function setLive(fn, ms) {
  clearInterval(tabTimer);
  tabTimer = setInterval(() => { if (!document.hidden && !$("drill").classList.contains("show")) fn(); }, ms);
}
// File browser omitted server-side (settings → 🗂 File browser off): the served shell carries
// data-files="off" and the Files tab is REMOVED from the DOM, not hidden. Its API 403s too.
const FILES = document.body.dataset.files !== "off";
if (!FILES) {
  const fb = document.querySelector('#tabs button[data-tab="files"]'); if (fb) fb.remove();
  const ft = $("tab-files"); if (ft) ft.remove();
}
async function showTab(name) {
  curTab = name;
  clearInterval(tabTimer);
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("show", t.id === "tab-" + name));
  if (name === "sessions") { renderSessions(); setLive(renderSessions, 4000); }
  else if (name === "auto") renderAuto();
  else if (name === "files") { if (!filesLoaded) { filesLoaded = true; ls(cur); } }
  else if (name === "settings") renderSettings();
}

  $("ddot").className = "dot " + (d.working ? "on" : "");
