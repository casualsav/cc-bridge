<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cc-bridge</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17212b);
    --sec: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #7d8b99);
    --link: var(--tg-theme-link-color, #6ab3f3);
    --btn: var(--tg-theme-button-color, #5288c1);
    --btn-text: var(--tg-theme-button-text-color, #fff);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  /* Form controls don't inherit fonts by default (the composer was silently falling back to the
     UA's monospace); give them the app stack — later per-element rules (#vedit-area) still win. */
  input, button, select, textarea { font: inherit; }
  header { position: sticky; top: 0; background: var(--bg); padding: 10px 12px; border-bottom: 1px solid var(--sec); }
  .crumbs { font-size: 13px; color: var(--hint); word-break: break-all; margin-bottom: 8px; }
  .crumbs a { color: var(--link); text-decoration: none; }
  .search { display: flex; gap: 6px; }
  .search input { flex: 1; padding: 8px 10px; border-radius: 8px; border: none; background: var(--sec); color: var(--text); font-size: 14px; }
  .search button { padding: 8px 12px; border: none; border-radius: 8px; background: var(--btn); color: var(--btn-text); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 11px 12px; border-bottom: 1px solid var(--sec); display: flex; gap: 10px; align-items: center; cursor: pointer; }
  li:active { background: var(--sec); }
  .ico { width: 20px; text-align: center; }
  .name { flex: 1; word-break: break-all; }
  .meta { color: var(--hint); font-size: 12px; white-space: nowrap; }
  #viewer { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; }
  #viewer.show { display: flex; }
  .vhead { padding: 10px 12px; border-bottom: 1px solid var(--sec); display: flex; gap: 8px; align-items: center; }
  .vhead .name { font-size: 14px; }
  /* :not(.ghost) — the chat header's buttons opt into the composer's ghost-icon treatment, and this
     rule (a class+type selector) would otherwise outrank .ghost and paint them as solid pills. */
  .vhead button:not(.ghost) { padding: 7px 11px; border: none; border-radius: 8px; background: var(--btn); color: var(--btn-text); }
  /* Header ghosts carry the glyph's own color (the composer's are emoji, which don't), and they're
     primary controls — hint grey leaves ← and ⏹ barely visible on the dark background. */
  .vhead .ghost { color: var(--text); }
  pre { margin: 0; padding: 12px; overflow: auto; flex: 1; white-space: pre; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  .notice { padding: 24px 16px; color: var(--hint); text-align: center; }
  .err { background: #c0392b; color: #fff; padding: 8px 12px; font-size: 13px; display: none; }
  .err.show { display: block; }
  .err.ok { background: #2e7d32; }
  button.rowbtn { background: transparent; border: none; color: var(--hint); font-size: 18px; line-height: 1; padding: 2px 8px; cursor: pointer; }
  textarea#vedit-area { margin: 0; padding: 12px; border: none; outline: none; flex: 1; width: 100%; resize: none; background: var(--bg); color: var(--text); font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  /* Tab bar: icon-over-label, one stroke-icon family (inherits color via currentColor) */
  .tabs { display: flex; position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--sec); }
  .tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 7px; border: none; background: transparent; color: var(--hint); font-size: 11px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button svg { width: 20px; height: 20px; }
  .tabs button.active { color: var(--btn); border-bottom-color: var(--btn); }
  .tab { display: none; }
  .tab.show { display: block; }
  /* Console (Settings / Usage / Diff) */
  .panel { padding: 12px; }
  .card { background: var(--sec); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .card .k { color: var(--hint); font-size: 12px; }
  .card .v { font-size: 16px; margin-top: 2px; word-break: break-word; }
  .setrow { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--sec); }
  .setrow:last-child { border-bottom: none; }
  .setrow .lbl { flex: 1; }
  .setrow .lbl .sub { color: var(--hint); font-size: 12px; }
  .setrow .ro { color: var(--hint); font-size: 13px; }
  .toggle { padding: 6px 12px; border: none; border-radius: 8px; background: var(--btn); color: var(--btn-text); font-size: 13px; cursor: pointer; min-width: 56px; }
  .toggle.off { background: var(--sec); color: var(--hint); box-shadow: inset 0 0 0 1px var(--hint); }
  select.seg { padding: 6px 8px; border-radius: 8px; border: none; background: var(--bg); color: var(--text); font-size: 13px; box-shadow: inset 0 0 0 1px var(--sec); }
  .bar { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; margin-top: 6px; box-shadow: inset 0 0 0 1px var(--sec); }
  .bar > span { display: block; height: 100%; background: var(--btn); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* Sessions dashboard */
  .sess { background: var(--sec); border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; cursor: pointer; }
  .sess:active { filter: brightness(1.1); }
  .sess .top { display: flex; align-items: center; gap: 8px; }
  .sess .nm { font-weight: 600; flex: 1; word-break: break-word; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hint); flex: none; }
  .dot.on { background: #4caf50; animation: pulse 1.6s ease-in-out infinite; }
  .dot.dead { background: #e05555; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .chip { font-size: 11px; color: var(--hint); background: var(--bg); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  .sess .task { color: var(--hint); font-size: 13px; margin-top: 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .sess .foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--hint); }
  .sess .foot .bar { flex: 1; margin-top: 0; height: 5px; }
  /* Drill-in (session detail) */
  #drill { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 5; }
  #drill.show { display: flex; }
  #dfeed { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { max-width: 88%; margin-bottom: 8px; padding: 8px 11px; border-radius: 12px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: var(--btn); color: var(--btn-text); margin-left: auto; border-bottom-right-radius: 4px; }
  .msg.user.pending { opacity: .55; }
  .msg.assistant { background: var(--sec); border-bottom-left-radius: 4px; }
  .msg.activity { background: transparent; color: var(--hint); font: italic 12px/1.4 ui-monospace, monospace; padding: 2px 11px; margin-bottom: 3px; }
  /* Live narration — prose, so it gets the app font, not the activity feed's monospace. The quote
     bar is the DOM counterpart of the <blockquote> the Telegram live card renders it in. */
  .msg.thought { background: transparent; color: var(--hint); font-size: 13.5px; max-width: 100%; padding: 1px 0 1px 10px; margin: 4px 0 6px 11px; border-left: 2px solid var(--sec); white-space: pre-wrap; }
  /* Telegram-style composer: one pill input with the paperclip/mic INSIDE it, a round send button */
  .composer { display: flex; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--sec); align-items: flex-end; }
  .inputwrap { flex: 1; display: flex; align-items: flex-end; background: var(--sec); border-radius: 19px; padding: 2px 4px 2px 14px; min-height: 40px; }
  /* Explicit font (not `inherit`): Android WebViews don't reliably propagate an inherited font
     into the IME composition / autofill layer, which then renders in the UA default. */
  .inputwrap textarea { flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--text); padding: 9px 0; font: 15px/1.35 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; max-height: 110px; }
  .ghost { background: transparent; border: none; color: var(--hint); font-size: 19px; padding: 8px 7px; cursor: pointer; line-height: 1; flex: none; }
  .ghost.recing { color: #e05555; animation: pulse 1.2s ease-in-out infinite; }
  .sendbtn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--btn); color: var(--btn-text); font-size: 17px; flex: none; display: flex; align-items: center; justify-content: center; padding: 0 2px 2px 0; }
  /* Feed extras: command chip, attachment chip, inline photo, light markdown */
  .msg.cmd { background: transparent; color: var(--link); font: 13px/1.4 ui-monospace, Menlo, monospace; margin-left: auto; padding: 2px 11px; max-width: 88%; }
  .msg .attchip { font-size: 13px; opacity: .92; margin-bottom: 4px; }
  .msg img.thumb { max-width: 100%; min-height: 40px; border-radius: 9px; display: block; }
  .msg img.thumb + .cap { margin-top: 6px; }
  .msg code { background: rgba(125,139,153,.25); border-radius: 4px; padding: 0 4px; font: 13px ui-monospace, Menlo, monospace; }
  .msg pre.code { background: rgba(0,0,0,.28); border-radius: 8px; padding: 8px 10px; overflow-x: auto; font: 12.5px/1.45 ui-monospace, Menlo, monospace; margin: 4px 0; white-space: pre; }
  /* "+" new-session row + bottom sheet */
  .newsess { border: 1px dashed var(--hint); border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; color: var(--link); text-align: center; cursor: pointer; font-size: 14px; }
  #spawn, #sched { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 9; align-items: flex-end; }
  #spawn.show, #sched.show { display: flex; }
  .sheet { background: var(--bg); border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); width: 100%; }
  .sheet .shead { font-weight: 600; font-size: 16px; margin-bottom: 12px; }
  .sheet input, .sheet textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: none; background: var(--sec); color: var(--text); font-size: 14px; }
  .sheet textarea { resize: none; font-family: inherit; }
  .seglbl { color: var(--hint); font-size: 12px; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .4px; }
  .segrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .selchip { border: none; border-radius: 14px; padding: 6px 12px; background: var(--sec); color: var(--hint); font-size: 13px; cursor: pointer; }
  .selchip.on { background: var(--btn); color: var(--btn-text); }
  .sprow { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .sprow .cancel { border: none; background: transparent; color: var(--hint); padding: 9px 12px; font-size: 14px; cursor: pointer; }
  .sprow .create { border: none; border-radius: 10px; background: var(--btn); color: var(--btn-text); padding: 9px 18px; font-size: 14px; cursor: pointer; }
  /* Scheduled board */
  .evrow { display: flex; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--sec); font-size: 13px; align-items: baseline; }
  .evrow .who { color: var(--link); white-space: nowrap; }
  .evrow .tx { color: var(--hint); flex: 1; word-break: break-word; }
  .xbtn { background: transparent; border: none; color: #e05555; font-size: 16px; padding: 2px 8px; cursor: pointer; }
  .sechead { color: var(--hint); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; margin: 16px 2px 8px; }
</style>
</head>
<body>
<nav class="tabs" id="tabs">
  <button data-tab="sessions" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span>Sessions</span></button>
  <button data-tab="files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span>Files</span></button>
  <button data-tab="auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Scheduled</span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span>Settings</span></button>
</nav>
<div class="err" id="err"></div>

<div class="tab show panel" id="tab-sessions"><div class="notice">Loading sessions…</div></div>
<div class="tab panel" id="tab-auto"></div>

<div class="tab" id="tab-files">
  <header>
    <div class="crumbs" id="crumbs"></div>
    <div class="search">
      <input id="q" placeholder="find in this folder…" inputmode="search">
      <button id="go">Find</button>
    </div>
  </header>
  <ul id="list"></ul>
</div>
<input type="file" id="upload-input" multiple style="display:none">

<div class="tab panel" id="tab-settings"></div>

<div id="drill">
  <div class="vhead">
    <button id="dback" class="ghost">←</button>
    <span class="dot" id="ddot"></span>
    <span class="name" id="dname"></span>
    <button class="ghost" id="dstop" title="Interrupt">⏹</button>
    <button class="ghost" id="dcompact" title="Compact">🗜</button>
    <button class="ghost" id="dclose" title="Close session" style="color:#e05555">✕</button>
  </div>
  <div id="dfeed"></div>
  <div class="composer">
    <div class="inputwrap">
      <textarea id="dtext" rows="1" placeholder="Message this session…" autocomplete="off" spellcheck="false"></textarea>
      <button id="datt" class="ghost" title="Attach a file">📎</button>
      <button id="dmic" class="ghost" title="Record a voice note">🎤</button>
    </div>
    <input id="dfile" type="file" hidden>
    <button id="dsend" class="sendbtn">➤</button>
  </div>
</div>

<div id="spawn">
  <div class="sheet">
    <div class="shead">New session</div>
    <input id="spname" placeholder="Name (topic + folder under the base dir)">
    <div class="seglbl">Model</div><div class="segrow" id="spmodel"></div>
    <div class="seglbl">Effort</div><div class="segrow" id="speffort"></div>
    <div class="seglbl">Mode</div><div class="segrow" id="spmode"></div>
    <div class="seglbl">Surface</div><div class="segrow" id="spsurface"></div>
    <div class="sprow"><button id="spcancel" class="cancel">Cancel</button><button id="spgo" class="create">Create</button></div>
  </div>
</div>

<div id="sched">
  <div class="sheet">
    <div class="shead">New schedule</div>
    <input id="scwhen" placeholder="2h · every 09:00 · */30 9-17 * * 1-5">
    <div class="seglbl">Session</div><div class="segrow" id="scsess"></div>
    <div class="seglbl">Message</div>
    <textarea id="sctext" rows="3" placeholder="What to send when it fires"></textarea>
    <div class="sprow"><button id="sccancel" class="cancel">Cancel</button><button id="scgo" class="create">Create</button></div>
  </div>
</div>

<div id="viewer">
  <div class="vhead">
    <button id="vback">←</button>
    <span class="name" id="vname"></span>
    <button id="vedit" style="display:none">✏️</button>
    <button id="vsave" style="display:none">💾</button>
    <button id="vdl">⬇️</button>
    <button id="vclose">✕</button>
  </div>
  <pre id="vbody"></pre>
  <textarea id="vedit-area" style="display:none"></textarea>
  <div class="notice" id="vnotice" style="display:none"></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const INIT = (tg && tg.initData) || "";
const AUTH = { Authorization: "tma " + INIT };

const $ = id => document.getElementById(id);
const errBox = $("err");
function showErr(m) { errBox.textContent = m; errBox.classList.add("show"); setTimeout(() => errBox.classList.remove("show"), 4000); }
function showOk(m) { errBox.textContent = m; errBox.classList.add("show", "ok"); setTimeout(() => errBox.classList.remove("show", "ok"), 2500); }

let WRITE = false;   // set from /api/ls (.write) — gates all edit/delete UI; mirrors WEBAPP_WRITE on the server

// POST a JSON write op with auth; surface server errors (incl. 409 edit conflicts). Returns parsed body or null.
async function writeOp(endpoint, body) {
  try {
    const r = await fetch(new URL(endpoint, location.origin), {
      method: "POST", headers: { ...AUTH, "content-type": "application/json" }, body: JSON.stringify(body),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { showErr(d.reason || d.error || ("HTTP " + r.status)); return null; }
    return d;
  } catch { showErr("request failed"); return null; }
}

async function api(path, params) {
  const u = new URL(path, location.origin);
  for (const k in (params || {})) u.searchParams.set(k, params[k]);
  const r = await fetch(u, { headers: AUTH });
  if (!r.ok) { showErr("API " + r.status + (r.status === 401 ? " — open from Telegram" : r.status === 403 ? " — not authorized" : "")); throw new Error(r.status); }
  return r.json();
}

function fmtSize(n) { if (n < 1024) return n + "B"; if (n < 1048576) return (n / 1024).toFixed(0) + "KB"; return (n / 1048576).toFixed(1) + "MB"; }

let cur = new URLSearchParams(location.search).get("start") || "/";

function renderCrumbs(path) {
  const parts = path.split("/").filter(Boolean);
  let acc = "";
  const links = ['<a href="#" data-p="/">/</a>'];
  for (const p of parts) { acc += "/" + p; links.push('<a href="#" data-p="' + acc + '">' + p + '</a>'); }
  $("crumbs").innerHTML = links.join(" <span style=color:var(--hint)>›</span> ");
  $("crumbs").querySelectorAll("a").forEach(a => a.onclick = e => { e.preventDefault(); ls(a.dataset.p); });
}

async function ls(path) {
  let data;
  try { data = await api("/api/ls", { path }); } catch { return; }
  cur = data.path;
  WRITE = !!data.write;
  renderCrumbs(cur);
  const list = $("list");
  list.innerHTML = "";
  if (data.parent) list.appendChild(row("⬆️", "..", "", () => ls(data.parent)));
  if (WRITE) { list.appendChild(row("📤", "Upload file", "", pickUpload)); list.appendChild(row("➕", "New folder…", "", newFolder)); }
  for (const e of data.entries) {
    const ico = e.type === "dir" ? "📁" : e.type === "symlink" ? "🔗" : "📄";
    const meta = e.type === "dir" ? "" : fmtSize(e.size);
    const full = (cur === "/" ? "" : cur) + "/" + e.name;
    list.appendChild(row(ico, e.name, meta, e.type === "dir" ? () => ls(full) : () => openFile(full), { path: full, type: e.type }));
  }
}

function row(ico, name, meta, onclick, opts) {
  const li = document.createElement("li");
  li.innerHTML = '<span class="ico"></span><span class="name"></span><span class="meta"></span>';
  li.children[0].textContent = ico; li.children[1].textContent = name; li.children[2].textContent = meta;
  li.onclick = onclick;
  // Show the ⋯ menu for every file (Download is read-only-safe) and, when WRITE, for folders too.
  if (opts && opts.path && (opts.type === "file" || WRITE)) {
    const b = document.createElement("button");
    b.className = "rowbtn"; b.textContent = "⋯";
    b.onclick = e => { e.stopPropagation(); rowMenu(opts.path, opts.type); };
    li.appendChild(b);
  }
  return li;
}

let vPath = null, vMtime = 0, vEditable = false;

async function openFile(path) {
  let data;
  try { data = await api("/api/read", { path }); } catch { return; }
  $("vname").textContent = path.split("/").pop();
  const body = $("vbody"), notice = $("vnotice"), ta = $("vedit-area");
  vPath = path; vMtime = data.mtime || 0; vEditable = !data.binary && !data.tooLarge;
  $("vdl").onclick = () => download(path);
  ta.style.display = "none"; $("vsave").style.display = "none";          // reset to view state every open
  $("vedit").style.display = (WRITE && vEditable) ? "" : "none";
  if (data.binary || data.tooLarge) {
    body.style.display = "none"; notice.style.display = "block";
    notice.textContent = data.binary ? "Binary file — download to view." : "File too large to preview (" + fmtSize(data.size) + ") — download it.";
  } else {
    notice.style.display = "none"; body.style.display = "block";
    body.textContent = data.content;
  }
  $("viewer").classList.add("show");
}
$("vclose").onclick = () => $("viewer").classList.remove("show");
// Back: leave the viewer and land in the folder the file lives in (robust even after a search).
$("vback").onclick = () => { $("viewer").classList.remove("show"); ls(vPath ? (vPath.split("/").slice(0, -1).join("/") || "/") : cur); };

// Edit: swap the <pre> for an editable textarea; Save POSTs /api/write with the mtime we read, so the
// server 409s if the file changed underneath us. Edit/Save buttons only render when WRITE && text file.
$("vedit").onclick = () => {
  const ta = $("vedit-area");
  ta.value = $("vbody").textContent;
  $("vbody").style.display = "none"; ta.style.display = "block";
  $("vedit").style.display = "none"; $("vsave").style.display = "";
  ta.focus();
};
$("vsave").onclick = async () => {
  const ta = $("vedit-area");
  const d = await writeOp("/api/write", { path: vPath, content: ta.value, mtime: vMtime });

// Per-row ⋯ menu (rename / delete-to-trash); native Telegram popups when available, prompt() otherwise.
function rowMenu(path, type) {
  const name = path.split("/").pop() || path;

  if (buttons.length < 3) buttons.push({ id: "cancel", type: "cancel" });   // Telegram popups allow ≤3 buttons
  const act = id => {

    const c = prompt('"' + name + '" — type ' + keys);

// Upload from device: a hidden <input type=file> opens the native picker; each chosen file is POSTed
// as multipart to /api/upload (into the folder open when picked), then the folder refreshes. Collisions
// auto-dedup server-side, so re-uploading never clobbers. FormData sets its own content-type → AUTH only.
const uploadInput = $("upload-input");

  const files = [...uploadInput.files];

      const d = await r.json().catch(() => ({}));

// Mint a short-lived download token (authed) so a header-less fetch — Telegram's native saver or the
// external browser — can pull the file. Returns the token, or null on failure.
async function dlToken(path) {
  try {
    const r = await fetch(new URL("/api/dl-token", location.origin), {
      method: "POST", headers: { ...AUTH, "content-type": "application/json" }, body: JSON.stringify({ path }),
    });
    const d = await r.json().catch(() => ({}));
    return r.ok ? d.token : null;
  } catch { return null; }
}

// Save a file to the device. Prefer Telegram's native "Save to Files" dialog (downloadFile, Bot API
// 8.0+); else open the tokenized URL in the external browser (it downloads via Content-Disposition);
// else (plain browser / dev) fetch with auth and click a blob <a download>. The first two fetch the URL
// without our header, so they go through a token; the blob path stays header-authed.
async function download(path) {
  const name = path.split("/").pop();
  const canNative = tg && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") && tg.downloadFile;
  const canOpen = tg && tg.openLink;
  if (canNative || canOpen) {
    const tok = await dlToken(path);
    if (tok) {
      const u = new URL("/api/download", location.origin);
      u.searchParams.set("path", path); u.searchParams.set("t", tok);
      const abs = u.toString();
      if (canNative) { tg.downloadFile({ url: abs, file_name: name }); return; }
      tg.openLink(abs); return;
    }
    // token mint failed — fall through to the blob path
  }
  try {
    const r = await fetch(new URL("/api/download?path=" + encodeURIComponent(path), location.origin), { headers: AUTH });
    if (!r.ok) { showErr("download " + r.status); return; }
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch { showErr("download failed"); }
}

// ---- Drill-in: conversation feed + composer + stop/compact ----
let drillSid = null, drillTimer = null, lastDrill = null, optimistic = [];
function openDrill(sid, name) {

  $("dname").textContent = name;

function closeDrill() { $("drill").classList.remove("show"); clearInterval(drillTimer); drillSid = null; renderSessions(); }
$("dback").onclick = closeDrill;
// Minimal markdown for assistant bubbles (escape-first, so it can never inject): fenced code,
// inline code, bold, italic. Anything fancier stays plain text.
function md(s) {
  let h = esc(s);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, c) => '<pre class="code">' + c.replace(/\n$/, "") + "</pre>");
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:]|$)/g, "$1<i>$2</i>");
  return h;
}
// One feed row → bubble HTML. Slash commands render as a quiet mono chip; attachments as a photo
// thumbnail (hydrated after paint) / 📎 chip with the caption; assistant text gets light markdown.
function bubble(i) {
  if (i.role === "activity") return '<div class="msg activity">' + esc(i.text) + "</div>";
  if (i.role === "thought") return '<div class="msg thought">' + esc(i.text) + "</div>";
  if (i.cmd) return '<div class="msg cmd">' + esc(i.text) + "</div>";
  let inner = "";
  const placeholder = /^\((?:file|photo|document|video|voice|audio)[:)]?/.test(i.text || "");
  // Already-fetched photos render with their blob URL inline, so a repaint never collapses the
  // bubble's height (the collapse re-broke the scroll position on every poll).
  if (i.img) inner += thumbCache[i.img]
    ? '<img class="thumb" src="' + esc(thumbCache[i.img]) + '" alt="photo">'
    : '<img class="thumb" data-path="' + esc(i.img) + '" alt="photo">';
  if (i.att) inner += '<div class="attchip">📎 ' + esc(String(i.att).split("/").pop()) + "</div>";
  const t = (i.img || i.att) && placeholder ? "" : (i.text || "");
  if (t) inner += (i.img ? '<div class="cap">' : "") + (i.role === "assistant" ? md(t) : esc(t)) + (i.img ? "</div>" : "");
  return inner ? '<div class="msg ' + i.role + '">' + inner + "</div>" : "";
}
// Fetch each photo once (header-authed → blob URL) and pop it into its bubble; re-pin the scroll
// as images change the feed height only if the user was already at the bottom.
const thumbCache = {};
function hydrateThumbs() {
  const feed = $("dfeed");
  document.querySelectorAll("#dfeed img.thumb[data-path]").forEach(async el => {
    const path = el.dataset.path; el.removeAttribute("data-path");
    if (!thumbCache[path]) {
      try {
        const r = await fetch(new URL("/api/download?path=" + encodeURIComponent(path), location.origin), { headers: AUTH });
        if (!r.ok) return;
        thumbCache[path] = URL.createObjectURL(await r.blob());
      } catch { return; }
    }
    const pinned = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
    el.onload = () => { if (pinned) feed.scrollTop = feed.scrollHeight; };
    el.src = thumbCache[path];
  });
}
// Paint the feed from the last server snapshot + any optimistic (locally-sent, not-yet-echoed)
// bubbles. An optimistic bubble is dropped once the transcript echoes the same user text (or
// after 2min as a safety valve, so a paraphrased echo can't leave a ghost forever).
let feedSig = "";
function paintFeed() {
  const feed = $("dfeed");
  const stuck = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;   // keep pinned to bottom unless the user scrolled up
  const items = lastDrill ? lastDrill.items : [];
  // A plain send reconciles on exact text; an attachment/voice send on the server-issued match
  // token (the unique inbox filename / the transcript) that the feed echo is guaranteed to carry.
  optimistic = optimistic.filter(o => !items.some(i => i.role === "user" && (o.match ? (i.text.includes(o.match) || String(i.img || i.att || "").includes(o.match)) : i.text.trim() === o.text)) && Date.now() - o.at < 120000);
  const rows = items.map(bubble)
    .concat(optimistic.map(o => '<div class="msg user' + (o.state === "pending" ? " pending" : "") + '">' + esc(o.text) + "</div>"));
  const html = rows.length ? rows.join("") : '<div class="notice">No conversation yet.</div>';
  if (html === feedSig) return;   // unchanged — never disturb the scroll while the user reads back
  feedSig = html;
  feed.innerHTML = html;
  if (stuck) feed.scrollTop = feed.scrollHeight;
  hydrateThumbs();
}
async function renderDrill() {
  if (!drillSid) return;
  let d; try { d = await api("/api/session/feed", { sid: drillSid }); } catch { return; }
  $("ddot").className = "dot " + (d.working ? "on" : "");
  lastDrill = d;
  paintFeed();
}
async function sessionAct(action, text) {
  const d = await writeOp("/api/session/act", { sid: drillSid, action, ...(text ? { text } : {}) });
  return !!d;
}
$("dstop").onclick = async () => { if (await sessionAct("stop")) showOk("Interrupted"); };
$("dcompact").onclick = async () => { if (await sessionAct("compact")) showOk("Compacting…"); };
$("dclose").onclick = async () => {

$("dsend").onclick = async () => {
  const ta = $("dtext"), text = ta.value.trim();
  if (!text) return;
  ta.value = "";
  // Optimistic: the bubble shows the instant you hit send (dimmed while in flight), instead of
  // waiting for the POST + transcript echo + poll round-trip.
  const o = { text, at: Date.now(), state: "pending" };
  optimistic.push(o);
  paintFeed();
  $("dfeed").scrollTop = $("dfeed").scrollHeight;   // sending always reveals your own message
  if (await sessionAct("send", text)) { o.state = "sent"; paintFeed(); setTimeout(renderDrill, 800); }
  else { optimistic = optimistic.filter(x => x !== o); paintFeed(); ta.value = text; }   // failed — give the draft back
};

// ---- Compose-row attachment + voice note ----
// Upload to /api/session/attach; the composer text rides along as the file's caption. The bubble
// paints optimistically and reconciles on the server's match token (see paintFeed).
async function attachToSession(file, { caption = "", voice = false, label }) {
  const o = { text: label, at: Date.now(), state: "pending", match: null };
  optimistic.push(o); paintFeed();
  $("dfeed").scrollTop = $("dfeed").scrollHeight;
  let d = null;
  try {
    const fd = new FormData();
    fd.append("sid", drillSid); fd.append("file", file, file.name);
    if (caption) fd.append("caption", caption);
    if (voice) fd.append("voice", "1");
    const r = await fetch(new URL("/api/session/attach", location.origin), { method: "POST", headers: AUTH, body: fd });
    d = await r.json();
  } catch {}
  if (!d || d.error) {
    optimistic = optimistic.filter(x => x !== o); paintFeed();
    showErr((d && (d.reason || d.error)) || "Upload failed");
    return;
  }
  o.state = "sent"; o.match = d.match || null;
  if (voice && d.delivered) o.text = "🎤 " + d.delivered;   // swap the "Transcribing…" stub for the transcript
  paintFeed(); setTimeout(renderDrill, 800);
}

// Voice: tap to record, tap again to stop-and-send. Hidden entirely where the webview has no
// recording API (Telegram Desktop) — cheap feature-detect, per the owner's ask; a permission
// denial on a capable webview still gets the error toast.
let rec = null;
if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)) $("dmic").style.display = "none";
$("dmic").onclick = async () => {
  if (rec) { rec.stop(); return; }
  if (!drillSid) return;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { showErr("Mic unavailable — record in the Telegram chat instead"); return; }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  const chunks = [];
  try { rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
  catch { stream.getTracks().forEach(t => t.stop()); showErr("Recording unsupported here"); return; }
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const type = (rec && rec.mimeType) || mime || "audio/webm";
    rec = null;
    $("dmic").classList.remove("recing"); $("dmic").textContent = "🎤";
    const blob = new Blob(chunks, { type });
    if (blob.size < 1000) { showErr("Recording too short"); return; }
    const ext = /mp4/.test(type) ? "m4a" : /ogg/.test(type) ? "ogg" : "webm";
    attachToSession(new File([blob], "voice-note." + ext, { type }), { voice: true, label: "🎤 Transcribing…" });
  };
  rec.start();
  $("dmic").classList.add("recing"); $("dmic").textContent = "⏹";
};

  el.innerHTML = SPAWN_OPTS[kind].map(v =>
    '<button class="selchip' + (spawnSel[kind] === v ? " on" : "") + '" data-v="' + v + '">' + (CHIP_LABEL[v] || v) + "</button>").join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { spawnSel[kind] = b.dataset.v; chipRow(el, kind); });
}
function openSpawnSheet() {
  chipRow($("spmodel"), "model"); chipRow($("speffort"), "effort"); chipRow($("spmode"), "mode"); chipRow($("spsurface"), "surface");
  $("spawn").classList.add("show");
  $("spname").focus();
}
$("spcancel").onclick = () => $("spawn").classList.remove("show");
$("spawn").onclick = e => { if (e.target.id === "spawn") $("spawn").classList.remove("show"); };
$("spgo").onclick = async () => {
  const name = $("spname").value.trim();
  if (!name) { showErr("Name required"); return; }
  $("spgo").disabled = true;
  const d = await writeOp("/api/session/spawn", {
    name,
    ...(spawnSel.model !== "inherit" ? { model: spawnSel.model } : {}),
    ...(spawnSel.effort !== "inherit" ? { effort: spawnSel.effort } : {}),
    ...(spawnSel.mode !== "default" ? { mode: spawnSel.mode } : {}),
    ...(spawnSel.surface === "headless" ? { headless: true } : {}),
  });
  $("spgo").disabled = false;
  if (!d) return;   // writeOp surfaced the error
  $("spawn").classList.remove("show"); $("spname").value = "";
  showOk("Spawned " + d.name);
  renderSessions();
  if (d.sid) setTimeout(() => openDrill(d.sid, d.name), 500);
};

// ---- Scheduled board: cron + queued prompts + budget, each cancellable ----
async function renderAuto() {
  const el = $("tab-auto");
  let d; try { d = await api("/api/auto"); } catch { el.innerHTML = '<div class="notice">Automation unavailable.</div>'; return; }
  let html = "";
  html += '<div class="sechead">Scheduled (/cron)</div>';
  html += d.cron.length ? d.cron.map(m =>
    '<div class="evrow"><span class="who">' + (m.recurLabel ? "🔁 " + esc(m.recurLabel) : new Date(m.fireAt).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })) + "</span>" +
    '<span class="tx">' + esc(m.sessionLabel) + ": " + esc(m.text) + "</span>" +
    '<button class="xbtn" data-kind="cron" data-id="' + esc(m.id) + '">✕</button></div>').join("")
    : '<div class="notice">Nothing scheduled.</div>';
  html += '<div class="newsess" id="schedadd">➕ New schedule</div>';
  html += '<div class="sechead">Queued (/queue)</div>';
  html += d.queue.length ? d.queue.map(q =>
    '<div class="evrow"><span class="who">' + esc(q.session) + '</span><span class="tx">' + esc(q.text) + "</span>" +
    '<button class="xbtn" data-kind="queue" data-id="' + esc(q.id) + '">✕</button></div>').join("")
    : '<div class="notice">Queue is empty.</div>';
  if (d.budget && (d.budget.cap || d.budget.spent)) {
    html += '<div class="sechead">Budget today</div><div class="card"><div class="v">$' + d.budget.spent.toFixed(2) +
      (d.budget.cap ? " of $" + d.budget.cap.toFixed(2) : " · no cap") + "</div>" +
      (d.budget.cap ? pctBar((d.budget.spent / d.budget.cap) * 100) : "") + "</div>";
  }
  el.innerHTML = html;
  el.querySelectorAll(".xbtn").forEach(b => b.onclick = async () => {
    const d2 = await writeOp("/api/auto/cancel", { kind: b.dataset.kind, id: b.dataset.id });
    if (d2) { showOk("Cancelled"); renderAuto(); }
  });
  $("schedadd").onclick = openSchedSheet;
}

// New-schedule sheet: when spec + a session pick (live panes from /api/sessions) + message.
let schedSid = "";
async function openSchedSheet() {
  let live = [];
  try { live = (await api("/api/sessions")).sessions.filter(s => s.alive); } catch {}
  if (!live.length) { showErr("No live sessions to target"); return; }
  if (!live.some(s => s.sid === schedSid)) schedSid = live[0].sid;
  const row = $("scsess");
  const paint = () => {
    row.innerHTML = live.map(s =>
      '<button class="selchip' + (schedSid === s.sid ? " on" : "") + '" data-v="' + esc(s.sid) + '">' + esc(s.name) + "</button>").join("");
    row.querySelectorAll("button").forEach(b => b.onclick = () => { schedSid = b.dataset.v; paint(); });
  };
  paint();
  $("sched").classList.add("show");
  $("scwhen").focus();
}
$("sccancel").onclick = () => $("sched").classList.remove("show");
$("sched").onclick = e => { if (e.target.id === "sched") $("sched").classList.remove("show"); };
$("scgo").onclick = async () => {
  const when = $("scwhen").value.trim(), text = $("sctext").value.trim();
  if (!when || !text) { showErr("Schedule and message required"); return; }
  $("scgo").disabled = true;
  const d = await writeOp("/api/auto/create", { when, sid: schedSid, text });
  $("scgo").disabled = false;
  if (!d) return;   // writeOp surfaced the error
  $("sched").classList.remove("show"); $("scwhen").value = ""; $("sctext").value = "";
  showOk("Scheduled " + (d.summary || ""));
  renderAuto();
};

// Boot: Sessions is the homepage. A deep link (?start= folder, or startapp token → /api/resolve)
// still lands on Files at that folder — that's what the /files command promises. With the file
// browser omitted, deep links fall through to Sessions.
async function boot() {
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  const qs = new URLSearchParams(location.search).get("start");
  if (FILES && sp) {
    try { const r = await api("/api/resolve", { token: sp }); cur = r.cwd || "/"; filesLoaded = true; ls(cur); showTab("files"); return; } catch {}
  } else if (FILES && qs) { filesLoaded = true; ls(cur); showTab("files"); return; }
  showTab("sessions");
}
if (!INIT) $("tab-sessions").innerHTML = '<div class="notice">Open this from the Telegram button — it carries the sign-in token.</div>';
else boot();
</script>
