  setDial(d);
  lastDrill = d;
  paintFeed();
}
async function sessionAct(action, text) {
  const d = await writeOp("/api/session/act", { sid: drillSid, action, ...(text ? { text } : {}) });
  return !!d;
}

// ---- The composer's model/effort dial: a pill in the capsule → a two-page bottom sheet ----
// The labels and blurbs are UI copy and live here. The ALIASES are not ours: they are daemon.ts's
// MODEL_ALIASES and EFFORT_LEVELS, and the daemon re-validates every apply against them — so a list
// that drifts out of date here fails loudly with the daemon's own message naming the real set,
// rather than silently sending a dial nothing acts on.
const DIAL_MODELS = [
  ["fable", "Fable 5", "For your toughest challenges"],
  ["opus", "Opus 5", "For complex tasks"],
  ["sonnet", "Sonnet 5", "Most efficient for everyday tasks"],
  ["haiku", "Haiku 4.5", "Fastest for quick answers"],
];
const DIAL_EFFORTS = [
  ["low", "Low", "Quick replies to simple questions"],
  ["medium", "Medium", "Light, casual tasks"],
  ["high", "High", "Balanced for everyday work"],
  ["xhigh", "XHigh", "Complex, detailed work"],
  ["max", "Max", "The hardest problems. Takes longest."],
  ["auto", "Auto", "Lets the session pick its own level per turn"],
];
const effLabel = lv => (DIAL_EFFORTS.find(([v]) => v === lv) || [null, lv])[1] || lv;
// The statusline reports a display NAME ("Opus 5"); the picker works in aliases ("opus"). Match on
// the family token — the same test the chat-side /model confirmation uses to read back a switch.
const modelAlias = name => (DIAL_MODELS.find(([a]) => name && name.toLowerCase().includes(a)) || [null])[0];
let dialNow = { model: null, effort: null, defModel: null, defEffort: null };
// Paint the pill from a feed payload (null = opening a session before the first poll answers).
function setDial(d) {
  // A poll that comes back empty (the statusline is masked by a confirm dialog mid-switch) must
  // not blank a pill that already knows better — hold the last true reading. d === null is the
  // deliberate reset when opening a session, and still clears everything.
  dialNow = d === null
    ? { model: null, effort: null, defModel: null, defEffort: null }
    : { model: d.model || dialNow.model, effort: d.effort || dialNow.effort,
        defModel: d.defModel || dialNow.defModel, defEffort: d.defEffort || dialNow.defEffort };
  // The pill says what the SESSION says, never what our list says it should be: the statusline name
  // is already normalised ("claude-haiku-4-5-20251001" → "Haiku 4.5"), it covers a model set by full
  // id from the terminal that no list here knows, and it cannot go stale — the row labels below can,
  // and a pill reading "Opus 5" at a session actually running something else would be a lie.
  $("ddialm").textContent = dialNow.model || "Model";
  $("ddiale").textContent = dialNow.effort ? effLabel(dialNow.effort) : "";
  if ($("dial").classList.contains("show")) paintDial();
}
function dialRow(kind, row, cur, def) {
  return '<button class="dialrow' + (row[0] === cur ? " on" : "") + '" data-k="' + kind + '" data-v="' + row[0] + '">' +
    '<span class="nm"><span class="n">' + esc(row[1]) +
      (row[0] === def ? '<span class="badge">Default</span>' : "") + "</span>" +
      '<span class="d">' + esc(row[2]) + "</span></span>" +
    '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
    "</button>";
}
// The track is as tall as the page you are ON. Left to size itself it takes the taller page's
// height on both, which parks the shorter list above a band of dead sheet.
function dialHeight() {
  const live = $("dial").classList.contains("p2") ? $("dialp2") : $("dialp1");
  document.querySelector(".dialpages").style.height = live.offsetHeight + "px";
}
function paintDial() {
  $("dialmodels").innerHTML = DIAL_MODELS.map(m => dialRow("model", m, modelAlias(dialNow.model), dialNow.defModel)).join("");
  $("dialefforts").innerHTML = DIAL_EFFORTS.map(e => dialRow("effort", e, dialNow.effort, dialNow.defEffort)).join("");
  $("dialeffnow").textContent = dialNow.effort ? effLabel(dialNow.effort) : "not reported";
  document.querySelectorAll("#dial .dialrow[data-k]").forEach(b => b.onclick = () => applyDial(b.dataset.k, b.dataset.v));
  dialHeight();
}
$("ddial").onclick = () => {
  if (!drillSid) return;
  const dl = $("dial");
  dl.classList.remove("p2");
  // .show BEFORE painting: a display:none subtree measures 0, so dialHeight would pin the track at
  // zero and the sheet would open empty — the same trap that once pinned the composer at height 0.
  dl.classList.add("show");
  paintDial();
  requestAnimationFrame(() => dl.classList.add("up"));
};
function closeDial() {
  const dl = $("dial");
  dl.classList.remove("up");
  setTimeout(() => dl.classList.remove("show", "p2"), 180);   // matches .dialsheet's transition
}
$("dialx").onclick = closeDial;
$("dial").onclick = e => { if (e.target.id === "dial") closeDial(); };
$("dialeffort").onclick = () => { $("dial").classList.add("p2"); dialHeight(); };
$("dialback").onclick = () => { $("dial").classList.remove("p2"); dialHeight(); };
async function applyDial(kind, val) {
  const label = kind === "model" ? (DIAL_MODELS.find(([a]) => a === val) || [null, val])[1] : effLabel(val);
  closeDial();
  if (!(await sessionAct(kind, val))) return;   // writeOp surfaced the error
  // Deliberately no optimistic repaint of the pill: the dial is whatever the SESSION reports, and an
  // effort change can sit behind Claude Code's "Change effort level?" confirm for a few seconds. The
  // toast says a switch was asked for; the 3s poll is what says it landed.
  showOk(label + " requested…");
  renderDrill();
}
$("dstop").onclick = async () => { if (await sessionAct("stop")) showOk("Interrupted"); };
// Compaction is reached by typing /compact in the composer, so the button is gone. Closing moved to the
// sessions list (see closeSessionCard) — from inside a session there is nothing left to end but the one
// you navigated into, and the list is where you can see which of several you mean.
$("dsend").onclick = async () => {
  const ta = $("dtext"), text = ta.value.trim();
  if (!text) return;
  ta.value = ""; syncComposerMode();
  // Optimistic: the bubble shows the instant you hit send (dimmed while in flight), instead of
  // waiting for the POST + transcript echo + poll round-trip.
  const o = { text, at: Date.now(), state: "pending" };
  optimistic.push(o);
  workOptimisticAt = Date.now();   // the indicator is part of "sent", not of the poll that follows
  paintFeed();
  $("dfeed").scrollTop = $("dfeed").scrollHeight;   // sending always reveals your own message
  if (await sessionAct("send", text)) { o.state = "sent"; paintFeed(); setTimeout(renderDrill, 800); }
  else { optimistic = optimistic.filter(x => x !== o); workOptimisticAt = 0; paintFeed(); ta.value = text; syncComposerMode(); }   // failed — give the draft back, and take the indicator with it
};

// ---- Compose-row attachment + voice note ----
// Upload to /api/session/attach; the composer text rides along as the file's caption. The bubble
// paints optimistically and reconciles on the server's match token (see paintFeed).
async function attachToSession(file, { caption = "", voice = false, label }) {
  const o = { text: label, at: Date.now(), state: "pending", match: null };
  optimistic.push(o); workOptimisticAt = Date.now(); paintFeed();
  $("dfeed").scrollTop = $("dfeed").scrollHeight;
  let d = null;
  try {
    const fd = new FormData();
    fd.append("sid", drillSid); fd.append("file", file, file.name);
    if (caption) fd.append("caption", caption);
    if (voice) fd.append("voice", "1");
    const r = await fetch(new URL("/api/session/attach", location.origin), { method: "POST", headers: AUTH, body: fd });
    d = await r.json();
  } catch {}
  if (!d || d.error) {
    optimistic = optimistic.filter(x => x !== o); paintFeed();
    showErr((d && (d.reason || d.error)) || "Upload failed");
    return;
  }
  o.state = "sent"; o.match = d.match || null;
  if (voice && d.delivered) o.text = "🎤 " + d.delivered;   // swap the "Transcribing…" stub for the transcript
  paintFeed(); setTimeout(renderDrill, 800);
}
$("datt").onclick = () => { if (drillSid) $("dfile").click(); };
$("dfile").onchange = () => {
  const f = $("dfile").files[0]; $("dfile").value = "";
  if (!f || !drillSid) return;
  const ta = $("dtext"), caption = ta.value.trim(); ta.value = ""; syncComposerMode();
  attachToSession(f, { caption, label: "📎 " + f.name + (caption ? " — " + caption : "") });
};
// Voice: tap to record, tap again to stop-and-send. Hidden entirely where the webview has no
// recording API (Telegram Desktop) — cheap feature-detect, per the owner's ask; a permission
// denial on a capable webview still gets the error toast.
let rec = null;
// The button swaps to a stop glyph while recording. Its resting icon is read back out of the markup
// rather than repeated here, so the mic SVG lives in exactly one place.
const MIC_HTML = $("dmic").innerHTML;
const RECSTOP_HTML = '<svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor"/></svg>';
const VOICE_OK = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
// Which of the two round buttons is showing. Where the webview has no recording API there is nothing
// to morph between, so send simply stays. Recording outranks a typed draft: you can type mid-record,
// and swapping the recorder out from under a live recording would strand it.
// Auto-grow, Telegram-style: one line at rest, a line at a time as text wraps, then the CSS
// six-line cap takes over and the field scrolls inside itself. `height: auto` first because
// scrollHeight only reports the content's height once the box has stopped constraining it — read
// it against the previous height and a field that shrank would stay tall forever. The cap lives in
// CSS (max-height), so assigning the full scrollHeight here is safe: it simply stops taking effect.
function growComposer() {
  const ta = $("dtext"), feed = $("dfeed");
  // Measured BEFORE the field is resized, because growing it shrinks the feed's clientHeight.
  // #dfeed is flex:1 so the layout absorbs the growth, but absorbing it is not the same as staying
  // pinned: scrollTop does not move, so every pixel the composer gains scrolls the newest message
  // out of sight — 87px of it by six lines. The 3s repaint would not rescue it either, since it
  // only re-pins within 60px of the bottom and the drift passes that at three lines. Same 60px
  // threshold as paintFeed on purpose: a reader who has deliberately scrolled up is left alone.
  const stuck = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
  // Keep the caret in view once the field is capped and scrolling internally. PRESERVE rather than
  // command: by the time this runs the browser has already scrolled the caret into view, so its
  // scrollTop is a correct answer worth carrying across the resize — and restoring it is what makes
  // editing in the MIDDLE of a capped field work. Forcing the bottom unconditionally would fix
  // typing at the end and yank the view away from the caret on every keystroke anywhere else.
  // The one case with nothing correct to preserve is a value change that never moved the caret
  // natively — a paste or a restored draft, where scrollTop is still 0 and the text is left
  // top-aligned with the newest line out of sight. Caret-at-end identifies exactly that case and
  // never fires while editing mid-field.
  const keepTop = ta.scrollTop;
  const caretAtEnd = ta.selectionStart === ta.selectionEnd && ta.selectionEnd === ta.value.length;
  ta.style.height = "auto";
  // A hidden element measures 0. syncComposerMode() runs once at parse time, when #drill is still
  // display:none, so without this guard the field is pinned to height:0 and never recovers — it
  // renders as a strip of bare padding with the placeholder spilling out below it. Leaving the
  // height on `auto` hands the resting size back to rows="1" until the view is actually shown.
  if (!ta.scrollHeight) return;
  ta.style.height = ta.scrollHeight + "px";
  ta.scrollTop = caretAtEnd ? ta.scrollHeight : keepTop;
  if (stuck) feed.scrollTop = feed.scrollHeight;
}
// Every path that changes the field's value already funnels through here — typing, send, a failed
// send handing the draft back, the attach caption, and record start/stop — so the grow and the
// collapse-back-to-one-line both come for free rather than needing a call at each site.
function syncComposerMode() {
  const showSend = !VOICE_OK || (!!$("dtext").value.trim() && !rec);
  $("dsend").style.display = showSend ? "flex" : "none";
  $("dmic").style.display = showSend ? "none" : "flex";
  growComposer();
}
$("dtext").oninput = syncComposerMode;
// A width change re-wraps the text, so the height measured for the old width is stale and the
// resting scroll position no longer shows the end — measured: a 30px narrower field moved the
// bottom 44px away without a single keystroke. Nothing else re-enters the resize on a viewport
// change, so this is the only thing that puts it right. Height-only changes (a soft keyboard
// appearing) do not re-wrap and are harmless; re-measuring on both is simpler than telling them
// apart, and growComposer is idempotent.
addEventListener("resize", growComposer);
syncComposerMode();
$("dmic").onclick = async () => {
  if (rec) { rec.stop(); return; }
  if (!drillSid) return;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { showErr("Mic unavailable — record in the Telegram chat instead"); return; }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  const chunks = [];
  try { rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
  catch { stream.getTracks().forEach(t => t.stop()); showErr("Recording unsupported here"); return; }
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const type = (rec && rec.mimeType) || mime || "audio/webm";
    rec = null;
    $("dmic").classList.remove("recing"); $("dmic").innerHTML = MIC_HTML; syncComposerMode();
    const blob = new Blob(chunks, { type });
    if (blob.size < 1000) { showErr("Recording too short"); return; }
    const ext = /mp4/.test(type) ? "m4a" : /ogg/.test(type) ? "ogg" : "webm";
    attachToSession(new File([blob], "voice-note." + ext, { type }), { voice: true, label: "🎤 Transcribing…" });
  };
  rec.start();
  $("dmic").classList.add("recing"); $("dmic").innerHTML = RECSTOP_HTML; syncComposerMode();
};

// ---- "+" new session sheet: name + model/effort/mode dials → /api/session/spawn ----
const SPAWN_OPTS = {
  model: ["inherit", "fable", "opus", "sonnet", "haiku"],
  effort: ["inherit", "low", "medium", "high", "xhigh", "max"],
  mode: ["default", "acceptEdits", "plan", "bypassPermissions"],
  surface: ["topic", "headless"],
};
const CHIP_LABEL = { bypassPermissions: "bypass", acceptEdits: "accept edits" };
const spawnSel = { model: "inherit", effort: "inherit", mode: "default", surface: "topic" };
function chipRow(el, kind) {
  el.innerHTML = SPAWN_OPTS[kind].map(v =>
    '<button class="selchip' + (spawnSel[kind] === v ? " on" : "") + '" data-v="' + v + '">' + (CHIP_LABEL[v] || v) + "</button>").join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { spawnSel[kind] = b.dataset.v; chipRow(el, kind); });
}
function openSpawnSheet() {
  chipRow($("spmodel"), "model"); chipRow($("speffort"), "effort"); chipRow($("spmode"), "mode"); chipRow($("spsurface"), "surface");
  $("spawn").classList.add("show");
  $("spname").focus();
}
$("spcancel").onclick = () => $("spawn").classList.remove("show");
$("spawn").onclick = e => { if (e.target.id === "spawn") $("spawn").classList.remove("show"); };
$("spgo").onclick = async () => {
  const name = $("spname").value.trim();
  if (!name) { showErr("Name required"); return; }
  $("spgo").disabled = true;
  const d = await writeOp("/api/session/spawn", {
    name,
    ...(spawnSel.model !== "inherit" ? { model: spawnSel.model } : {}),
    ...(spawnSel.effort !== "inherit" ? { effort: spawnSel.effort } : {}),
    ...(spawnSel.mode !== "default" ? { mode: spawnSel.mode } : {}),
    ...(spawnSel.surface === "headless" ? { headless: true } : {}),
  });
  $("spgo").disabled = false;
  if (!d) return;   // writeOp surfaced the error
  $("spawn").classList.remove("show"); $("spname").value = "";
  showOk("Spawned " + d.name);
  renderSessions();
  if (d.sid) setTimeout(() => openDrill(d.sid, d.name), 500);
};

// ---- Scheduled board: cron + queued prompts + budget, each cancellable ----
async function renderAuto() {
  const el = $("tab-auto");
  let d; try { d = await api("/api/auto"); } catch { el.innerHTML = '<div class="notice">Automation unavailable.</div>'; return; }
  let html = "";
  html += '<div class="sechead">Scheduled (/cron)</div>';
  html += d.cron.length ? d.cron.map(m =>
    '<div class="evrow"><span class="who">' + (m.recurLabel ? "🔁 " + esc(m.recurLabel) : new Date(m.fireAt).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })) + "</span>" +
    '<span class="tx">' + esc(m.sessionLabel) + ": " + esc(m.text) + "</span>" +
    '<button class="xbtn" data-kind="cron" data-id="' + esc(m.id) + '">✕</button></div>').join("")
    : '<div class="notice">Nothing scheduled.</div>';
  html += '<div class="newsess" id="schedadd">➕ New schedule</div>';
  html += '<div class="sechead">Queued (/queue)</div>';
  html += d.queue.length ? d.queue.map(q =>
    '<div class="evrow"><span class="who">' + esc(q.session) + '</span><span class="tx">' + esc(q.text) + "</span>" +
    '<button class="xbtn" data-kind="queue" data-id="' + esc(q.id) + '">✕</button></div>').join("")
    : '<div class="notice">Queue is empty.</div>';
  if (d.budget && (d.budget.cap || d.budget.spent)) {
    html += '<div class="sechead">Budget today</div><div class="card"><div class="v">$' + d.budget.spent.toFixed(2) +
      (d.budget.cap ? " of $" + d.budget.cap.toFixed(2) : " · no cap") + "</div>" +
      (d.budget.cap ? pctBar((d.budget.spent / d.budget.cap) * 100) : "") + "</div>";
  }
  el.innerHTML = html;
  el.querySelectorAll(".xbtn").forEach(b => b.onclick = async () => {
    const d2 = await writeOp("/api/auto/cancel", { kind: b.dataset.kind, id: b.dataset.id });
    if (d2) { showOk("Cancelled"); renderAuto(); }
  });
  $("schedadd").onclick = openSchedSheet;
}

// New-schedule sheet: when spec + a session pick (live panes from /api/sessions) + message.
let schedSid = "";
async function openSchedSheet() {
  let live = [];
  try { live = (await api("/api/sessions")).sessions.filter(s => s.alive); } catch {}
  if (!live.length) { showErr("No live sessions to target"); return; }
  if (!live.some(s => s.sid === schedSid)) schedSid = live[0].sid;
  const row = $("scsess");
  const paint = () => {
    row.innerHTML = live.map(s =>
      '<button class="selchip' + (schedSid === s.sid ? " on" : "") + '" data-v="' + esc(s.sid) + '">' + esc(s.name) + "</button>").join("");
    row.querySelectorAll("button").forEach(b => b.onclick = () => { schedSid = b.dataset.v; paint(); });
  };
  paint();
  $("sched").classList.add("show");
  $("scwhen").focus();
}
$("sccancel").onclick = () => $("sched").classList.remove("show");
$("sched").onclick = e => { if (e.target.id === "sched") $("sched").classList.remove("show"); };
$("scgo").onclick = async () => {
  const when = $("scwhen").value.trim(), text = $("sctext").value.trim();
  if (!when || !text) { showErr("Schedule and message required"); return; }
  $("scgo").disabled = true;
  const d = await writeOp("/api/auto/create", { when, sid: schedSid, text });
  $("scgo").disabled = false;
  if (!d) return;   // writeOp surfaced the error
  $("sched").classList.remove("show"); $("scwhen").value = ""; $("sctext").value = "";
  showOk("Scheduled " + (d.summary || ""));
  renderAuto();
};

// Boot: Sessions is the homepage. A deep link (?start= folder, or startapp token → /api/resolve)
// still lands on Files at that folder — that's what the /files command promises. With the file
// browser omitted, deep links fall through to Sessions.
async function boot() {
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  const qs = new URLSearchParams(location.search).get("start");
  if (FILES && sp) {
    try { const r = await api("/api/resolve", { token: sp }); cur = r.cwd || "/"; filesLoaded = true; ls(cur); showTab("files"); return; } catch {}
  } else if (FILES && qs) { filesLoaded = true; ls(cur); showTab("files"); return; }
  showTab("sessions");
}
if (!INIT) $("tab-sessions").innerHTML = '<div class="notice">Open this from the Telegram button — it carries the sign-in token.</div>';
else boot();
</script>
