<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cc-bridge</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    /* Type: four steps, not the nine spanning 1.7x that this file grew into. Sizes are set against
       the reference, where the message text measures ~17pt and the chat title ~20pt — so body moves
       UP (15 -> 16) rather than down. Mono runs a step below its neighbour: at the same nominal size
       a monospace face reads larger. */
    --t-meta: 12px;    /* chips, feet, uppercase labels */
    /* The bubble's time + delivery mark, and a REAL step in the scale rather than a one-off sprinkled
       at the call site: the owner asked for it below --t-meta, and the answer to that is to extend the
       scale so the next reader can see where the value comes from. It is the reference's own
       proportion — its meta ink measures 15px of cap against the message text's 21px, so 0.714 of
       --t-msg, which is 11.4 at our 16px. Rounded down, since the scale prefers integers.
       Measure ink with a threshold ABOVE the bubble fill (lum 135) — a lower one measures bubble, not
       glyph, and that mistake is what produced an earlier "0.56" and a plan to drop this to 9px. */
    --t-stamp: 11px;
    --t-sub: 14px;     /* secondary lines — task summaries, hints, small controls */
    --t-body: 16px;    /* list rows, values, and the composer field */
    /* The feed's message text, and its OWN step rather than a bump to --t-body, for the reason
       --fold-h gives above: --t-body also sizes the composer textarea, whose line box sets the
       settled 52px pill and the six-line cap. Raising it there would have quietly grown both.
       Set on .msg so BOTH sides move together — the two must stay matched.
       It currently COINCIDES with --t-body, by the owner's call after living with 18 at full width
       on his own phone. That coincidence is not a reason to collapse the two: --t-body drags the
       composer's geometry with it and this one does not, which is the whole point of the split. */
    --t-msg: 16px;
    --t-title: 20px;   /* the one title size */
    --t-mono: 13px;    /* code blocks, inline code, and the command chip */
    /* Spacing and radius. NOTE for anyone re-running the design lint: tokenising these also makes
       them invisible to it, because it only reads literals. flat-type-hierarchy stops firing for
       the same reason — it is NOT evidence the scale now spans its 2x threshold. It doesn't: 20/12
       is 1.67. Nothing in a chat console legitimately carries a 24px display size, so the honest
       fix was fewer, better-separated steps rather than a big number invented to clear a rule. */
    --w-semi: 600;     /* the one weight step above body */
    --lh-snug: 1.25;   /* title blocks; body keeps its looser 1.45 */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
    /* The collapsed-message fold bar's reserved strip. Deliberately its OWN variable and not --sp-5:
       it is a geometric invariant (must be >= the bar's height, pinned at 12px glyph + 4 + 6 = 22),
       not a spacing choice. Tying it to the general scale is how it silently broke once already. */
    --fold-h: 24px;
    /* The floating new-session pill's height. Its radius is half this and the sessions list reserves
       it plus a gutter either side as its own bottom padding, so the one number carries both.
       44 is the reference's 38.5 taken up a tenth on the owner's ask after seeing it on device — and
       it lands back on the 44px touch floor, which the rest of the app spends deliberately. */
    --fab-h: 44px;
    /* The composer capsule is DERIVED from the mic, never the reverse: the round button keeps its
       diameter and the pill is whatever clears it with an even ring. --pill-h is the sum; nothing
       sets a pill height by hand.
       The ring is 6px by the owner's choice, not by the reference's proportion — the reference is
       tighter (a 67px button in a 78px pill, 5.5/67 ≈ 0.082 of the diameter, which scales to ~3px
       here) and he asked for more air around the button after seeing that version. Keep it an
       INTEGER: it is half the pill's spare height, so an odd total would land the button on a half
       pixel and reintroduce exactly the paint snap the .sendbtn svg note describes. */
    --mic-d: 40px;
    /* The chat header's three containers — two circles and the name capsule, ONE size, derived
       capsule-FIRST: the pill's height is its own two line boxes plus padding and the circles take
       that, so the three share a height by construction. It ran the other way once, off the
       reference's mic ratio (81.0 : 66.7 → 48.6), which pinned the row at 48.
       The line boxes are px, not --lh-snug: 1.25 on the 11px sub gives 13.75, and a fractional row
       height puts .chatbtn's integer padding back on a half pixel.
       The name is --t-meta now, one step above the cwd's --t-stamp, by the owner's ask for a shorter
       row — so the first line box is 16 rather than 20, and --h-pad came down 5 → 3 on a second pass,
       which lands the row at 36. That is BELOW the 44px touch floor this comment used to call
       unbreakable: the owner asked for the height twice, so the floor is spent knowingly rather than
       forgotten — and the WIDTH is what buys it back, see --hbtn-w. Height alone should not go lower.
       Keep both button axes MINUS --hbtn-glyph EVEN (36 - 24 = 12, 44 - 24 = 20): the button centres
       its glyph with half the difference as padding, and an odd one lands it on a half pixel — see
       .chatbtn. That parity is why the first line box is 16 and not the 15 (12 x --lh-snug) the name's
       own type would give. */
    --h-l1: 16px; --h-l2: 14px; --h-pad: 3px;
    --hbtn-d: calc(var(--h-l1) + var(--h-l2) + 2 * var(--h-pad));
    /* The circles are not circles any more — 8px wider than tall, by the owner's ask, so they read as
       rounded controls rather than dots. Which is also what keeps the shrinking row honest: at 44 x 36
       the touch target has the same area it had when the row was 44 square, just distributed the way a
       thumb actually lands on a header. Paired with a radius of half the HEIGHT (a stadium), never
       `50%` — a percentage radius on a non-square box draws an ellipse, whose flanks then disagree
       with the capsule's own ends. */
    --hbtn-w: calc(var(--hbtn-d) + 8px);
    --hbtn-glyph: 24px;
    /* Those three containers are one family, so their raised look is one constant rather than the
       same two shadows written out per container. */
    --chip-lift: inset 0 1px 0 rgba(255,255,255,.06), 0 2px 6px rgba(0,0,0,.35);
    /* …and one fill, for the same reason. Slightly translucent by the owner's ask — same colour,
       same design, just letting a little of the page through. It stays a VARIABLE rather than an
       opacity on the containers: opacity would take the glyphs and the title text down with it,
       which is a dimmed control, not a translucent surface. The opaque value here is also the
       fallback — the @supports below is what makes it translucent, so an engine without
       color-mix() renders exactly today's chip instead of nothing. */
    --chip-fill: var(--sec);
    /* …and one glass, for the same reason. A FILTER LIST, not just a blur, and the name changed with
       it. The blur keeps the chip legible: the row floats over the transcript, and unblurred the words
       behind the capsule read THROUGH the name — the colour and motion of a passing bubble is the
       point, its text is not. It went 12 → 20 with the fill's drop to 36%: at 19% pass-through 12px
       was enough to dissolve a glyph, at 63% it is not. 28 reads as a milky pane rather than glass.
       The saturate() is the answer to a complaint that a passing message moves the chip's COLOUR too
       much, and it is the honest half of that answer. Measured: a bright bubble behind the capsule
       moves it 99 rgb units, of which 23 is chroma and 53 is luminance. Telegram's own chrome is not
       steadier — solved off the owner's screenshot, its chroma swing is 48, TWICE ours — it simply
       sits higher, where this file's own ceiling scrim has already dissolved whatever was behind it.
       So there is no filter that makes a transparent chip ignore a bright thing passing under it;
       that is what transparent means. What saturate(0.35) does is take the colour CAST out of the
       swing (chroma 23 → 8) while leaving the motion, so the chip greys what passes rather than
       wearing it. Deliberately NOT brightness(): clamping the luminance too costs the resting colour
       the owner confirmed already matches Telegram's, which is the one thing not to spend.
       An engine without backdrop-filter simply gets the translucent chip. */
    --chip-glass: blur(20px) saturate(0.35);
    /* The paperclip glyph. Its own constant rather than a step off --sp-*, for the reason --fold-h
       gives above: it is a geometric size answering to the reference, not a spacing choice. */
    --clip-d: 24px;
    /* The composer's model/effort chip. Same derivation as --clip-d and --hbtn-d: a proportion of
       the reference measured against the mic both frames contain (56.1 : 66.7), not a chosen size. */
    --dial-h: 34px;
    --pill-ring: 6px;
    /* The pill's height AT ONE LINE, and the name matters: the pill now grows with the textarea,
       but the corner radius must NOT follow it. Tie the radius to the live height and a six-line
       pill becomes a 74px lozenge instead of a chat field. Fixed at the one-line radius, a tall
       pill is a rounded rectangle whose bottom-right corner keeps the curve the mic sits in. */
    --pill-h-1: calc(var(--mic-d) + 2 * var(--pill-ring));
    /* The composer's growth cap, in LINES. Six fully visible lines, then the text scrolls inside
       the field — measured off a real Telegram client by the owner, not chosen here. It is derived
       from the line box rather than written as a pixel height on purpose: a pixel cap that is not
       an exact multiple of the line box puts the ceiling mid-line, so the sixth line shows as a
       sliver — the same clipped-glyph symptom this change exists to remove, moved to the scroll
       boundary. The old inert `max-height: 110px` was exactly that: 4.26 lines. */
    --ta-lines: 6;
    --ta-lh: 1.35;
    --ta-pad-y: 9px;
    --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-xl: 16px; --r-2xl: 20px;
    /* The session card's own corner, and the ONE radius here that is derived rather than picked off
       the 4px ramp. A corner reads as a corner in proportion to the box it turns: the reference's is
       21 on a 63.5px card (0.33), ours is a 116px card that cannot get that short without dropping
       content, so the radius carries what the height cannot — 26/116 = 0.22, against 0.16 at --r-2xl.
       That derivation is why it steps 6 and not 4. Do not "tidy" it back onto the ramp. */
    --r-3xl: 26px;
    /* The page takes the client's HEADER colour, not its chat background — the owner's trial, so the
       mini app reads as one surface with the Telegram bar above it instead of a lighter panel bolted
       under it (measured off his screenshot: their bar #1D2733 against our page #212D3B). Every
       gradient, veil and scrim in this file is a color-mix of --bg, so this one token carries all of
       them; nothing else needs to move.
       The fallback CHAIN is what makes it safe to try: `header_bg_color` is a Bot API 7.0 theme
       param, so a client that does not send it lands on exactly the colour this page has always
       used. What it cannot cover is a theme whose header happens to equal its secondary_bg_color —
       --sec is what every raised surface here is (agent cards, settings cards, dividers), and it
       would flatten into the page. That is a look-and-see, which is why this is its own commit. */
    --bg: var(--tg-theme-header-bg-color, var(--tg-theme-bg-color, #17212b));
    --sec: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #7d8b99);
    --link: var(--tg-theme-link-color, #6ab3f3);
    --btn: var(--tg-theme-button-color, #5288c1);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    /* Hint grey is tuned for the page ground. On a raised --sec surface it falls to 3.94:1 at 12px,
       under AA — and hint-on-raised is this app's dominant secondary-text pattern, so the debt is
       the pattern's, not one label's. Lifting it toward the theme's OWN text colour rather than
       hardcoding a grey keeps it following a custom Telegram theme.
       Deliberately NOT applied to .dot: its idle state is var(--hint) and stays byte-exact. */
    --hint-raised: var(--hint);
    /* Stop red. Saturation taken from the stop-sign emoji, NOT sampled from the reference JPEG (whose
       circle is duller and slightly pink) — the owner asked for the emoji's red specifically.
       Tokenised on purpose, and note this is the OPPOSITE call from .dot.on's hardcoded green: that
       one stays literal because a token would make the frozen indicator inheritable. Nothing here is
       frozen, so the lint's raw-color finding is real and the token is the answer. */
    --stop-red: #ea3323;
    /* Added / removed lines. There is no light-theme block in this file to hold a second pair — the
       theme arrives entirely through --tg-theme-* — so ONE pair has to clear contrast on both
       grounds. These two are tuned for the dark one; the @supports below pulls each toward whatever
       --text is, which lightens them on a dark ground and darkens them on a light one. */
    --add: #3fb950;
    --del: #f85149;
    /* Telegram's own chrome in FULLSCREEN mode (the ✕ Close pill top-left, the chevron/kebab
       top-right) is drawn OVER the page, so every top-anchored surface has to start below it.
       Written by syncSafeTop() and 0px in every non-fullscreen state, which is what keeps normal
       mode byte-identical: the gate is `tg.isFullscreen`, not the insets — an inset that happens to
       report a notch off-fullscreen would otherwise open a gap the window manager already gave us. */
    --safe-top: 0px;
    /* The ceiling scrim as TWO LENGTHS rather than percentages of one height, which is what lets the
       same eased ramp serve both layouts. --scrim-solid is how far full --bg reaches down: here the
       row's own 10px margin plus the NAME's line box, which lands it --h-pad above the cwd — "the
       gradient begins some pixels before the CWD", off the owner's Claude-app reference. --scrim-ramp
       is the runway it falls over, below that.
       Percentages of a total could not express this: fullscreen wants the solid part to cover the
       whole chrome band (see html.fs), i.e. a completely different SPLIT of the same shape, and a
       single percentage list forces one split on both. That mistake shipped for an hour — the
       fullscreen height was scaled as if the stops ran from the top, so its solid part covered the
       band's first quarter and the title sat on half-veiled transcript. headerup.mjs measures the
       profile now instead of the height, which is what caught it. */
    /* Where the header's box begins, which normal mode gets from --safe-top plus .vhead's own 10px
       margin. It exists as a token because TWO rules need it and they were drifting apart: .vhead's
       `top` and the scrim's solid length. In fullscreen the header rides up into the client's chrome
       band and only this moves — the scrim then follows for free, which is what the first fullscreen
       shape failed to do (it took --safe-top, the band's FLOOR, so its solid part ended ~22px below
       the name and the fade landed a line and a half too low on screen). */
    --head-top: calc(var(--safe-top) + 10px);
    --scrim-solid: calc(var(--head-top) + var(--h-pad) + var(--h-l1));
    --scrim-ramp: calc(var(--h-l2) + var(--t-msg) * 1.45);
  }
  @supports (color: color-mix(in srgb, red 50%, blue)) {
    /* 36%, which is TELEGRAM'S OWN number: its ✕ Close pill was solved off a screenshot where both its
     chrome and our header crossed the same blue bubble — a chip over two backdrops gives its alpha
     exactly, (C₁−C₂) = (1−a)(B₁−B₂) — and it came out 0.36 over a fill of rgb(15,21,28). Ours was
     0.82, which is why the two read as smoked glass and painted slab side by side.
     The FILL is a SCRIM — darker than the page — and that is the half that took two goes. Their chip
     renders at (27,35,45) against a page of (33,45,59): about 10 units DARKER. Ours was --sec, which
     is lighter than --bg, so it read as a raised slab beside their smoked glass however well the
     alpha matched; tinting it toward --text (the first attempt) made that worse, not better, which is
     what the owner saw immediately.
     It is expressed as a PROPORTION of --bg rather than as Telegram's literal rgb(15,21,28), and that
     is what keeps it theme-safe in both directions: 44% of the ground is darker than the ground on any
     theme, but on a LIGHT one it lands at a light grey (0.44 × white ≈ 112, rendering ≈ 203) where a
     dark --text glyph still reads. A literal near-black would be right on this theme and unusable on
     that one. Solved from the measurement: rendered = a·F + (1−a)·bg, so matching their ~0.8 × bg at
     a = 0.36 gives F ≈ 0.44 × bg.
     scripts/webapp-measure/chipalpha.mjs measures both halves of that trade, and validates itself
     against a declared alpha before believing either. */
  :root { --chip-tint: color-mix(in srgb, var(--bg) 44%, #000);
    --chip-fill: color-mix(in srgb, var(--chip-tint) 36%, transparent);
      --hint-raised: color-mix(in srgb, var(--hint) 80%, var(--text));
      --add: color-mix(in srgb, #3fb950 80%, var(--text)); --del: color-mix(in srgb, #f85149 80%, var(--text)); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: var(--t-body)/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  /* Form controls don't inherit fonts by default (the composer was silently falling back to the
     UA's monospace); give them the app stack — later per-element rules (#vedit-area) still win. */
  input, button, select, textarea { font: inherit; }
  header { position: sticky; top: 0; background: var(--bg); padding: var(--sp-3); border-bottom: 1px solid var(--sec); }
  .crumbs { font-size: var(--t-meta); color: var(--hint); word-break: break-all; margin-bottom: var(--sp-2); }
  .crumbs a { color: var(--link); text-decoration: none; }
  .search { display: flex; gap: 6px; }
  .search input { flex: 1; padding: var(--sp-2) 10px; border-radius: var(--r-sm); border: none; background: var(--sec); color: var(--text); font-size: var(--t-sub); }
  .search button { padding: var(--sp-2) var(--sp-3); border: none; border-radius: var(--r-sm); background: var(--btn); color: var(--btn-text); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 11px var(--sp-3); border-bottom: 1px solid var(--sec); display: flex; gap: 10px; align-items: center; cursor: pointer; }
  li:active { background: var(--sec); }
  .ico { width: 20px; text-align: center; }
  .name { flex: 1; word-break: break-all; }
  .meta { color: var(--hint); font-size: var(--t-meta); white-space: nowrap; }
  #viewer { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; padding-top: var(--safe-top); }
  #viewer.show { display: flex; }
  .vhead { padding: 10px var(--sp-3); border-bottom: 1px solid var(--sec); display: flex; gap: var(--sp-2); align-items: center; }
  .vhead .name { font-size: var(--t-sub); }
  /* Scoped to #viewer, which is the only header these solid pills were ever for. It used to be
     `.vhead button:not(.ghost)`, and the exclusion existed only because the rule also reached the CHAT
     header — so it had to be told which buttons not to eat. Narrowing the rule removes the need for the
     exclusion, and with it a base rule that outranked (0,2,1) anything a variant would naturally carry.
     Proven, not theorised: moving the chat buttons off .ghost made them match this rule, which painted
     the stop blue and shrank its glyph with `padding: 7px 11px`. Two over-broad base rules produced both
     of tonight's inert-modifier bugs; this is the second one going. */
  #viewer .vhead button { padding: 7px 11px; border: none; border-radius: var(--r-sm); background: var(--btn); color: var(--btn-text); }
  /* Chat header — the drill-in ONLY (the file viewer keeps the flat bar; it isn't this screen).
     THREE separate containers with gaps between them, per the reference: a standalone circle, the
     name capsule, a standalone circle. The BAR paints nothing; each container carries its own lift.
     They used to be one island with the two buttons sitting inside it. On a near-black canvas there
     is no ambient light for a surface to catch, so the lift has to be manufactured: an opaque raised
     fill plus a hairline rim along the top edge where light would land. Deliberately NO accent bloom
     — a glow is for the one thing you want clicked, and these are utility controls. */
  /* 10px matches the composer's inset, so the two surfaces that bracket the screen line up. The 6px
     gap is the reference's own (10.6 and 9.7 image px against its 66.7px mic). */
  /* --title-align is the ONE declaration that walks the centred title back to left-anchored, because
     the owner asked for centred provisionally. Centring is honest here rather than approximate: the
     row holds one identically-sized circle on each side, so the space either side of the capsule is
     symmetric and centring within it centres against the ROW. Add a third control and that stops
     being true — give the side slots equal fixed widths at that point. */
  /* It FLOATS over the feed, and that is what makes the translucent chips mean anything. --chip-fill
     has been 82% of --sec for a while, but the row sat in the flex column ABOVE the scroller, so the
     18% it let through was the page's own --bg — a translucent surface over nothing, which paints
     exactly like a solid one. Taking it out of flow puts the transcript underneath, so a message
     genuinely passes behind the chips as it scrolls. The feed pays for the space it no longer loses
     to the row (see #dfeed's top padding); anything less and the first message opens under the back
     button. z-index because #dfeed is a later sibling and would otherwise paint over it. */
  /* `top: --safe-top` and NOT `top: 0`, which is the trap this cost a measured failure to find: an
     absolutely positioned box's containing block is its ancestor's PADDING box, so #drill's
     padding-top — the whole fullscreen offset mechanism — does not move it. In flow the row was
     pushed clear of Telegram's ✕ pill for free; out of flow it has to ask for the same offset by
     name. scripts/webapp-measure/fullscreen.mjs is what says so (drillhead moved 0.00px of 93). */
  #drill .vhead { --title-align: center; position: absolute; top: var(--head-top); left: 0; right: 0; z-index: 2;
    margin: 0 10px 2px; padding: 0; border-bottom: none;
    background: transparent; gap: 6px; }
  /* SELF-CONTAINED, and a single class on purpose. These buttons are deliberately NOT .ghost, and the
     shared appearance deliberately does NOT live on a `#drill .vhead > *` rule: the base used to be
     `#drill .vhead .ghost` (1,2,0), which meant every variant had to out-rank an id plus two
     descendants, and a variant written the obvious way — `#dstop.recording` (1,1,0) — silently lost and
     did nothing. Twice that night, counting the ✕ that lost its red to `.vhead .ghost` (0,2,0). At (0,1,0) any
     `.chatbtn.x` variant wins by construction, and scoping is now by markup rather than by location,
     so it cannot accidentally capture the file viewer's own .vhead buttons either. */
  /* Both circles are the same painted chip as the capsule between them — same fill, same rim — which
     is what makes the three read as one row of containers rather than three unrelated shapes.
     No ::after touch-target lift any more: it existed to bring a 34px button up to the 44px standard,
     and the button now meets 44 on its own — which is why --hbtn-d's floor is that number. */
  .chatbtn { width: var(--hbtn-w); height: var(--hbtn-d); border: none; border-radius: calc(var(--hbtn-d) / 2);
    background: var(--chip-fill); box-shadow: var(--chip-lift); color: var(--text); cursor: pointer; flex: none;
    backdrop-filter: var(--chip-glass); -webkit-backdrop-filter: var(--chip-glass);
    /* The PADDING is what fixes the glyph's origin — an integer, so it lands on whole pixels at any
       button size. Centring it by halving flex free space instead is what put the 19-in-34 button's
       glyph half a pixel down and right: 15px of free space halves to 7.5, and Blink snaps the SVG's
       paint origin up to the whole pixel. Measured at exactly +0.50, +0.50 on both of these buttons
       before this change — the same defect fixed on the composer mic, which CLAUDE.md had recorded
       here as merely suspected. The flex box below then has zero free space left to halve.
       TWO axes now that the button is wider than it is tall, and both have to stay integers — which
       is the whole reason --hbtn-w moves in even steps off --hbtn-d. */
    padding: calc((var(--hbtn-d) - var(--hbtn-glyph)) / 2) calc((var(--hbtn-w) - var(--hbtn-glyph)) / 2);
    display: flex; align-items: center; justify-content: center; }
  .chatbtn svg { width: var(--hbtn-glyph); height: var(--hbtn-glyph); display: block; }
  /* 24px, up from 19. Sized against the owner's reference rather than by eye: its paperclip carries
     34x39px of ink beside a 67px mic button, which at our 40px mic scales to 20.3 x 23.3 — a 24px
     glyph puts ours at 21.4 x 22.6, the closest of the sizes tried. `.ghost` has exactly one user
     (#datt), so this reaches nothing else. The glyph stays on whole pixels at ANY size here because
     .ghost centres it with integer padding rather than by halving flex free space — the trap that
     caught .sendbtn does not exist on this button. */
  .ghost svg { width: var(--clip-d); height: var(--clip-d); display: block; }
  /* Two-line title: name over the session's dial line, as the reference has name over "bot". The
     status dot rides ON the name line — centred against a two-line block it would float in the
     gutter, belonging to neither line. (Its own rules stay untouched; only its context moves.) */
  /* The MIDDLE CONTAINER: a capsule spanning the gap between the two circles and exactly as tall as
     they are — equal height is what makes the three read as one row. It is now the SOURCE of that
     height (two line boxes + --h-pad, which --hbtn-d is calc'd from), so min-height restates the
     number rather than setting it, and earns its keep in one case: #dsub EMPTY, which a deep-linked
     open really renders (openDrill runs before the snapshot lands). An empty block box is 0 tall,
     so without it the capsule would collapse between two taller circles. */
  /* …and 20% NARROWER than the gap it spans, by the owner's ask — the capsule was reaching for both
     circles and reading as a bar. Expressed as symmetric margins rather than a width so the capsule
     stays centred and the buttons stay pinned to the row's ends: the span is (100% - 2 x --hbtn-w -
     2 x 6px gap), and a tenth of that off each side is a fifth off the whole. The percentage resolves
     against .vhead's content box, which is what makes it track the viewport instead of a guess.
     It is --hbtn-w and not --hbtn-d in here, and that is the one thing to fix if the buttons ever stop
     being square-ish: this is the only place the row's WIDTH budget is written down. */
  /* …and it is NOT A CAPSULE any more. The fill, the rim and the frost are gone by the owner's ask,
     after the reference his phone actually shows him: a title line over a subtitle line, floating on
     the transcript, no surface under either. The two CIRCLES keep theirs — he scoped the ask to the
     pill, and they are the row's only 44px touch targets; two unlabelled glyphs over a moving
     transcript is a different screen, not this one.
     What the capsule was quietly doing is the whole of the rest of this change. It was the contrast
     floor for both lines. The ceiling scrim (#drill::before) ramps to zero at the header's BOTTOM
     edge, which puts roughly 45% of --bg behind the name and roughly 5% behind the cwd — measured,
     not estimated. Bare, the cwd sits on whatever message happens to be passing.
     So the floor moves onto the glyphs themselves, as --title-halo. A halo and NOT a stronger scrim,
     for a reason already written into this file: extending that ramp down across the header paints a
     bar over the band the transcript was just given, was tried, and was rejected by the owner. A
     halo costs no strip at all. It resolves through --bg, so it darkens on a dark theme and lightens
     on a light one without a second value to keep in sync.
     `margin-inline` STAYS, and its stated reason has changed while its job has not: it was written
     as "20% narrower than the gap it spans, so the capsule stops reading as a bar", and there is no
     capsule to read as anything now. It is still the clearance between the title's text and two
     touch targets, and still the one place the row's width budget is written down. */
  .dtitle { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;
    margin-inline: calc(10% - 0.2 * var(--hbtn-w) - 1.2px);
    min-height: var(--hbtn-d); padding: var(--h-pad) var(--sp-3);
    line-height: var(--lh-snug); text-align: var(--title-align, left); }
  /* A wrapper that is INVISIBLE to layout until fullscreen folds the pause button in beside it.
     `display: contents` is exactly this: the box disappears and its children go on being the flex
     items of .dtitle, so normal mode renders byte-for-byte what it did before the wrapper existed. */
  .dtitle .tcol { display: contents; }
  .dtitle .nmrow { display: flex; align-items: center; gap: 7px; min-width: 0; justify-content: var(--title-align, flex-start); }
  /* The dot is PART of the centred unit, not a marginal glyph hanging off it — the owner's call, and
     the reversal of a deliberate decision, so it is worth saying what was traded. A 9px inert mirror
     used to sit here on the trailing side, which centred the NAME text and let the dot hang left of
     the axis. The name then agreed with the cwd below it, and the dot+name group did not. Now the
     group centres, the dot's spacing is symmetric with the row's own ends, and the name text sits
     ~8px right of the cwd's centre. Both are "off" against something; the owner picked which. Do not
     restore the mirror without asking — it looks like a missing-spacer bug and is not one. */
  /* A long session name truncates rather than shoving the title into a control. It stays centred until
     it fills the space, then behaves like any other overlong label. */
  /* flex: 0 1 auto DEFEATS the generic `.name { flex: 1 }` above. Inheriting it made the name box span
     the whole row, so `justify-content` on .nmrow was inert and the status dot sat pinned at the title
     block's left edge, 77px from the name it labels and touching the back button — the centring looked
     like a bug rather than a decision, and the indicator lost its referent. */
  /* --t-sub against the cwd's --t-stamp, two steps of the scale apart. It was --t-meta (one step,
     12px) while the row was being brought down 44 -> 36, and went back up on the owner's ask for a
     bigger session name — but only the TYPE moved: --h-l1 stays 16, so --hbtn-d, --hbtn-w, their
     even-parity rule, --scrim-solid and the row's own height are all untouched and the row does not
     grow back. 14px in a 16px line box leaves ~0.2px of half-leading, which the ink clears (measured:
     header.mjs checks the glyphs against the box, since this rule also carries overflow: hidden).
     The pair still separates by WEIGHT and colour as well as size — --w-semi against --hint-raised. */
  .dtitle .name { flex: 0 1 auto; min-width: 0; font-size: var(--t-sub); line-height: var(--h-l1); font-weight: var(--w-semi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dtitle .sub { display: block; font-size: var(--t-stamp); line-height: var(--h-l2); color: var(--hint-raised); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The title's contrast floor, in ONE rule over BOTH lines rather than the same declarations
     written twice: the name and the cwd are one title in two sizes, and a treatment on one of them
     alone reads as the other being broken.
     A real STROKE, not a stack of shadows, and that distinction cost a measured failure to find. The
     first version stacked eight same-colour blurs, on the reasoning that a text-shadow's alpha near
     an 11px stroke is well under 1 so density has to come from repetition. It does — and repetition
     also accumulates the 8-bit rounding loss of each composite, so a shadow painted in EXACTLY the
     page's own colour still darkened the ground under it. Measured in isolation: --bg over --bg came
     back six units darker, which rendered as a dark plate the size of the text. We had just removed
     a capsule; this drew one back, in the sloppiest way available. The wide 10px blur was most of it
     (one 3px shadow costs nothing, adding the 10px costs five units).
     `paint-order: stroke fill` is what makes the stroke usable at this size: the stroke paints
     FIRST and the fill covers its inner half, so a 3px stroke is 1.5px of ground outward and the
     glyph's own shape is untouched — no eroded counters at 11px, checked. Two soft shadows carry the
     falloff past the stroke's hard edge, which is what keeps it from reading as an outline.
     --bg is what makes it theme-correct without a second value: it is whatever the page's ground is,
     so it darkens behind light text and lightens behind dark text, and a custom Telegram theme
     carries it along.
     Measured worst-case, over a bright user bubble (scripts/webapp-measure/halo.py): the cwd reads
     5.31:1 dark and 5.88:1 light against a 4.5 floor, up from 1.19 and 2.24 bare. Both halves of the
     fix are load-bearing — with the steeper scrim but no stroke it is 3.43:1, still under. */
  /* …and the whole treatment is GONE, which is the owner's call and not a cleanup: "it has a border
     that doesn't look premium at all". He is right, and the paragraph above says why it was there —
     the cwd had no ground, so the ground was drawn around each letter instead. The scrim's peak now
     reaches down past that line (see #drill::before), so the letters can be letters. Do not put a
     glyph-level treatment back without first checking what the ramp is giving that line: every
     version of this rule was a symptom of a scrim that stopped too high. */
  /* The interrupt keeps NO rule of its own: same fill and same glyph as the back chip, by the owner's
     call, so the base rule above is the whole of it. That supersedes an optical correction that shrank
     its painted disc — both discs measured exactly equal in the rendered PNG, so the size complaint was
     never geometry (a fully saturated shape reads larger than a low-contrast one of identical extent).
     Nothing here is red, so the composer's recording button has no lookalike, which is why this control
     no longer hides itself mid-recording. And it has ONE constant appearance — deliberately not dimmed
     while the session is idle: the green-to-grey status dot beside the name already says that, and
     pressing it while idle is a harmless no-op. */
  pre { margin: 0; padding: var(--sp-3); overflow: auto; flex: 1; white-space: pre; font: var(--t-mono)/1.45 ui-monospace, Menlo, Consolas, monospace; }
  .notice { padding: var(--sp-5) var(--sp-4); color: var(--hint); text-align: center; }
  .err { background: #c0392b; color: #fff; padding: var(--sp-2) var(--sp-3); font-size: var(--t-sub); display: none; }
  .err.show { display: block; }
  .err.ok { background: #2e7d32; }
  /* FLOATING, and it stays in the body to do it. The element is declared before #drill, which is
     `position: fixed; inset: 0` with an opaque --bg at z-index 5, so in the page flow every toast
     raised from the chat view painted underneath the transcript — hit-tested, `msg user` topmost at
     the box's own centre — which is why two different refusals for /new and /cost read to the owner
     as nothing happening. It was never about slash commands: upload failures, the mic's errors and
     every showOk went the same way.
     Re-hosting it INSIDE #drill was the first fix and was wrong in a way worth recording: z-index is
     resolved within a stacking context, and #drill is one at z 5 — so no value on a child of it can
     ever beat a root-level sheet at 9 (#spawn, #sched) or 10 (#dial, #calls, #addctx). It fixed the
     chat view and left a dial failure invisible behind that sheet's backdrop. From the body at 11 the
     one rule clears every overlay there is, and there is no element to move.
     `fixed` also has to mean the viewport here, which is the other reason not to live inside a sheet:
     the sheets animate on `transform`, and a transformed ancestor becomes the containing block for a
     fixed child. Corners because it no longer spans the screen. */
  .err.float { position: fixed; left: var(--sp-3); right: var(--sp-3); z-index: 11;
    bottom: calc(var(--sp-2) + env(safe-area-inset-bottom)); border-radius: var(--r-sm); }
  /* In the chat view it rides the dock — everything that raises one in there is a composer action,
     so the answer belongs beside the thing that asked, and --dock-h carries it up with a grown
     composer or a staged file. Nowhere else has a dock, and reading --dock-h there would lift the
     toast 60px off the bottom for a surface that isn't on screen. */
  .err.float.docked { bottom: calc(var(--dock-h, 60px) + var(--sp-2)); }
  button.rowbtn { background: transparent; border: none; color: var(--hint); font-size: var(--t-title); line-height: 1; padding: 2px var(--sp-2); cursor: pointer; }
  textarea#vedit-area { margin: 0; padding: var(--sp-3); border: none; outline: none; flex: 1; width: 100%; resize: none; background: var(--bg); color: var(--text); font: var(--t-mono)/1.45 ui-monospace, Menlo, Consolas, monospace; }
  /* Tab bar: icon-over-label, one stroke-icon family (inherits color via currentColor) */
  /* padding, not margin or a `top` offset: the strip has to be PAINTED (the bar's own --bg) or the
     page scrolls its content up through it, and it has to belong to the sticky box or the bar
     un-sticks at exactly the offset. Same reasoning for the two fixed views below. */
  .tabs { display: flex; position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--sec); padding-top: var(--safe-top); }
  .tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: var(--sp-2) var(--sp-1) 7px; border: none; background: transparent; color: var(--hint); font-size: var(--t-meta); cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button svg { width: 20px; height: 20px; }
  .tabs button.active { color: var(--btn); border-bottom-color: var(--btn); }
  .tab { display: none; }
  .tab.show { display: block; }
  /* Console (Settings / Usage / Diff) */
  .panel { padding: var(--sp-3); }
  .card { background: var(--sec); border-radius: 10px; padding: var(--sp-3) 14px; margin-bottom: 10px; }
  .card .k { color: var(--hint-raised); font-size: var(--t-meta); }
  .card .v { font-size: var(--t-body); margin-top: 2px; word-break: break-word; }
  .setrow { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--sec); }
  .setrow:last-child { border-bottom: none; }
  .setrow .lbl { flex: 1; }
  .setrow .lbl .sub { color: var(--hint); font-size: var(--t-meta); }
  .setrow .ro { color: var(--hint); font-size: var(--t-sub); }
  .toggle { padding: 6px var(--sp-3); border: none; border-radius: var(--r-sm); background: var(--btn); color: var(--btn-text); font-size: var(--t-sub); cursor: pointer; min-width: 56px; }
  .toggle.off { background: var(--sec); color: var(--hint-raised); box-shadow: inset 0 0 0 1px var(--hint); }
  select.seg { padding: 6px var(--sp-2); border-radius: var(--r-sm); border: none; background: var(--bg); color: var(--text); font-size: var(--t-sub); box-shadow: inset 0 0 0 1px var(--sec); }
  .bar { height: var(--sp-2); border-radius: var(--r-xs); background: var(--bg); overflow: hidden; margin-top: 6px; box-shadow: inset 0 0 0 1px var(--sec); }
  .bar > span { display: block; height: 100%; background: var(--btn); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* Sessions dashboard */
  /* The card's SHAPE is taken from the owner's reference (a Claude-mobile session list), MEASURED off
     it rather than eyeballed: at 720px and ~2x its cards carry a 21px radius, 16px of vertical and
     13.5px of side padding, a 31.5px icon tile inset 13.5 from the left with 9px to the text, and an
     8px gap.
     The owner then read it on device and called the cards too rectangular and too large, so the
     second round is about DENSITY, and the shape is DERIVED rather than copied: boxiness is the
     radius-to-height ratio (0.33 in the reference, 0.16 at --r-2xl on our 128px card) and the fix
     splits across both terms. The corner grows to --r-3xl; the height comes down 128 → 116 by
     reflowing and never by removing — the name takes one line and ellipsizes (the reference's own
     behaviour, and what kills the 165px wrapped-name card), the padding drops back to 12/14 (the
     --sp-4 was sized to host the icon tile that no longer exists), the ✕'s negative margins take its
     44px target off the title row's height, and the gap is the reference's own 8.
     Its CONTENTS are unchanged — this is geometry only.
     There is NO icon tile, and that is a decision rather than an omission. The reference's `</>` is
     the same mark on every row and carries nothing; promoting the status dot into a 36px tile to give
     that tile a job shipped in v0.4.170 and the owner rejected it on device — the bare dot beside the
     name was more functional than a plate around it. So the dot stays in the title line with no
     container, one fifth larger than its original 9px (see .dot), which is the size at which it reads
     as status rather than punctuation. Do not reintroduce a tile of any kind here. */
  .sess { background: var(--sec); border-radius: var(--r-3xl); padding: var(--sp-3) 14px; margin: 0 0 var(--sp-2); cursor: pointer; }
  .sess:active { filter: brightness(1.1); }
  .sess .top { display: flex; align-items: center; gap: var(--sp-2); }
  /* Top-right of each card, and its geometry is the safety, not its colour.
     - A 44px box: this is the one destructive control you meet mid-scroll, so it gets a real target.
     - NO negative LEFT margin. A symmetric one cancelled `.sess .top`'s 8px gap exactly, leaving zero
       dead pixels between "open this session" and "end this session" — one px either side of a boundary.
     - Negative vertical margins so an oversized target doesn't grow the row — −12, not −10, which is
       what makes that literal: 44 − 24 leaves exactly the 20px line box the name sets, so the title
       row is its type's height and the target is still 44.
     - HINT grey, not red. Red once per row reads as "three things are wrong" before "three things can be
       closed", and `.dot.dead` uses that identical red on the SAME row to mean the opposite. The confirm
       carries the danger; the icon needn't shout it. */
  .cardx { background: transparent; border: none; color: var(--hint-raised); cursor: pointer; flex: none;
    width: 44px; height: 44px; margin: -12px calc(-1 * var(--sp-2)) -12px 0; padding: 0;
    display: flex; align-items: center; justify-content: center; }
  .cardx svg { width: 17px; height: 17px; display: block; }
  /* --t-sub, not --t-body: the title line carries the name, up to three chips and a 44px ✕. It is
     also what the reference's own title measures (~14). The task line below it keeps --t-sub and the
     foot keeps --t-meta — the task line is the one read.
     ONE LINE, ellipsized, which is the reference's own behaviour ("…my repo casualsav/exta…") and is
     what took the worst card from 165px to 116: wrapping put a long name on three lines BESIDE the
     chips, so the card grew by the length of its own title. The full name is not lost — it is on the
     element's `title` and in the chat header the moment the card is opened. min-width: 0 is load
     bearing: a flex child will not shrink below its content's intrinsic width without it, so the
     ellipsis never engages and the chips get pushed off the card instead. */
  .sess .nm { font-weight: var(--w-semi); font-size: var(--t-sub); flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hint); flex: none; }
  /* One fifth up from the base 9 — the owner's ask once the tiled version was reverted: it is the
     card's only status indicator, it sits beside 14px type, and at 9 it read as punctuation.
     Scoped to the CARD, never applied to `.dot` itself: the chat header's `#ddot` shares this class,
     and the title there centres on the dot+name GROUP, so two more pixels of dot would move the name
     off the axis that header was measured onto. */
  .sess .dot { width: 11px; height: 11px; }
  .dot.on { background: #4caf50; animation: pulse 1.6s ease-in-out infinite; }
  .dot.dead { background: #e05555; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .chip { font-size: var(--t-meta); color: var(--hint); background: var(--bg); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  /* Inside a CARD the chip is not a control — it is the model/effort label, and .sess .foot already
     renders its metadata as bare spans at this exact size and colour. So the fill goes: half of what
     reads as "boxy" is rectangles nested in a rectangle, and dropping it also hands the ellipsized
     name back ~14px. Scoped, because the identically-named chip in a turn row IS a button with a
     detail sheet behind it and has to keep looking like one.
     Its padding goes with the fill, and that is not cosmetic: 2px of vertical padding on a 12px chip
     made the CHIP the tallest thing in the title row (21.4 against the name's 20.3), so the row —
     and every card — was a pixel taller than its own type for a box nobody can see. */
  .sess .chip { background: transparent; border-radius: 0; padding: 0; }
  .sess .task { color: var(--hint-raised); font-size: var(--t-sub); margin-top: 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .sess .foot { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); font-size: var(--t-meta); color: var(--hint-raised); }
  .sess .foot .bar { flex: 1; margin-top: 0; height: 5px; }
  /* Drill-in (session detail) */
  /* FULL BLEED, and no padding-top any more: the transcript owns the whole screen, including the
     strip where Telegram paints its ✕ Close and its kebab in fullscreen. The offset those need did
     not disappear — it moved into the two things that float over the feed (.vhead's `top`, and the
     feed's own top padding, which is where the first message comes to rest). Owning the strip is the
     point: the chat scrolls THROUGH it rather than starting under a grey band.
     A plain block, not a flex column: nothing is in normal flow here now except the feed. */
  #drill { position: fixed; inset: 0; background: var(--bg); display: none; z-index: 5; }
  #drill.show { display: block; }
  /* The dock floats at the floor with no fill of its own. Its SCRIM lives on the composer (below),
     starting at the capsule's own top edge — the owner's correction: "the gradient on the bottom
     shouldn't start until just at the top of the text input bubble". It ran the whole height of the
     dock for one release, which veiled the working row's band as well and made the pill sit in a
     shaded strip rather than on the transcript. */
  #ddock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; }
  /* The ceiling scrim. Full bleed means the transcript scrolls up into the strip where Telegram
     paints its ✕ Close and its kebab, and a line of message text sliding under those buttons is the
     same defect the collapsed-message fold exists to prevent — text that stops rather than text that
     goes. So it dissolves on the way up. Same eased ramp as the fold, for the same reason (a linear
     one has an onset the eye reads as an edge), and the same fallback shape for an engine without
     color-mix. z-index 1 puts it over the feed and under BOTH floating surfaces, which are z-index 2
     — the chips must stay crisp on top of it, not be faded by it.
     It is transparent exactly at the name pill's BOTTOM edge and reaches full ground by the top —
     never lower. Pushing the ramp below the header was tried, because it makes the chips hold their
     colour perfectly (a chip whose backdrop is already --bg cannot be moved by anything). It also
     paints a bar across the band the transcript had just been given, and takes the chips' glass with
     it, since glass over flat ground is indistinguishable from paint. Full bleed and a steady chip
     pull against each other here, and the transcript wins: the chip's own filter is where the colour
     problem gets solved (see --chip-glass), not by removing what is behind it. */
  /* ── FULLSCREEN ONLY: the header rides UP into Telegram's own chrome row. ───────────────────────
     In fullscreen the client paints its ✕/back pill and its chevron+kebab OVER the page, on a band
     that is otherwise ours to scroll through and nobody's to stand in. Putting the title there buys
     the transcript the whole 46px row the header used to hold, and it lands the chips where the
     ceiling scrim is already at full strength — which is the reason Telegram's own buttons look
     steadier than ours did while a bubble passed. The colour complaint and the space are one fix.
     NOTHING here applies outside fullscreen: there is no such band then (the client's header is
     above the webview, not over it), so `.fs` gates the whole block and normal mode is untouched.
     The horizontal insets are the one guess in this file, and they are a guess because the API does
     not expose them: safeAreaInset/contentSafeAreaInset are top/bottom/left/right only, never the
     chrome buttons' x-extents. Measured off the owner's screenshot at a 360px viewport — ✕ Close
     ends at 72, the chevron cluster starts at 290 — and both are LOCALISED: "Close" in German or
     Russian is wider and would eat the left one. The native BackButton is what makes that safe, since
     an icon-only ← does not grow with the language; --chrome-l drops to the narrower value when it
     is up (see BACK_NATIVE), and the fallback keeps the wide clearance. */
  /* ONE number moves the header up into the client's band, and the ceiling scrim rides along with it
     because both read --head-top. The scrim used to take --safe-top here — the band's FLOOR — which
     put its solid part ~22px below the name and the whole fade a line and a half lower on screen
     than in normal mode. The owner: "in full screen mode the top gradient is much lower than it
     should be… it should have the same one line of text measurement of where it begins under the
     CWD." Now it does, by construction rather than by a second set of numbers. */
  html.fs { --head-top: calc(var(--chrome-top) + (var(--chrome-h) - var(--hbtn-d)) / 2); }
  html.fs #drill .vhead { left: var(--chrome-l, 72px); right: var(--chrome-r, 70px); margin: 0; }
  /* The pause folds INSIDE the capsule, on its right, because the band is only ~218px wide and three
     separate containers cannot live in it: 44 + 44 + gaps leaves 118px for a name and a path. One
     container spends nothing on gaps and lets the title column keep everything the button does not. */
  /* 10% narrower than the band it is given, 5% off each side. The measured clearance (--chrome-l/r,
     72 and 70 on a 360px viewport) came off a screenshot, and a screenshot cannot see the client's
     touch targets — only its ink — so the pill was landing hard against the ✕ and the kebab. This is
     the margin for that error, and it is the right place for it: widening --chrome-l/r would move the
     back chip too, on the one path where ours is still showing. A PERCENTAGE, so it tracks the band
     rather than a viewport it was measured on. */
  html.fs #drill .dtitle { flex-direction: row; align-items: center; gap: var(--sp-2); margin-inline: 5%;
    padding-right: var(--h-pad); }
  html.fs #drill .dtitle .tcol { flex: 1; min-width: 0; display: flex; flex-direction: column;
    justify-content: center; text-align: var(--title-align, center); }
  /* Inside the title it is not a chip. It was written that way when the title WAS a capsule (a chip
     inside a chip reads as a nested surface, and the capsule carried the fill and the frost for
     both); the capsule has since gone, and the rule survives its original reason because fullscreen
     is the one place a bare glyph is safe. The header rides up into Telegram's chrome band there,
     where the ceiling scrim is already at full strength — so this glyph sits on flat --bg, not on a
     passing message, and it matches the bare controls the owner's reference shows beside bare text.
     Outside fullscreen the pause is a side chip and KEEPS its fill; that is not the same control in
     a different state, it is the same control in a different box. */
  html.fs #drill #dstop { background: transparent; box-shadow: none; backdrop-filter: none;
    -webkit-backdrop-filter: none; width: auto; height: auto; padding: 0; flex: none; }
  html.fs #drill #dstop svg { width: 20px; height: 20px; }
  /* Our own back chip yields to the client's ← when that is up; when it is not, it stays exactly
     where it has always been. */
  html.fs.native-back #drill #dback { display: none; }
  /* …and the SPACE that buys, which is the point of the whole block: with the header inside the
     client's own band, the feed no longer reserves a row below it. Top padding falls from
     --safe-top + 36 + 24 to --safe-top + 12, and the scrim's ramp ends at the band's floor instead of
     46px lower. That is the ~46px of transcript the owner asked to reclaim. */
  html.fs #dfeed { padding-top: calc(var(--safe-top) + var(--sp-3)); }
  /* Fullscreen moves the SPLIT, not the shape: the solid part covers the client's whole chrome band
     — where our header now rides, and where its title has to read against whatever scrolls under
     Telegram's own buttons — and the same ramp lands below it. It was `height: var(--safe-top)`,
     which put the ramp's zero AT the band's floor and left the title on half-veiled transcript; the
     deleted glyph stroke was what made that survivable, so this is the fullscreen half of removing
     it. Nothing else here changes: the ::before rule above reads both lengths. */

  /* THE RAMP IS STEEPER THAN IT WAS, and that is the second half of removing the title's capsule —
     not a taste pass on the scrim. The capsule was the contrast floor for both title lines, and with
     it gone the ramp is the only ground they have. Where it lands matters: the ramp is zero at the
     band's BOTTOM edge, and the cwd is the band's bottom LINE, so under the old stops the cwd sat at
     about 5% of --bg, i.e. on raw transcript. Measured over a bright user bubble it read 1.19:1 bare
     and 1.78:1 with the halo — against a 4.5:1 floor and a 5.9:1 design contrast.
     No glyph-level treatment closes that, and several were tried and measured before this was
     touched: a wider blur, blurs stacked to eight, a hard 1px outline, that outline doubled. The
     dark theme's ceiling was 1.78:1, because --hint-raised at 11px and the user bubble are close in
     luminance and the line has no ground to be separated FROM. The ramp is the only thing that can
     give it one. With these stops it reads 5.01:1 dark and 5.51:1 light, and the halo is still
     load-bearing rather than decorative: take the halo off these same stops and the cwd falls to
     3.43:1, under the floor again. Neither half is sufficient alone. scripts/webapp-measure/halo.py
     is what says all of that, and validates itself against the flat-ground control first.
     What it costs is honest and worth stating: the band above the cwd is now near-solid ground, so
     the two side chips' glass has less passing behind it than it did. That is the trade the owner's
     ask forces, and it is the smaller loss — an unreadable path line is a defect, a chip reading
     slightly more solid at the top of the screen is a texture.
     THE PEAK NOW REACHES DOWN TO THE CWD, and that is what retired the glyph treatment rather than
     tuning it. Off the owner's screenshot of the Claude app: its ground is FLAT its own page colour
     across the whole title — measured, 31.3/255 in every column that has no glyph in it — and the
     transcript only begins to emerge a few pixels ABOVE the path line, which is where its ramp
     starts. Ours held full --bg for the top 20px only, so the cwd sat in the middle of the ramp at
     ~72% and needed a stroke around every letter to be legible. The stops are the same eased shape,
     rescaled by 0.964 so full --bg lands at 26px — three above the cwd's own line box — and the tail
     grew 34 → 48 so the ramp is LONGER than the one it replaces (68px against 60) rather than
     steeper. The cwd's ground goes ~72% → ~92%, which is what pays for the stroke's removal. */
  /* The TAIL, and it is the whole answer to "harsh and sudden". The ramp used to end at the header's
     bottom edge, which is also where the cwd sits — so every drop of opacity the cwd needed had to be
     spent in the ~9px between its own baseline and the ramp's zero. That is a cliff by construction,
     and it read as one: the top of a passing bubble went flat grey and then snapped back to blue.
     Extending the element BELOW the header buys the room to fall gently instead. Same peak, same job,
     34 more pixels to finish in. Measured against the owner's screenshot of the Claude app, which is
     the look he asked for: their content is dimmed hard behind the title and clears smoothly well
     below it, with no edge anywhere.
     THIS IS NOT THE SHAPE THAT WAS REJECTED, and the difference is worth being exact about, because
     the two are one sentence apart. That one made the header band OPAQUE and finished the ramp above
     the chips, so nothing passed behind the title at all. This one still fades THROUGH the header —
     the transcript is visibly moving behind the name, which is the point of full bleed — and only
     spends the extra length on the toe. The check that guards it is in bleed.mjs and was rewritten
     with it: an element-height equality could not tell these two apart, so it now measures the
     rendered alpha PROFILE (fades through the band, no cliff, zero by its own floor).
     It also measures BETTER, which is the part that says the old shape was simply badly spent: the
     cwd reads 5.62:1 over a bright bubble against the cliff's 5.46. */
  #drill::before { content: ""; position: absolute; left: 0; right: 0; top: 0; z-index: 1; pointer-events: none;
    height: calc(var(--scrim-solid) + var(--scrim-ramp));
    background: linear-gradient(to bottom, var(--bg), transparent);
    background: linear-gradient(to bottom,
      /* The curve carries TWO jobs and its shape is where they meet. Through the cwd's own line box
         — the ramp's first 38% — it barely moves, because that line's whole legibility is the ground
         under it and it measured 3.75:1 the last time it sat mid-ramp. Below the cwd it is free, and
         that is where the fade actually happens: a long soft toe, "very light" at the floor. Reading
         it upward, which is how it is seen as the transcript scrolls: nothing, then a slow gather,
         then basically solid by the name. */
      var(--bg) 0 var(--scrim-solid),
      color-mix(in srgb, var(--bg) 98%, transparent) calc(var(--scrim-solid) + 0.19 * var(--scrim-ramp)),
      color-mix(in srgb, var(--bg) 94%, transparent) calc(var(--scrim-solid) + 0.38 * var(--scrim-ramp)),
      color-mix(in srgb, var(--bg) 82%, transparent) calc(var(--scrim-solid) + 0.50 * var(--scrim-ramp)),
      color-mix(in srgb, var(--bg) 62%, transparent) calc(var(--scrim-solid) + 0.60 * var(--scrim-ramp)),
      color-mix(in srgb, var(--bg) 42%, transparent) calc(var(--scrim-solid) + 0.70 * var(--scrim-ramp)),
      color-mix(in srgb, var(--bg) 24%, transparent) calc(var(--scrim-solid) + 0.79 * var(--scrim-ramp)),
      color-mix(in srgb, var(--bg) 11%, transparent) calc(var(--scrim-solid) + 0.87 * var(--scrim-ramp)),
      color-mix(in srgb, var(--bg) 4%, transparent) calc(var(--scrim-solid) + 0.94 * var(--scrim-ramp)),
      color-mix(in srgb, var(--bg) 0%, transparent) 100%); }
  /* A PLAIN BLOCK again, deliberately rather than by neglect. It was a flex column for exactly one
     reason — `.work`'s `margin-top: auto` needed free space to absorb, which a block has none of —
     and that row has left the scroller entirely, so the column had no remaining job. Keeping it
     would have meant keeping `#dfeed > * { flex-shrink: 0 }` alongside it, because a flex item with
     `overflow: hidden` has an automatic minimum size of ZERO and shrinks by default: that is what
     crushed every collapsed long message to a sliver in 0.4.135 (268px → 69px for a bubble, 53px for
     a prose reply, with the fold bar painting over the remains). A block container has no shrink
     algorithm, so that entire class of defect is gone by construction instead of held off by a rule.
     scripts/webapp-measure/squash.mjs is the guard if anyone makes it flex again. */
  /* The scroller IS the screen — inset 0, with both floating surfaces reserved as padding rather
     than subtracted from a column. Nothing is occluded at rest and everything scrolls through them.
     TOP: the client's own chrome (--safe-top, 0 outside fullscreen) plus the header's whole
     footprint — 10px margin, its height, 2px margin — plus the --sp-3 every other edge gets.
     BOTTOM: --dock-h, which is MEASURED (see the ResizeObserver) because the dock's height moves
     with the composer growing, the working row arriving and a file staging. The fallback is one
     resting composer, so a browser without ResizeObserver still opens on a sane reservation rather
     than with the newest message under the field.
     That reservation adds NO gutter of its own — the last message carries a 16px bottom margin inside
     the scroller, which IS the gutter, and adding --sp-3 on top doubled it to 28.
     The -10px is the owner's resting position, measured off two screenshots of the same transcript
     (one at rest, one dragged to where he wanted it): the label's ink sat 81.5px above the screen
     bottom and belonged 63.0, an 18.5px drop. Eight of that is --dock-h now being measured to the
     dock's first INK rather than its box, and the remaining ten are here — so the newest message
     rests ~6px above whatever the dock paints first, in every state, rather than 24px above an
     invisible box edge. */
  /* `z-index: 0` is NOT decoration and NOT a no-op: it makes the scroller its own STACKING CONTEXT,
     which is the only thing that keeps the transcript in one plane. Without it the feed is
     `z-index: auto`, so any positioned descendant carrying a z-index competes directly with #drill's
     own layers — and one does. `.msg.clip .more` (the "tap to expand" bar) needs `z-index: 1` to sit
     above its own bubble's fold veil, and that 1 was landing in the SAME context as the ceiling
     scrim's 1; equal z-index resolves by tree order, and #dfeed is a later child than #drill::before,
     so the label painted OVER the scrim. It scrolled up behind the title still at full strength while
     every message around it dissolved — the owner's report, and exactly the "not in the same plane"
     it looks like. Confining that 1 to the feed's own context puts the label back above its veil and
     the whole transcript back under the scrim. 0, not a bigger number: the feed must stay BELOW the
     scrim's 1 and the header/dock's 2. */
  #dfeed { position: absolute; inset: 0; overflow-y: auto; z-index: 0;
    padding: calc(var(--safe-top) + var(--hbtn-d) + 24px) var(--sp-3) calc(var(--dock-h, 60px) - 10px); }
  /* ASYMMETRIC padding, and the asymmetry is the point: the bubble hugs the meta block far tighter
     than it pads a line of text, which is what makes the time read as tucked into the corner. Pulling
     all four sides in instead would drag the top edge onto the first line and change every bubble
     that is already right. Only the BOTTOM moves (8 → 3). */
  /* `width: 100%` restates what a block already does, and it stays. It was added when the feed was a
     flex column, where a cross size of `auto` plus `.msg.user`'s `margin-left: auto` shrink-wrapped
     every short bubble; the feed is a block again, so the declaration is now belt to the block
     layout's braces. Kept rather than removed because it is the one line that makes the 88%-cap
     geometry independent of which layout the feed happens to use — and workpin.mjs measures that cap
     on every run, so it is a checked restatement, not a guess. */
  .msg { width: 100%; max-width: 88%; margin-bottom: var(--sp-2); padding: var(--sp-2) 11px 3px; border-radius: var(--r-md); font-size: var(--t-msg); white-space: pre-wrap; word-break: break-word; display: flow-root; }
  /* The FLOOR gutter, and it has to be one number rather than "whatever the last row's margin is".
     #dfeed's bottom padding is --dock-h MINUS 10, on the stated reasoning that the last message's own
     margin is the gutter — but that margin is 8 on a bubble and 16 on a reply, so the subtraction only
     balanced for a reply. The newest row being a USER bubble is not an edge case: it is every freshly
     sent message, for the whole time the turn takes to answer, and it landed 2px UNDER the working
     pill (measured -1.9). Pinning the floor here fixes the working row and the resting composer at
     once, and leaves the -10 — the owner's measured resting position — alone.
     20 and not --sp-4, because the clearance is this number MINUS that 10: --sp-4 alone restores the
     6px a reply used to get, and the owner asked for more than that ("have the message just a little
     bit higher... bring the verb indicator down"). At 20 the row's air is 10 above and 6 below (2 on
     #dworkhost plus the composer's own --sp-1), i.e. the pill sits nearer the field than the
     transcript — which is the direction he asked for and which the older equal-air rule, written when
     both were 6, cannot also have. The cost he authorised: with no turn running the newest message
     rests 10px above the capsule rather than the 6 he measured off a screenshot. The two gutters are
     one number and cannot part company without a state class, which is not worth 4px. */
  #dfeed > .msg:last-child { margin-bottom: 20px; }
  .msg.user { background: var(--btn); color: var(--btn-text); margin-left: auto; border-bottom-right-radius: var(--r-xs); }
  .msg.user.pending { opacity: .55; }
  /* Session replies carry NO bubble: full content width on the page background, as the reference
     has them. The gutter is #dfeed's own padding — "full width" means the content column, not the
     glass. With the fill gone it is vertical rhythm that separates one reply from the next, so the
     margin doubles; at the old 8px, unbubbled replies ran together into one wall of text. The
     bubble now marks the USER side alone, which is what tells the two apart.
     A turn joins the rule rather than restating it: the same unbubbled, full-width column. */
  .msg.assistant, .msg.turn { background: transparent; max-width: 100%; padding: 0; border-radius: 0; margin-bottom: var(--sp-4); }
  .msg.turn .tp + .tp { margin-top: var(--sp-2); }
  /* NARRATION — the paragraphs a turn emits between its tool calls — is quoted, and that is the one
     thing separating it from the answer. It had no marking at all between the turn-card refactor and
     v0.4.173: turnRow rendered narration and reply through the same branch, so the two measured
     byte-identical (16px/400/normal/--text/no border) on the live page, which is how the owner read
     the mini app as having lost thoughts. Nothing was lost — every `t: 'p'` inside a turn item IS
     narration by construction, since webappSessionFeed lifts the concluding reply out and re-appends
     it as its own assistant row — so this is a marking, not a retrieval.
     The BAR only. No font, size, weight, colour or opacity of its own: those lines are prose by the
     owner's standing instruction and the italic-12px-mono demotion they used to carry is retired.
     The rule is SHARED with .msg.thought rather than copied, because they are the same thing on two
     code paths, and it is the DOM counterpart of the <blockquote> mirror.ts renders this identical
     narration in on the Telegram card.
     ADJACENT paragraphs are ONE quote, split by a chip — also mirror.ts's rule ("merge ADJACENT
     thought paragraphs into one shaded quote"). Three paragraphs must not read as three quotes here
     and one quote there; the grouping is in turnRow. */
  .msg.turn .tq { margin: var(--sp-1) 0; }
  .msg.turn .tq + .chip, .msg.turn .chip + .tq { margin-top: var(--sp-2); }
  /* A local command — the FOURTH voice, and the quietest, because this is the CLI talking rather
     than the model. It joins the unbubbled full-width column above rather than restating it, which
     is also what moves it out of the OWNER's column: `.msg.cmd` set `margin-left: auto`, so the
     CLI's own output was sitting where the owner's words go.
     Nothing here is invented. BOTH lines take the .msg.activity rule verbatim — no font, size or
     colour of their own, so they inherit --t-msg and the page text and read as the same prose as a
     reply. No chevron: a chip's `›` promises a detail sheet and a command has none, so one here
     would be decoration that lies.
     The NAME line has not always said that. It carried --t-sub in --hint, on the stated grounds
     that it "takes the tool chip's exact type, because a command names work that was done, the same
     way 'Read 3 files' does" — and that reasoning is still right, but the thing it tracks moved.
     The tool and thought lines became prose on the owner's instruction two releases before this
     one, and this line stayed behind, so a rule written to MATCH them was the only place still
     showing the demotion they had dropped. Left alone it rendered a bare grey string in the corner
     of the screen, which is what he objected to. This is that drift closing, not a new treatment.
     Monospace is not gone from these rows, it is RESERVED: a fenced block (which is how ansi.ts
     carries a /context table across) still renders as `pre.code`. Alignment, never demotion. */
  .msg.command { background: transparent; max-width: 100%; padding: 0; border-radius: 0; margin-bottom: var(--sp-4); }
  .msg.command .co { margin-top: 3px; }
  /* A subagent's report — the THIRD voice, and the only one that is neither the owner nor this
     session. The app had exactly two treatments and this arrives on the USER side of the transcript,
     so without its own it wore the owner's blue and read as his words. It takes the console's
     existing raised surface rather than a new colour: user = filled blue, right · session = no fill,
     full width · agent = raised card, full width. Distinct by construction, nothing invented.
     The label is on the LEFT of the name because the name is a task title ("Parse CLI working line
     into feed") and reads as a heading without it. --hint-raised, not --hint: this line sits on the
     raised fill, which is exactly the case that variable exists for (--hint falls under AA there). */
  .msg.agent { background: var(--sec); max-width: 100%; }
  .msg.agent .ah { display: flex; gap: var(--sp-2); align-items: baseline; margin-bottom: 3px; font-size: var(--t-meta); color: var(--hint-raised); }
  .msg.agent .ah .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .msg.agent .ah .lb { color: var(--hint-raised); }
  /* The status word is stated plainly and coloured only when it is NOT the expected one — a red
     "completed" on every card would be decoration, and a failure that looked like every success
     would be worse than no status at all. */
  .msg.agent .ah .st { flex: none; }
  .msg.agent .ah .st.bad { color: var(--del); }
  /* A report's headings. One size step above the body and nothing else: <b> already carries the
     weight, and the pre-wrap newline already carries the break, so a margin here would double-space
     against it. Scoped to the two rows that run mdReport() — no assistant reply renders one.
     A command's output is on the list because /context is a markdown document with two heading
     levels, and a shared renderer whose output only styles for one of its callers is the drift this
     rule exists to prevent. */
  .msg.agent .mh, .msg.command .mh { font-size: 1.09em; }
  /* An agent report is long, so it meets the fold — and the fold fades to whatever is BEHIND the
     text, which here is the card's own fill and not the page. Left at the --bg default it paints a
     band of page colour across the card, the same defect the assistant bubble left behind when its
     fill was removed. */
     It sets the veil's TARGET only — the eased ramp itself lives once on `.msg.clip::after`, and
     overriding `background` here instead would silently drop that easing back to a linear fade. */
  .msg.agent.clip::after { --fold-to: var(--sec); }
  .msg.agent.clip .more { background: var(--sec); }
  /* A LINE, not a card: it drops .chip's fill, which belongs to the sessions list — a chip that
     paints a surface here reads as a nested message. Demoted by size and colour, never by weight.
     .cv is the exception, at full text colour: the chevron is the affordance, not decoration. */
  .msg.turn .chip { display: flex; align-items: center; gap: 6px; width: 100%; padding: 3px 0;
    background: transparent; border: none; font-size: var(--t-sub); cursor: pointer; }
  .msg.turn .chip .cl { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .msg.turn .chip .cv { margin-left: auto; color: var(--text); font-size: var(--t-body); }
  /* Chip and sheet row share these. Colour ONLY — a tinted pill re-cards the line above uncards. */
  .cp { color: var(--add); font-style: normal; }
  .cm { color: var(--del); font-style: normal; }
  /* A concluded turn folds its thinking into a native <details>: the marker is the affordance, so
     only type is set. Open state survives the repaint in JS — see openTurns. */
  .msg.turn summary { cursor: pointer; color: var(--hint); font-size: var(--t-sub); }
  /* Left padding drops to 0 with the assistant's: the 11px existed to line these up with bubbled
     text, and against an unbubbled reply it reads as an indent that means nothing.
     Type and colour are deliberately ABSENT: these lines carry no font, size or colour of their own,
     so they inherit .msg's --t-msg and the page's text colour and read as the same prose as a reply.
     They were an italic 12px monospace in --hint; the owner asked for the prose face, the prose size
     and no dimming, which retires a demotion an earlier release kept on purpose. Nothing replaces it
     — no rule, no gutter, no residual tint — so do not reintroduce one here. */
  .msg.activity { background: transparent; padding: 2px 0; margin-bottom: 3px; }
  /* THERE IS NO QUOTE BAR. The owner asked for it gone — "a line to the left that I don't like" —
     and the archaeology says something a future session must not undo by being faithful to it: the
     bar had been there since v0.4.49 and he had never really SEEN it. Rendered from the old builds
     and sampled in pixels, v0.4.107 (the last release before narration vanished, the state he asked
     to be returned to) drew it 17/255 from the ground beside it; the v0.4.173 revival drew the same
     2px at 46/255, because --sec had drifted to 9/255 of --bg under the v0.4.165 header pin and the
     bar was moved to a token that could be seen. So the revival did not ADD a line, it made an
     invisible one visible — and what he is rejecting is the visibility, not a new decoration.
     `role: 'thought'` has had no producer since the turn-card refactor — narration reaches this
     client inside a turn — so the row rule survives for it and the shared declaration below keeps
     the two paths one appearance. */
  .msg.thought { background: transparent; max-width: 100%; padding: 1px 0; margin: var(--sp-1) 0 6px 0; white-space: pre-wrap; }
  /* THE INDENT IS GONE TOO, and that was a CHOICE rather than a consequence. "The old look minus the
     line" keeps the 10px — the state restored was line + indent + prose, and the ask named one thing
     — so the indent shipped, was rendered beside the version without it, and the owner picked the
     version without it off that contact sheet. So there is no shared declaration here at all: with
     the bar and the indent both gone, narration and the reply differ in NOTHING, which thoughts.mjs
     measures as a count of zero and keeps as the record of a price knowingly paid. Do not "restore"
     the indent as a lost detail, and do not read the byte-identity as the bug it was in v0.4.173 —
     that release was fixing narration that had never been marked at all; this is narration whose
     marking he has seen and declined. `.msg.turn .tq` keeps its own margins below. */
  /* The CLI's own working line, surfaced because this surface has none of Telegram's limits: the
     rotating glyph, the turn's randomised verb, its elapsed time and its token count.
     It DOES recede to --hint, and that does not contradict the note above. Those lines are the
     transcript — content, and prose by instruction. This one is transient status that never enters
     the transcript and is gone when the turn ends, so it is the one thing here that should sit under
     the prose rather than in it. Do not "fix" it into --t-msg to match its neighbours.
     The glyph box is a fixed width: the six spinner characters have different advances, and letting
     the row re-flow on every frame is a jitter you feel more than see.
     ONE line in ONE type, by the owner's instruction: the time and tokens sit directly after the
