     verb rather than pinned to the far right, and they carry no face or size of their own. The mono
     register they used to take is gone with the right-alignment that motivated it. What stays is
     `tabular-nums` — the SAME family at the SAME size, selecting its fixed-width digits — because
     the clock now ticks every second and proportional digits would shove the token text sideways on
     every one of them. The verb is the part that ellipsizes; the numbers never truncate. */
  /* STATIC, and structurally so: the row lives in #dworkhost, a sibling of the scroller, so there is
     nothing for it to scroll WITH. It used to be the feed's last child held down by `margin-top:
     auto`, which put it in the right RESTING place and still carried it away up the page the moment
     you scrolled back through the transcript.
     In flow rather than overlaid, and that is the design decision worth stating: an overlay above the
     feed would need a backdrop so text never showed through it, plus a permanently reserved strip of
     feed padding so the newest message did not sit under it at rest — and it would still collide with
     text mid-scroll. A sibling cannot occlude anything, needs no backdrop, and costs the feed the
     row's own height only while a turn is actually running.
     The gap below is 6, half the 12 the feed's bottom padding used to give it — the owner asked the
     row down toward the field it belongs to. Only the BOTTOM margin moves: the 12px sides are the
     feed's own gutter, which is what keeps the row in the same horizontal spot it has always had, and
     the 3/7 padding is the line's own breathing room. Deliberately NOT --sp-2: this is the distance
     between two surfaces, and it is set against the composer rather than picked off the scale. */
  /* TWO distances, not one, which is why the container's gap is the tight one and .m buys its own
     back: the spinner belongs to the verb it is spinning for (4px, the owner's ask — closer still and
     it collides with the glyph box's own centred slack), while the clock and the token count are a
     separate clause and keep the 8px they always had. There is no per-item gap in flex, so the wider
     distance has to be a margin on the item that wants it. */
  /* The row's own padding is NOT what the eye measures, which is why this pair looks lopsided and is
     not: the air ABOVE the line is the feed's bottom padding (12) plus this padding-top, and the air
     BELOW it is this padding-bottom plus the composer's own padding-top (8). The owner asked for the
     two to match and for the line to sit lower, so 0/4 puts both gaps at 12 — down from 15 above and
     21 below (a 7px pad and a 6px margin, now gone). Move either neighbour's padding and this pair
     has to be re-derived from it, never nudged. */
  /* The row's air above and below is equal (the owner's ask), and with the dock floating both sides
     are now measured against the SAME reservation: the feed's bottom padding is --dock-h plus a
     gutter, and the row sits at the dock's top edge. There is deliberately no `.working` override on
     that padding any more — it existed to hand back a gutter that was doubled up while the row stood
     in the flex column, and in a floating dock the row's height is already inside --dock-h. Leaving
     it in place zeroed the whole reservation whenever a turn was running, which put the newest
     message 77px UNDER the composer. */
  /* A PILL around the line itself, not a band across the screen — the owner's ask, and the reason the
     scrim below it is gone rather than restyled. Full-bleed shading was the right shape when the row
     was the only thing between the transcript and the field; now that the dock lays down its own
     strip, a second full-width veil sitting on top of it read as a stripe. Hugging the text puts the
     density exactly where it is needed and nowhere else.
     The gutter moved to the HOST: the pill shrink-wraps, so a padding on the row would be the pill's
     own inner air rather than its distance from the screen edge, and the row would start at x=0.
     11px of inner padding, which is the BUBBLE's own — that lands the line's text on the message
     column (23px) while the pill's box keeps the feed's 12px gutter. The row's text used to sit at
     12, aligned with the gutter and 11px left of every message; the pill fixes both at once, and
     workpin.mjs now measures the two claims separately. */
  /* Do NOT try to buy the row air above with a padding-top here — it is inert, and inertly plausible.
     --dock-h is measured to the dock's first INK, i.e. to the row's own top, so this box growing
     upward moves the dock's top edge and the row's top by the same amount and the row lands exactly
     where it did. The row's air ABOVE is the feed's floor gutter (see #dfeed > .msg:last-child); only
     the air BELOW is set here, and it is 2 + the composer's own --sp-1 (4), i.e. 6. */
  #dworkhost { padding: 0 var(--sp-3) 2px; }
  .work { display: inline-flex; align-items: baseline; gap: 4px; padding: 3px 11px;
    border-radius: 999px; background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: var(--chip-glass); -webkit-backdrop-filter: var(--chip-glass);
    color: var(--hint); font-size: var(--t-meta); }
  /* 78% and its own frost, which is exactly what the full-width band carried — the pill has to hold
     this line's ground ALONE now. It briefly ran at 60% on the arithmetic that the dock's 45% sat
     underneath it and the two composited back to 78%; that was true for one release, and then the
     strip's scrim moved down to start at the capsule (the owner's ask), leaving the pill over raw
     transcript. Measured, it cost the line 3.20:1 → 2.62:1 over a bright bubble. If the strip's scrim
     ever reaches back up here, this number has to come down again by the same rule.
     No mask, though: a pill's edge is meant to be an edge. The feathering existed to stop a
     full-width band from reading as a rule across the page, which is the complaint that retired it. */
  .work .g { width: 1.1em; flex: none; text-align: center; }
  .work .v { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .work .m { flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; margin-left: 4px; }
  /* Reduced motion stops the CYCLE, not the signal — the glyph rests on a single character while the
     elapsed and token counts keep climbing on the poll, which is the liveness cue that matters and
     is text, not animation. Handled in startWorkGlyph(), which never starts the timer; the resting
     glyph ships in the DOM either way. */
  /* Telegram-style composer: ONE pill spanning the strip, with the paperclip and the round
     mic/send button living INSIDE it — the pill wraps around the mic rather than sitting beside it. */
  /* No divider rule: in the reference the capsule's own fill is what separates the composer from the
     feed. The rim belongs on the capsule, where it lights an actual edge — put it on this full-bleed
     strip instead and it draws the very hairline the line above says the design doesn't have. */
  /* The staged-attachment strip. It shares the composer's own 10px inset so the thumbnail's left
     edge sits on the capsule's, and it is `display: none` when empty rather than an empty flex row —
     an empty row still pays its padding, which would lift the composer by 10px with nothing in it.
     The ✕ hangs OUTSIDE the thumbnail's corner (a negative offset, not a corner overlay) because a
     44px thumb has no room to spare and the mark has to stay a 20px touch target. */
  #dstage { display: none; align-items: center; gap: var(--sp-2); padding: var(--sp-1) 10px var(--sp-2); }
  #dstage.on { display: flex; }
  #dstage .thumb { position: relative; flex: none; }
  #dstage .thumb img, #dstage .thumb .doc { width: 44px; height: 44px; border-radius: 10px; display: block;
    object-fit: cover; background: var(--sec); font-size: 22px; line-height: 44px; text-align: center; }
  #dstage .x { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; padding: 0; border: none;
    border-radius: 50%; background: var(--bg); color: var(--text); box-shadow: var(--chip-lift); cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  #dstage .x svg { width: 12px; height: 12px; display: block; }
  #dstage .nm { min-width: 0; font-size: var(--t-meta); color: var(--hint-raised); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* padding-top is --sp-1, not --sp-2, and it is the ONE number that sets how far the working line
     sits above the field: the row's own box gives 2, this gives the rest, so the pair reads 6px
     instead of 10 (the owner's "bring it down closer, minimal padding between them"). Nothing else
     moves — the dock is bottom-anchored, so a shorter top padding lowers the row rather than lifting
     the capsule, and --dock-h is measured to the dock's first INK, so the feed's reservation follows
     by itself in the state where there is no row at all. */
  .composer { position: relative; display: flex; gap: var(--sp-2); padding: var(--sp-1) 10px calc(var(--sp-2) + env(safe-area-inset-bottom)); align-items: flex-end; }
  /* The strip's scrim, and everything about it is where it STARTS. `inset: var(--sp-1) 0 0` is the
     composer's own padding-top, i.e. exactly the capsule's top edge, so the transcript runs clear
     until it reaches the field and dissolves from there down — Telegram's own composer, and the
     owner's correction to a version that veiled the whole dock.
     The fill is --bg's OWN colour, so over the page (which is what is behind this strip nearly all of
     the time) it is literally the page: no band, no edge. Only content passing under it is dimmed,
     and BARELY — 22%, the owner's calibration ("super subtle, barely noticeable, and text in messages
     should still be readable as it passes under"). It went out at 45% with the chip glass on it and
     that was too much of both: the blur is what made the text under it unreadable, so there is no
     backdrop-filter here at all. This surface is the one place in the file where a frost is WRONG —
     the capsule and the header chips blur because their own text has to win over what passes behind
     them, and nothing is written on this strip.
     The 14px mask is a fade-IN over the capsule's first pixels rather than a hard line across the
     side margins, where the capsule's own fill does not cover.
     A ::before rather than a background on .composer so the blur applies to the BACKDROP and not to
     the capsule and its text; `z-index: -1` keeps it behind them, and #ddock's `z-index: 2` is the
     stacking context that keeps that -1 from competing with the ceiling scrim. */
  .composer::before { content: ""; position: absolute; inset: var(--sp-1) 0 0; z-index: -1; pointer-events: none;
    background: color-mix(in srgb, var(--bg) 22%, transparent);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14px);
    mask-image: linear-gradient(to bottom, transparent, #000 14px); }
  /* `align-items: flex-end`, and it is load-bearing twice over. It is what keeps the mic ROUND —
     the default `stretch` would pull a 40px button to the pill's full content height and the glyph
     would no longer sit centred in a circle. It is also what pins both controls to the BOTTOM of
     the pill, as the reference has them, if the textarea ever grows past one line.
     `border-radius` is half the height, so the pill's right end is a semicircle centred on exactly
     the same point as the mic (ring 3 + radius 20 = 23) — that concentricity is what makes the ring
     read as even all the way around the button rather than only above and below it. */
  /* padding-left drops 14 → the ring, because the capsule's first item is now the dial pill rather
     than the text: 14px was the placeholder's inset and the pill wants the same air as the mic on the
     other end. The text's own inset moved onto the textarea below, so the placeholder is unmoved. */
  /* `min-width: 0` on BOTH the capsule and the field, and it takes both. The field's lets it shrink;
     the capsule's is what stops its own automatic minimum size — computed from the textarea's
     cols-based min-content width, which does not care that the field itself was told it may shrink —
     from holding the capsule open past the screen. With only one of the two, a long model name on
     the pill pushed the capsule to 508px inside a 390px strip and carried the mic off-screen. It
     does not scroll the PAGE, because a fixed-position subtree contributes no scrollable overflow —
     so this fails silently, with the send button simply unreachable. */
  /* The capsule is the SAME painted surface as the header's chips — --chip-fill over --chip-glass —
     by the owner's ask, and it is what lets the dock have no fill of its own: the transcript passes
     behind the field, frosted, instead of behind a grey bar. The inset highlight stays; it is the
     rim that reads as a raised surface, and translucency doesn't remove the need for it. */
  .inputwrap { flex: 1; min-width: 0; display: flex; align-items: flex-end; background: var(--chip-fill);
    backdrop-filter: var(--chip-glass); -webkit-backdrop-filter: var(--chip-glass);
    border-radius: calc(var(--pill-h-1) / 2); padding: var(--pill-ring); min-height: var(--pill-h-1); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  /* The model/effort pill, styled after the reference's blue "Open" chip: text only, no icon.
     Height is the reference's proportion against the one control both frames share — a 56.1px chip
     beside a 66.7px mic, so 0.84 of our 40px mic. The margin is NOT a nudge: at one line the
     reference centres this chip on the same axis as the mic (measured 46.9 vs 47.4 in a 102px crop),
     and since `align-items: flex-end` pins it to the capsule's floor, half the difference between it
     and the mic is exactly what puts the two back on one axis. It stays bottom-anchored when the
     field grows, like the clip and the mic. */
  /* The left inset is CONCENTRIC, the same rule the mic's ring answers to at the other end: the
     capsule's left arc is centred --pill-h-1/2 in from its edge, so putting the chip's own arc centre
     on that line — an extra (--pill-h-1 - --dial-h)/2 - --pill-ring, i.e. 3px past the ring — makes
     the two curves share a centre and the blue end read as nested inside the grey one rather than
     crowded against it. It holds at EVERY composer height, since both the chip and the capsule's
     bottom corner are pinned to the same floor. The owner asked for "a little more from the left";
     this is the amount the geometry names, rather than a nudge. */
  .dialpill { flex: none; height: var(--dial-h); margin-bottom: calc((var(--mic-d) - var(--dial-h)) / 2);
    margin-left: calc((var(--pill-h-1) - var(--dial-h)) / 2 - var(--pill-ring));
    border: none; border-radius: calc(var(--dial-h) / 2); background: var(--btn); color: var(--btn-text);
    font-size: var(--t-sub); line-height: 1; padding: 0 12px; cursor: pointer;
    /* 3px, down from 5: the two words are one label, and the tighter set is what pays for the inset
       above without the chip eating more of the field. Not 0 — they are still two words. */
    display: flex; align-items: center; gap: 3px; max-width: 40%; }
  /* The model name carries the weight; the effort rides beside it at the same size, unbolded — the
     one is what you picked, the other is how hard it is being pushed. */
  .dialpill b { font-weight: var(--w-semi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dialpill .eff { opacity: .85; white-space: nowrap; }
  /* Explicit font (not `inherit`): Android WebViews don't reliably propagate an inherited font
     into the IME composition / autofill layer, which then renders in the UA default. */
  /* max-height is the six-line cap spelled as six line boxes plus the field's own padding, so it
     stays six lines if the type scale or line-height ever moves. box-sizing is border-box here,
     which is why the padding term belongs in the sum. */
  /* `min-width: 0` is load-bearing and only became so when the dial pill joined the capsule. A flex
     item's automatic minimum size is its intrinsic width, and a <textarea>'s is its `cols` default
     (~20 characters) — so the field REFUSED to shrink below ~200px and the capsule overflowed the
     screen instead, at which point the whole page scrolls sideways. Measured: a long model name blew
     the capsule from 370 to 508px on a 390px viewport. Every other flex child here is `flex: none`,
     so this is the only item that can give, and it has to be allowed to. */
  .inputwrap textarea { flex: 1; min-width: 0; resize: none; border: none; outline: none; background: transparent; color: var(--text); padding: var(--ta-pad-y) 0 var(--ta-pad-y) var(--sp-2); font: var(--t-body)/var(--ta-lh) -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; max-height: calc(var(--ta-lines) * var(--ta-lh) * 1em + 2 * var(--ta-pad-y)); overflow-y: auto; }
  .ghost { background: transparent; border: none; color: var(--hint); padding: var(--sp-2) 7px; cursor: pointer; line-height: 1; flex: none; }
  /* The capsule's controls should sit a step above its placeholder, as they do in the reference —
     at one tone the whole capsule reads as decoration rather than two affordances beside a label. */
  .inputwrap .ghost { color: var(--text); opacity: .72; }
  /* Recording turns the round button itself red rather than tinting a glyph, because in this state it
     IS the recorder. It does NOT inherit the old pulse: that animated a 19px glyph, and a 40px filled
     circle dropping to .35 opacity reads as a button dying rather than a recorder running. A red fill
     behind a stop square is unambiguous on its own — the square only exists while recording. */
  .sendbtn.recing { background: var(--stop-red); }
  /* Reduced motion: still the two pulses, additively — the base rules and @keyframes pulse are left
     byte-exact rather than edited, because both indicators are load-bearing and shared. Nothing is
     lost when the animation stops: colour already carries both states (green vs grey, red vs hint). */
  @media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
  /* `flex: none` is the other half of keeping this button exactly itself: inside the pill it is a
     flex item, and without it the mic would shrink when the textarea wanted the room. */
  .sendbtn { width: var(--mic-d); height: var(--mic-d); border-radius: 50%; border: none; background: var(--btn); color: var(--btn-text); flex: none; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  /* 20px, not 19: an ODD icon in the 40px button leaves a 10.5px flex gap each side, and Blink
     snaps the SVG's paint origin up to the whole pixel — which put every glyph in here half a pixel
     down and right of centre, at DPR 1, 2, 3 and 4 alike. An even size divides exactly. */
  .sendbtn svg { width: 20px; height: 20px; display: block; }
  /* The plane's bounding box is symmetric but its MASS is not: centroid (13.8, 10.2) against a box
     centre of (12, 12), i.e. 1.8 units up and right. Nudge down-left by that, scaled 20/24. The
     nudge is the PLANE's alone: as `.sendbtn svg` it also displaced the mic and the record-stop
     square, whose artwork is already centred, and that is what knocked the mic's glyph off centre. */
  #dsend svg { transform: translate(-1.5px, 1.5px); }
  /* Feed extras: command chip, attachment chip, inline photo, light markdown */
  /* The `!` bash rows, and only those, since slash commands moved to .msg.command above. The
     monospace stays because a shell's output is preformatted by nature — that is alignment, which
     is the one thing this face is still for here. */
  .msg.cmd { background: transparent; color: var(--link); font: var(--t-mono)/1.4 ui-monospace, Menlo, monospace; margin-left: auto; padding: 2px 11px; max-width: 88%; }
  /* Long message: collapsed to a readable height, tapping opens it. Fading the fold makes the cut
     legible as "there is more" rather than as a sentence that just stops. */
  /* --fold-h reserves the label's row so the fold never draws over a line of text. The bar's height
     is pinned below (line-height 1) precisely so the reservation can be derived rather than guessed.
     It used to be 26px against an inherited 1.45 line-height, which the type scale's 11->12px bump
     silently pushed to 27.4 — the bar drew over the text, and nothing in CSS complains about that. */
  .msg.clip { position: relative; max-height: 268px; overflow: hidden; padding-bottom: var(--fold-h); }
  /* The fold fades to whatever is BEHIND the text. That used to be the assistant bubble's fill;
     now the assistant sits on the page, so the base case is --bg and the user bubble keeps its
     own override below. Left at --sec this paints a grey band across the page background.
     ONE gradient for all three grounds now, with only the target colour overridden — --fold-to is
     what the veil resolves to, so the eased ramp below is written once instead of per variant.

     TWO numbers carry the whole look, and the old pair is why it read as a cheap rule across the
     text. (a) It has to reach FULL opacity exactly where the text is cut — `bottom: --fold-h`, the
     line the content box ends on. It used to stop 4px short of that, so the last row of glyphs was
     still ~90% legible when max-height sliced it horizontally and the label's opaque strip began:
     a hard edge through the middle of a line, which is precisely the artefact. (b) The taper has to
     be long enough to read as depth rather than as a band — 112px, about five lines of the message,
     against the 52 it was.

     And the ramp is EASED, not linear. A linear alpha ramp has a visible onset: the eye finds the
     row where the veil starts and reads it as an edge, which is the same complaint one gradient
     further up. The stops approximate a smoothstep, so it leaves the text imperceptibly and lands
     on the ground firmly. color-mix carries the alpha; the plain two-stop declaration above it is
     the fallback an engine without color-mix keeps, which is exactly today's look. */
  .msg.clip::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 136px;
    --fold-to: var(--bg);
    background: linear-gradient(transparent, var(--fold-to));
    background: linear-gradient(to bottom,
      color-mix(in srgb, var(--fold-to) 0%, transparent) 0%,
      color-mix(in srgb, var(--fold-to) 6%, transparent) 19%,
      color-mix(in srgb, var(--fold-to) 20%, transparent) 34%,
      color-mix(in srgb, var(--fold-to) 44%, transparent) 47%,
      color-mix(in srgb, var(--fold-to) 70%, transparent) 58%,
      color-mix(in srgb, var(--fold-to) 90%, transparent) 67%,
      var(--fold-to) 74%);
    pointer-events: none; }
  .msg.user.clip::after { --fold-to: var(--btn); }
  /* ONE line, always: `.msg.clip`'s padding-bottom reserves exactly this bar's height, so a label
     that wraps to two lines overflows the strip and draws over the text. Ellipsis rather than wrap,
     and the time leads so it is never the part that gets cut. */
  /* ABOVE the veil, and it has to say so: ::after is generated content, so it paints after every
     child — including this label. The veil runs to the element's floor now (it is what puts a clean
     band of ground under the last ghost of text instead of cutting it with this strip's edge), which
     without the z-index would paint straight over the label. */
  .msg.clip .more { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; text-align: center; font-size: var(--t-meta); line-height: 1; opacity: .8; padding: var(--sp-1) 0 6px; background: var(--bg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg.user.clip .more { background: var(--btn); }
  .msg.clip.open { max-height: none; padding-bottom: var(--sp-2); }
  .msg.clip.open::after { display: none; }
  .msg.clip.open .more { display: none; }
  .msg .attchip { font-size: var(--t-sub); opacity: .92; margin-bottom: var(--sp-1); }
  /* A photo FILLS its bubble, Telegram-style: the 11px of blue that used to frame it is cancelled by
     negative margins rather than by a smaller padding, so the text case keeps every number it was
     tuned with. Measured off the owner's reference at 1.75 image px per CSS px — their photo meets
     the caption strip with no gap at all, and the caption's ink sits 11.4px below the picture, which
     is this margin plus the line box's own 4px of leading above the glyphs.
     `border-radius: inherit` on the image-only case, never a literal: a user bubble's bottom-right
     corner is --r-xs and the other three --r-md, so any hand-written radius agrees with the bubble on
     three corners and disagrees on the fourth. */
  .msg img.thumb { width: calc(100% + 22px); max-width: none; min-height: 40px; display: block;
    margin: calc(-1 * var(--sp-2)) -11px 0; border-radius: var(--r-md) var(--r-md) 0 0; }
  /* An ALBUM stacks, 2px apart — Telegram's own gap between the tiles of a group. Only the FIRST
     picture pulls up through the bubble's top padding and only it is rounded there; the rest sit
     square against their neighbours, which is what makes several pictures read as one message rather
     than as a column of separate cards. */
  .msg img.thumb + img.thumb { margin-top: 2px; border-radius: 0; }
  .msg img.thumb + .cap { margin-top: 7px; }
  /* No caption: the picture is the whole bubble, so it bleeds through the bottom padding too and the
     time rides ON it — the reference's own treatment. Left in the flow it was a 25px strip of blue
     under the photo carrying nothing but a clock, which is exactly the "large padding" complaint.
     The scrim is what keeps it readable over a bright photo; a photo is not a controlled background,
     so opacity alone is not enough. */
  .msg.imgonly { position: relative; }
  /* Only the LAST picture bleeds through the bottom padding, and only the ENDS of the stack are
     rounded — written with :only-of-type / :first-of-type / :last-of-type rather than by overriding
     the `+` rule above, which would have re-rounded the middles of a three-picture album. */
  .msg.imgonly img.thumb:last-of-type { margin-bottom: -3px; }
  .msg.imgonly img.thumb:only-of-type { border-radius: inherit; }
  .msg.imgonly img.thumb:first-of-type:not(:only-of-type) { border-radius: var(--r-md) var(--r-md) 0 0; }
  .msg.imgonly img.thumb:last-of-type:not(:only-of-type) { border-radius: 0 0 var(--r-xs) var(--r-md); }
  .msg.imgonly .tstamp { position: absolute; float: none; right: 8px; bottom: 8px; margin: 0;
    padding: 2px 7px; border-radius: 999px; background: rgba(0, 0, 0, .35); color: #fff; opacity: 1;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .msg code { background: rgba(125,139,153,.25); border-radius: var(--r-xs); padding: 0 var(--sp-1); font: var(--t-mono) ui-monospace, Menlo, monospace; }
  /* Code WRAPS rather than scrolls. A horizontally-scrolling region nested inside a vertically
     scrolling feed has no affordance on touch — real transcript lines run past 600 chars, so the
     tail was simply invisible. Wrapping mangles an ASCII table's columns; silently hiding the end of
     a command does worse. */
  .msg pre.code { background: rgba(0,0,0,.28); border-radius: var(--r-sm); padding: var(--sp-2) 10px; font: var(--t-mono)/1.45 ui-monospace, Menlo, monospace; margin: var(--sp-1) 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* Timestamp: floated INSIDE the bubble at bottom-right so the last line of text wraps around it,
     as the reference does, instead of reserving a row under every message. `.msg` gets flow-root so
     the float is contained and can't escape the bubble's height. */
  /* The vertical placement is TWO ported ratios, not two nudged numbers. In the reference the meta's
     baseline sits 0.53 of its own cap height BELOW the last text line's baseline (that drop is what
     makes it read as tucked into a corner rather than as a short line of text), and 0.73 of its cap
     above the bubble's inner bottom edge. Ours was 1.8 caps above the bottom — two and a half times
     the reference's, which is the gap the owner saw. margin-top drops it onto the line's floor;
     .msg's asymmetric bottom padding closes the rest. */
  /* NO negative bottom margin, and this is the dropped-line case earning its own rule: in the shared
     case the text sets the bubble's height so a negative margin here changes nothing, but when the
     meta drops to its own line the float IS the height, and -2px took its clearance from 4.2px down
     to 1.0 — the two cases silently disagreeing by 3px, the tighter one looking clipped. Measured on
     both, which is the only way that shows up. */
  .tstamp { float: right; margin: 11px 0 0 5px; font-size: var(--t-stamp); opacity: .55; white-space: nowrap; line-height: 1; }
  .msg.user .tstamp { opacity: .8; }
  /* Delivery marks, and they mean something narrower than Telegram's: one tick = the daemon accepted
     it, two = the session's OWN transcript echoed it back. Neither claims it was read.
     Height is tied to the meta's own cap height rather than written in px, so the mark and the time
     stay one size if the type step moves; the -1px is the reference's own overhang below the
     baseline, measured, not an optical nudge. */
  /* Re-derived at --t-stamp, not inherited from the 12px version: the block's height is EXACTLY the
     meta's cap height (15/15 in the reference), its width 1.93x its height, and its bottom sits ON
     the baseline — which is where an inline SVG sits by default, so there is no vertical-align at all
     any more. The previous -1px came from the same bad threshold as the "0.56". */
  .tstamp .ticks { margin-left: 5px; height: 8px; width: 10px; }
  .tstamp .ticks2 { width: 15px; }
  /* New-session pill + bottom sheet */
  /* It FLOATS bottom-right over the list, per the reference (measured: 135 x 38.5, 14.5 from the right
     edge and 14 from the true screen bottom). Four things about it are not obvious from the rules:
     - It is STATIC MARKUP, a sibling of the tab, and is never built by renderSessions(). That list is
       wiped and rebuilt on a 4s poll; a control re-created under the thumb loses the tap that lands in
       the swap. showTab() toggles .show, so it also cannot outlive its own screen.
     - z-index 3 clears the list and the sticky tab bar (2) and stays UNDER #drill/#viewer (5, opaque,
       so an open session covers it), the sheets (9/10) and the toast (11). An error outranks a
       launcher: .err.float spans the width at the bottom and covers this while it is up, on purpose.
     - The radius is half the HEIGHT, never 50% — a percentage radius on a non-square box draws an
       ellipse whose flanks disagree with the ends.
     - No drop shadow and no entrance motion. This file separates surfaces by fill and inset rings,
       and an opaque --btn over --bg/--sec is a hue jump rather than a value one, so it needs no lift;
       and since the list repaints every 4s, any reveal or stagger would replay every 4 seconds.
     The list's own bottom padding (see #tab-sessions) is what keeps this from occluding the last card:
     at full scroll that card's floor clears the pill's top by --sp-4. */
  .newfab { display: none; position: fixed; z-index: 3; right: var(--sp-4);
    bottom: calc(var(--sp-4) + env(safe-area-inset-bottom));
    height: var(--fab-h); border-radius: calc(var(--fab-h) / 2); padding: 0 20px; border: none;
    align-items: center; gap: 7px; background: var(--btn); color: var(--btn-text);
    font-family: inherit; font-size: var(--t-body); font-weight: var(--w-semi); cursor: pointer; }
  .newfab.show { display: flex; }
  .newfab:active { filter: brightness(1.1); }
  /* Even against an even --fab-h: the glyph is centred by halved flex free space, and an odd
     difference puts the SVG's paint origin half a pixel down-right (see .sendbtn). */
  .newfab svg { width: 20px; height: 20px; display: block; }
  /* Scroll relief, and the reason the pill can float at all: the pill's own footprint plus a gutter
     either side of it, so the last card can always be scrolled clear of it. */
  #tab-sessions { padding-bottom: calc(var(--fab-h) + 2 * var(--sp-4) + env(safe-area-inset-bottom)); }
  #spawn, #sched { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 9; align-items: flex-end; }
  #spawn.show, #sched.show { display: flex; }
  /* It SLIDES, like #dial / #calls / #addctx — see their block below for the mechanism and the
     reason it is one behaviour rather than four. This sheet is the one that never joined; it appeared
     instantly while every other sheet in the app rose. The transform lives here and the `.up` class
     arrives on the next frame (openSheet/closeSheet), which is what gives the browser a value to
     animate from. Its z-index stays 9, under the dial family's 10 — that ladder is deliberate. */
  .sheet { background: var(--bg); border-radius: var(--r-xl) var(--r-xl) 0 0; padding: var(--sp-4) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom)); width: 100%;
    transform: translateY(100%); transition: transform .18s ease-out; }
  /* The name field sits under the dials now, so it takes the SAME gap the cards take from each other
     — one token, not a number, so a spacing change moves all of them together. */
  #spawn #spname { display: block; margin-top: var(--sp-2); }
  /* The clip box for the hosted dial's 200%-wide page track, and it has to be its own element: the
     overlay clips at .dialsheet, which has no horizontal padding, while .sheet does — so clipping
     there leaves the off-screen page showing through the 16px padding strip at the left edge. This
     box's content width is exactly one page, so the other one has nowhere to show. */
  .dialtrack { overflow: hidden; }
  #spawn.up .sheet, #sched.up .sheet { transform: translateY(0); }
  .sheet .shead { font-weight: var(--w-semi); font-size: var(--t-title); margin-bottom: var(--sp-3); }
  /* --t-body, and this one is a BUG FIX wearing a design change: iOS Safari zooms the whole page when
     a field under 16px takes focus, and the sheet's 14px field did exactly that. */
  .sheet input, .sheet textarea { width: 100%; padding: var(--sp-3); border-radius: var(--r-md); border: none; background: var(--sec); color: var(--text); font-size: var(--t-body); }
  .sheet textarea { resize: none; font-family: inherit; }
  /* The focus ring is OURS now, and until v0.4.174 there was none: no rule in this file touched this
     field's focus, so `outline-style` resolved to the UA's `auto` and every platform painted its own —
     amber on the owner's Android WebView, a white/near-black double ring in headless Chromium off the
     same bytes. That difference is the proof it was never coming from the page.
     --btn, not --link: the ruling that "blue reads as the owner's voice" is about the FEED, where --btn
     is the user bubble's fill. Nothing here is a bubble, and --btn is already this sheet's own
     affirmative colour — every selected chip and the Create button — so the ring speaks in the voice of
     the control it belongs to. :focus, not :focus-visible: a text field is a typing target and the ring
     has to show for touch. Scoped to .sheet, so the composer's deliberate `outline: none` is untouched.
     Chromium traces border-radius with an outline, so it follows the field. */
  .sheet input:focus, .sheet textarea:focus { outline: 2px solid var(--btn); outline-offset: 0; }
  .seglbl { color: var(--hint); font-size: var(--t-meta); margin: var(--sp-3) 0 6px; text-transform: uppercase; letter-spacing: .4px; }
  .segrow { display: flex; flex-wrap: wrap; gap: 6px; }
  /* The schedule sheet's session picker. The spawn sheet used to render its four dials with these
     too; it hosts the composer's dial now, so this is the one caller left. */
  .selchip { border: none; border-radius: 14px; padding: 6px var(--sp-3); background: var(--sec); color: var(--hint-raised); font-size: var(--t-sub); cursor: pointer; }
  .selchip.on { background: var(--btn); color: var(--btn-text); }
  /* Model/effort picker — ONE sheet that slides sideways into a second page, not two sheets. Its own
     rules rather than .sheet's: this one animates, is edge-to-edge, and its rows are the content. */
  /* #calls (a chip's call list) is the SAME sheet — it joins these lists rather than restating the
     backdrop, the slide and the reduced-motion gate, so the two cannot drift. */
  /* #addctx (the paperclip's Camera / Photos / Files sheet) is the THIRD member, and it joins for the
     same reason #calls did: the backdrop, the 180ms slide, the reduced-motion gate and the head are
     one behaviour, and a sheet that restates them is a sheet that drifts from them. */
  #dial, #calls, #addctx { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 10; align-items: flex-end; }
  #dial.show, #calls.show, #addctx.show { display: flex; }
  /* Quick, per the brief — 180ms is about as long as a sheet can take before it reads as sluggish.
     The transform starts off-screen and the .up class is added on the next frame, so the browser has
     a start value to animate FROM; setting display and transform in one tick animates nothing. */
  .dialsheet, .callsheet, .ctxsheet { width: 100%; background: var(--bg); border-radius: var(--r-xl) var(--r-xl) 0 0;
    padding-bottom: env(safe-area-inset-bottom); transform: translateY(100%); transition: transform .18s ease-out; overflow: hidden; }
  #dial.up .dialsheet, #calls.up .callsheet, #addctx.up .ctxsheet { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .dialsheet, .dialpages, .callsheet, .ctxsheet, .sheet { transition: none; } }
  /* A FIXED height, never one that fits the rows: a sheet that sizes to its content rises a
     different distance each time it opens. Rows sit at the top; the space below stays empty. */
  .callsheet { height: 72vh; display: flex; flex-direction: column; }
  #calllist { flex: 1; overflow-y: auto; padding: 0 var(--sp-4) var(--sp-3); }
  /* line-height stays under the node's 19px so the NODE is the tallest item and the row's content
     box is exactly it — the gap to the next node is then the 9px padding twice, which the connector
     assumes. The node is 17 + 2 borders because `*` does not match a pseudo-element, so it keeps
     content-box sizing; an ODD 19 puts its centre on 9.5, where a 1px rule sits exactly. */
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; position: relative; font-size: var(--t-sub); line-height: 18px; }
  .row::before { content: ""; width: 17px; height: 17px; flex: none; border: 1px solid var(--hint); border-radius: 50%; }
  /* ONE rule, on the PAIR: the connector exists BETWEEN nodes, so a border per row hangs a stub off
     the first and the last. -9/18 is exactly the gap the 9px padding leaves in the gutter. */
  .row + .row::after { content: ""; position: absolute; left: 9px; top: -9px; width: 1px; height: 18px; background: var(--sec); }
  /* Mono is the TARGET's alone: it is the only part that is a literal string from the machine. */
  .row .tgt { flex: 1; min-width: 0; color: var(--hint); font: var(--t-mono) ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The grab handle is decoration, not a control — the sheet is dismissed by the ✕, the backdrop or
     Back. Sized off the reference against its mic (64x5 : 66.7). */
  .dialgrab { width: 38px; height: 3px; border-radius: 2px; background: var(--hint); opacity: .5; margin: 8px auto 0; }
  .dialhead { display: flex; align-items: center; padding: var(--sp-3) var(--sp-4) var(--sp-2); }
  .dialhead .t { flex: 1; text-align: center; font-size: var(--t-title); font-weight: var(--w-semi); }
  /* The leading control is ✕ on page one and ← on page two — same slot, same size, so the title does
     not shift as the sheet changes page. The trailing spacer is the ✕'s mirror: without it the
     centred title would sit half a button right of the sheet's centre. */
  .dialhead .lead, .dialhead::after { width: 30px; flex: none; }
  .dialhead::after { content: ""; }
  .dialhead .lead { height: 30px; padding: 3px; border: none; background: transparent; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .dialhead .lead svg { width: 24px; height: 24px; display: block; }
  /* Two pages side by side inside a 200%-wide track; changing page slides the track. Its HEIGHT is
     set from the live page in JS — a track that is as tall as its tallest child leaves the shorter
     page sitting above dead space, which reads as a rendering fault rather than a short list. */
  .dialpages { display: flex; width: 200%; transition: transform .22s ease-out, height .22s ease-out; }
  /* Both hosts: the overlay and the new-session sheet slide the same track the same way. */
  #dial.p2 .dialpages, #spawn.p2 .dialpages { transform: translateX(-50%); }
  /* The sheet hosts the dial with no chrome of its own: page 1 needs no head (the sheet's title is
     the head) and the track loses the overlay's side padding, since .sheet already has --sp-4. */
  #spawn .dialpage { padding: 0; }
  .dialpage { width: 50%; flex: none; padding: 0 var(--sp-3) var(--sp-3); align-self: flex-start; }
  /* One rounded card per group, rows divided by a hairline — the reference's shape. */
  .diallist { background: var(--sec); border-radius: var(--r-md); overflow: hidden; margin-top: var(--sp-2); }
  .dialrow { display: flex; align-items: center; gap: var(--sp-3); width: 100%; text-align: left;
    background: transparent; border: none; border-top: 1px solid var(--bg); color: var(--text);
    padding: 12px 14px; cursor: pointer; font-size: var(--t-body); }
  .dialrow:first-child { border-top: none; }
  .dialrow:active { background: var(--bg); }
  .dialrow .nm { flex: 1; min-width: 0; }
  .dialrow .nm .n { display: flex; align-items: center; gap: var(--sp-2); }
  .dialrow .nm .d { font-size: var(--t-sub); color: var(--hint-raised); margin-top: 2px; }
  /* Selected = the session's CURRENT dial (accent text + check). Default = what /settings 🐣 spawns
     with. Deliberately two different marks: they land on the same row as often as not, and a reader
     who only ever sees them together would take one for the other. */
  .dialrow.on { color: var(--link); }
  .dialrow.on .d { color: var(--link); }
  .dialrow .tick { width: 20px; height: 20px; flex: none; color: var(--link); display: none; }
  .dialrow.on .tick { display: block; }
  .dialrow .badge { flex: none; font-size: var(--t-meta); font-weight: var(--w-semi); color: var(--text);
    background: var(--bg); border-radius: 9px; padding: 2px 8px; }
  .dialrow .chev { width: 20px; height: 20px; flex: none; color: var(--hint); }
  /* The attach sheet's choices. The HEIGHT is the reference's, read off it rather than chosen: its
     cards measure ~102 x 76 CSS px at a 360px viewport. The WIDTH is `flex: 1` and always was, which
     is why losing the Camera card cost this rule nothing — two cards divide the same row.
     Deliberately sized to CONTENT rather than to a fixed sheet height: unlike the dial, this sheet
     has one shape, so there is no second page for a fixed height to hold still against.
     The rim is --sec, which is this app's hairline everywhere else (list rows, .setrow, the file
     viewer's head) rather than a grey invented for these cards. */
  .ctxrow { display: flex; gap: var(--sp-2); padding: 0 var(--sp-4) var(--sp-4); }
  .ctxcard { flex: 1; min-width: 0; height: 76px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: var(--sp-2);
    background: transparent; border: 1px solid var(--sec); border-radius: var(--r-md);
    color: var(--text); font-size: var(--t-sub); cursor: pointer; padding: 0 var(--sp-1); }
  .ctxcard:active { background: var(--sec); }
  /* 22px, and the parity rule from .chatbtn does NOT reach it: this box is centred by flex, but by
     flex on BOTH axes with no fixed free space to halve — the card's height is fixed and its content
     is two stacked items, so the glyph's origin is decided by the column's own layout rather than by
     an odd remainder. Even so it is an even number, because there is no reason for it not to be. */
  .ctxcard svg { width: 22px; height: 22px; display: block; flex: none; }
  .ctxcard span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Both actions take the new-session pill's language (v0.4.171): --fab-h tall, radius half the
     height, --t-body. That is also what buys back the 44px touch target a 9px-padded button did not
     have — this row is the one place in the app where a mis-tap costs you a session.
     Cancel is the UNSELECTED chip's pair (--sec / --hint-raised) rather than a bare text link, so the
     row reads as one family with the chips above it and the dismissal is still visibly the quiet one. */
  .sprow { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: 18px; }
  .sprow .cancel, .sprow .create { border: none; height: var(--fab-h); border-radius: calc(var(--fab-h) / 2);
    padding: 0 20px; font-family: inherit; font-size: var(--t-body); font-weight: var(--w-semi); cursor: pointer; }
  .sprow .cancel { background: var(--sec); color: var(--hint-raised); }
  .sprow .create { background: var(--btn); color: var(--btn-text); }
  .sprow .cancel:active, .sprow .create:active { filter: brightness(1.1); }
  /* Scheduled board */
  .evrow { display: flex; gap: var(--sp-2); padding: var(--sp-2) 2px; border-bottom: 1px solid var(--sec); font-size: var(--t-sub); align-items: baseline; }
  .evrow .who { color: var(--link); white-space: nowrap; }
  .evrow .tx { color: var(--hint); flex: 1; word-break: break-word; }
  .xbtn { background: transparent; border: none; color: #e05555; font-size: var(--t-body); padding: 2px var(--sp-2); cursor: pointer; }
  .sechead { color: var(--hint); font-size: var(--t-meta); text-transform: uppercase; letter-spacing: .4px; margin: var(--sp-4) 2px var(--sp-2); }
</style>
</head>
<body>
<nav class="tabs" id="tabs">
  <button data-tab="sessions" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span>Sessions</span></button>
  <button data-tab="files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span>Files</span></button>
  <button data-tab="auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Scheduled</span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span>Settings</span></button>
</nav>
<div class="err" id="err"></div>

<div class="tab show panel" id="tab-sessions"><div class="notice">Loading sessions…</div></div>
<button class="newfab" id="newfab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New session</button>
<div class="tab panel" id="tab-auto"></div>

<div class="tab" id="tab-files">
  <header>
    <div class="crumbs" id="crumbs"></div>
    <div class="search">
      <input id="q" placeholder="find in this folder…" inputmode="search">
      <button id="go">Find</button>
    </div>
  </header>
  <ul id="list"></ul>
</div>
<input type="file" id="upload-input" multiple style="display:none">

<div class="tab panel" id="tab-settings"></div>

<div id="drill">
  <div class="vhead">
    <button id="dback" class="chatbtn back" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <div class="dtitle"><div class="tcol"><span class="nmrow"><span class="dot" id="ddot"></span><span class="name" id="dname"></span></span><span class="sub" id="dsub"></span></div></div>
    <!-- A filled red octagon: the drawn equivalent of 🛑, which is what it has to read as instantly.
         Drawn rather than the emoji so it matches the paperclip and mic, holds one colour instead of
         rendering differently per platform, and keeps this bar free of the clip-art it was cleared of.
         With the ✕ gone from this bar, nothing else competes for that red. -->
    <!-- A PAUSE glyph, and the word is true: this sends a single Escape, Claude Code's own interrupt.
         The turn halts, the session stays alive at its prompt and the conversation is intact, so the
         header's only remaining action really is a halt rather than a terminate; terminating moved to
         the session cards. Two bars in the square's exact bounding box (12.9 units), canonical pause
         proportions, caps rounded to match the softness of the reference's square. -->
    <button class="chatbtn stop" id="dstop" title="Interrupt" aria-label="Interrupt this session"><svg viewBox="0 0 24 24"><rect x="5.55" y="5.55" width="3.9" height="12.9" rx="1.7" fill="currentColor"/><rect x="14.55" y="5.55" width="3.9" height="12.9" rx="1.7" fill="currentColor"/></svg></button>
  </div>
  <div id="dfeed"></div>
  <!-- The working row's home: OUTSIDE the scroller, so "static" is structural rather than a position
       trick. Empty and zero-height whenever nothing is running — paintWork() creates and removes the
       row inside it, and its lifecycle is untouched by the move. -->
  <!-- The bottom dock: the working row, the staged attachment and the composer, FLOATING over the
       transcript rather than standing in a column beside it. Its height is whatever those three come
       to at the moment, which is why the feed reserves it through a measured --dock-h instead of a
       constant (see the ResizeObserver). -->
  <div id="ddock">
  <div id="dworkhost"></div>
  <!-- A picked file waits HERE until you send it. Above the capsule rather than inside it: the
       capsule's geometry is derived from the mic down to the half pixel, and a chip in that flex row
       would take its width from the textarea. A sibling strip pushes the composer down instead,
       which the feed absorbs the same way it absorbs a growing field. Empty and zero-height with
       nothing staged. -->
  <div id="dstage"></div>
  <div class="composer">
    <div class="inputwrap">
      <!-- Text only, no icon and no emoji, by the owner's call: the model name is the label. It leads
           the capsule the way the reference's blue "Open" chip does. -->
      <button id="ddial" class="dialpill" title="Model and effort"><b id="ddialm">Model</b><span class="eff" id="ddiale"></span></button>
      <!-- The IME must not draw an inline prediction in this field, and that is a DELIBERATE trade,
           not a tidy-up: `autocorrect="off"` is what Chromium maps to Android's
           TYPE_TEXT_FLAG_NO_SUGGESTIONS, and that flag takes autocorrect with it. The owner asked
           for it knowing the cost, because the alternative was worse and could not be fixed.
           WHY IT COULD NOT BE FIXED, so nobody re-opens this: the prediction rendered in a visibly
           different face and size from the typed text, and the obvious cure — match the composer to
           the platform's font — was already in place. The stack below resolves to the system font on
           every platform we run on (`-apple-system` on iOS, `system-ui` → Roboto on Android), which
           is the same face Telegram itself uses there. The gray text is drawn by the KEYBOARD, in
           the device's own UI font at a size the keyboard picks — on a Samsung that is the
           user-selectable One UI face, which Chromium's `system-ui` does not follow — so no
           font-family value in this page can reach it. There is nothing to match; there is only
           whether it draws at all.
           `writingsuggestions` is the standardised half of the same instruction, for the engines
           that read it. -->
      <textarea id="dtext" rows="1" placeholder="Message" autocomplete="off" autocorrect="off"
        writingsuggestions="false" spellcheck="false"></textarea>
      <button id="datt" class="ghost" title="Attach a file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
      <!-- The round button is mic OR send, never both. The PAPERCLIP stays inside the capsule through
         both states on purpose: type-then-attach is a real workflow, and sweeping the clip away with
         the mic the moment text appears would break it silently.
         Both round buttons are SIBLINGS OF THE TEXTAREA, not overlaid on it: the textarea is the only
         flex item that grows, so the buttons' width is reserved by the layout itself and text can
         never run underneath them, however long the placeholder gets. -->
      <button id="dmic" class="sendbtn" title="Record a voice note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>
      <!-- Solid, not outlined: this is the loudest element on the screen, and an outline plane is the
         quietest glyph treatment there is. Every chat app puts a filled mark on a filled button. -->
      <button id="dsend" class="sendbtn" title="Send"><svg viewBox="0 0 24 24"><polygon points="22 2 15 22 11 13 2 9 22 2" fill="currentColor"/></svg></button>
    </div>
    <!-- TWO inputs, because the choice IS the input: there is no API to tell one picker which source
         to open, only differently-declared inputs whose `accept` the platform reads. #dfile keeps its
         id and its job (anything, several at once) so nothing about the existing staging path moves;
         #dfpho only narrows it to images. Both land in the same handler.
         There was a THIRD — `capture="environment"`, for a Camera card — and it is gone because it
         was measured on the owner's device and does not work: Telegram's WebView intercepts the file
         chooser with its own attachment picker, which reads `accept` and ignores `capture`, so the
         Camera card opened the photo library exactly like Photos did. `capture` is only ever a hint
         and a platform may ignore it; this one does. A card that opens the wrong thing is worse than
         no card, so it went. If Telegram ever honours it, the card comes back — nothing else about
         the sheet has to change. -->
    <input id="dfile" type="file" multiple hidden>
    <input id="dfpho" type="file" accept="image/*" multiple hidden>
  </div>
  </div>
</div>

<!-- The paperclip's sheet: where a file comes FROM, asked before the picker opens. It used to fire
     the everything-picker straight away, which on a phone is two taps into the wrong list — the
     gallery is the common case and the file browser is what you get.
     Styled after the owner's reference (Claude mobile's "Add context"): ✕ in the lead slot, centred
     title, three bordered cards with the glyph over its label. The title is OURS — "Add context" is
     their copy for their job, and this one attaches a file to a session. -->
<div id="addctx">
  <div class="ctxsheet">
    <div class="dialgrab"></div>
    <div class="dialhead">

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// --- Fullscreen top offset (see --safe-top). ---------------------------------------------------
// Telegram gives the offset in two halves that STACK: safeAreaInset is the device's (notch, status
// bar) and contentSafeAreaInset is Telegram's own chrome measured INSIDE it. Read through the JS
// accessors rather than the --tg-content-safe-area-inset-top CSS var, because a client too old for
// Bot API 8.0 injects neither the var nor the field — undefined reads as 0 here, whereas the missing
// var would have to be caught by a fallback in every calc() that used it.
const CHROME_FLOOR = 56;  // what the ✕ pill needs when a client reports nothing (or too little).
function syncSafeTop() {
  // Not `isFullscreen === undefined -> assume normal`: on any client without fullscreen at all
  // there is no overlay to clear, and that is the same 0 as fullscreen-off.
  const full = !!(tg && tg.isFullscreen);
  const device = (tg && tg.safeAreaInset && tg.safeAreaInset.top) || 0;
  const chrome = (tg && tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) || 0;
  const px = full ? Math.max(device + chrome, CHROME_FLOOR) : 0;
  document.documentElement.style.setProperty("--safe-top", px + "px");
  // The two halves SEPARATELY as well, because the header now rides INSIDE the second one rather
  // than below their sum. --chrome-h falls back to the floor minus whatever the device took, so a
  // client that reports only a total still yields a band to centre in rather than a zero-height one.
  document.documentElement.style.setProperty("--chrome-top", (full ? device : 0) + "px");
  document.documentElement.style.setProperty("--chrome-h", (full ? Math.max(chrome, px - device) : 0) + "px");
  // The layout gate. A class, not a media query: `isFullscreen` is the only thing that says the
  // client is painting its chrome OVER us, and the insets alone cannot tell that apart from a notch.
  document.documentElement.classList.toggle("fs", full);
  // The pause button belongs to a different BOX in each layout — inside the capsule up in the chrome
  // band, a chip of its own on the row below — so it is moved rather than restyled into place.
  // getElementById directly: syncSafeTop runs before `$` is declared and would hit its dead zone.
  const head = document.querySelector("#drill .vhead");
  const cap = head && head.querySelector(".dtitle");
  const stop = document.getElementById("dstop");
  if (head && cap && stop) (full ? cap : head).appendChild(stop);
}
// Telegram's own chrome colour is NOT in themeParams, and that is the whole reason this constant
// exists. `header_bg_color` reports #252D3A on the owner's client while the bar it actually paints
// measures #1D2733 — sampled off his screenshots, where the status bar and the ✕ Claude Code row are
// the same flat value to the unit. No variable carries it, so the page is pinned to the sampled hex:
// his instruction, "settle it by sampling the exact hex colour number".
// Gated on the resolved theme being DARK, and read from a rendered probe rather than from
// tg.colorScheme: the flag is only as good as the client that sets it, while the probe answers the
// question actually being asked — is the page we are about to override a dark one. A light theme
// keeps its own colours, where this mismatch has not been measured and a dark constant would be a
// disaster rather than a mismatch.
const TG_CHROME_DARK = "#1D2733";
function pinChromeColour() {
  const root = document.documentElement;
  root.style.removeProperty("--bg");   // ask the theme first, or this reads its own last answer
  const probe = document.createElement("div");
  probe.style.cssText = "position:absolute;width:0;height:0;background:var(--bg)";
  document.body.appendChild(probe);
  const [r, g, b] = (getComputedStyle(probe).backgroundColor.match(/\d+/g) || [255, 255, 255]).map(Number);
  probe.remove();
  if ((0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 < 0.5) root.style.setProperty("--bg", TG_CHROME_DARK);
}
pinChromeColour();
if (tg) {
  syncSafeTop();
  // The insets arrive asynchronously and change independently of the fullscreen flag (rotation,
  // a client that reports them a beat after ready()), so all three events feed the same recompute.
  for (const e of ["fullscreenChanged", "safeAreaChanged", "contentSafeAreaChanged"])
    try { tg.onEvent(e, syncSafeTop); } catch {}
  // A theme switch re-runs the pin, both directions: into dark it applies, out of it the removeProperty
  // at the top hands the page back to the theme.
  try { tg.onEvent("themeChanged", pinChromeColour); } catch {}
}
const INIT = (tg && tg.initData) || "";
const AUTH = { Authorization: "tma " + INIT };

const $ = id => document.getElementById(id);
const errBox = $("err");
// One toast, one element, two layouts. In the page flow it is painted over by anything opaque above
// it — the chat view, and every bottom sheet — so whenever one of those is up it floats instead (see
// .err.float). The banner is kept for the bare tabs view because that surface already worked and a
// box that floats everywhere covers the nav on the home screen for four seconds.
// EVERY overlay is listed, not just the chat: a toast behind a sheet is the same invisible error,
// and the dial raises one by calling closeDial() and then sessionAct() — the backdrop is still
// painting through its 180ms transition when the failure arrives.
const OVERLAYS = ["dial", "calls", "addctx", "spawn", "sched", "viewer"];
function floatToast() {
  const drilled = $("drill").classList.contains("show");
  const sheet = OVERLAYS.some(id => { const e = $(id); return e && e.classList.contains("show"); });
  errBox.classList.toggle("float", drilled || sheet);
  // The dock is the chat view's own, so only that view anchors to it. A sheet open over the tabs
  // sits on a screen with no dock at all.
  errBox.classList.toggle("docked", drilled);
}
function showErr(m) { floatToast(); errBox.textContent = m; errBox.classList.add("show"); setTimeout(() => errBox.classList.remove("show"), 4000); }
function showOk(m) { floatToast(); errBox.textContent = m; errBox.classList.add("show", "ok"); setTimeout(() => errBox.classList.remove("show", "ok"), 2500); }

const LONG_MSG = 700;   // chars past which a feed bubble collapses behind a tap-to-expand
let WRITE = false;   // set from /api/ls (.write) — gates all edit/delete UI; mirrors WEBAPP_WRITE on the server

// POST a JSON write op with auth; surface server errors (incl. 409 edit conflicts). Returns parsed body or null.
async function writeOp(endpoint, body) {
  try {
    const r = await fetch(new URL(endpoint, location.origin), {
      method: "POST", headers: { ...AUTH, "content-type": "application/json" }, body: JSON.stringify(body),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { showErr(d.reason || d.error || ("HTTP " + r.status)); return null; }
    return d;
  } catch { showErr("request failed"); return null; }
}

async function api(path, params) {
  const u = new URL(path, location.origin);
  for (const k in (params || {})) u.searchParams.set(k, params[k]);
  const r = await fetch(u, { headers: AUTH });
  if (!r.ok) { showErr("API " + r.status + (r.status === 401 ? " — open from Telegram" : r.status === 403 ? " — not authorized" : "")); throw new Error(r.status); }
  return r.json();
}

function fmtSize(n) { if (n < 1024) return n + "B"; if (n < 1048576) return (n / 1024).toFixed(0) + "KB"; return (n / 1048576).toFixed(1) + "MB"; }

let cur = new URLSearchParams(location.search).get("start") || "/";

function renderCrumbs(path) {
  const parts = path.split("/").filter(Boolean);
  let acc = "";
  const links = ['<a href="#" data-p="/">/</a>'];
  for (const p of parts) { acc += "/" + p; links.push('<a href="#" data-p="' + acc + '">' + p + '</a>'); }
  $("crumbs").innerHTML = links.join(" <span style=color:var(--hint)>›</span> ");
  $("crumbs").querySelectorAll("a").forEach(a => a.onclick = e => { e.preventDefault(); ls(a.dataset.p); });
}

async function ls(path) {
  let data;
  try { data = await api("/api/ls", { path }); } catch { return; }
  cur = data.path;
  WRITE = !!data.write;
  renderCrumbs(cur);
  const list = $("list");
  list.innerHTML = "";
  if (data.parent) list.appendChild(row("⬆️", "..", "", () => ls(data.parent)));
  if (WRITE) { list.appendChild(row("📤", "Upload file", "", pickUpload)); list.appendChild(row("➕", "New folder…", "", newFolder)); }
  for (const e of data.entries) {
    const ico = e.type === "dir" ? "📁" : e.type === "symlink" ? "🔗" : "📄";
    const meta = e.type === "dir" ? "" : fmtSize(e.size);
    const full = (cur === "/" ? "" : cur) + "/" + e.name;
    list.appendChild(row(ico, e.name, meta, e.type === "dir" ? () => ls(full) : () => openFile(full), { path: full, type: e.type }));
  }
}

function row(ico, name, meta, onclick, opts) {
  const li = document.createElement("li");
  li.innerHTML = '<span class="ico"></span><span class="name"></span><span class="meta"></span>';
  li.children[0].textContent = ico; li.children[1].textContent = name; li.children[2].textContent = meta;
  li.onclick = onclick;
  // Show the ⋯ menu for every file (Download is read-only-safe) and, when WRITE, for folders too.
  if (opts && opts.path && (opts.type === "file" || WRITE)) {
    const b = document.createElement("button");
    b.className = "rowbtn"; b.textContent = "⋯";
    b.onclick = e => { e.stopPropagation(); rowMenu(opts.path, opts.type); };
    li.appendChild(b);
  }
  return li;
}

let vPath = null, vMtime = 0, vEditable = false;

async function openFile(path) {
  let data;
  try { data = await api("/api/read", { path }); } catch { return; }
  $("vname").textContent = path.split("/").pop();
  const body = $("vbody"), notice = $("vnotice"), ta = $("vedit-area");
  vPath = path; vMtime = data.mtime || 0; vEditable = !data.binary && !data.tooLarge;
  $("vdl").onclick = () => download(path);
  ta.style.display = "none"; $("vsave").style.display = "none";          // reset to view state every open
  $("vedit").style.display = (WRITE && vEditable) ? "" : "none";
  if (data.binary || data.tooLarge) {
    body.style.display = "none"; notice.style.display = "block";
    notice.textContent = data.binary ? "Binary file — download to view." : "File too large to preview (" + fmtSize(data.size) + ") — download it.";
  } else {
    notice.style.display = "none"; body.style.display = "block";
    body.textContent = data.content;
  }
  $("viewer").classList.add("show");
}
$("vclose").onclick = () => $("viewer").classList.remove("show");
// Back: leave the viewer and land in the folder the file lives in (robust even after a search).
$("vback").onclick = () => { $("viewer").classList.remove("show"); ls(vPath ? (vPath.split("/").slice(0, -1).join("/") || "/") : cur); };

// Edit: swap the <pre> for an editable textarea; Save POSTs /api/write with the mtime we read, so the
// server 409s if the file changed underneath us. Edit/Save buttons only render when WRITE && text file.
$("vedit").onclick = () => {
  const ta = $("vedit-area");
  ta.value = $("vbody").textContent;
  $("vbody").style.display = "none"; ta.style.display = "block";
  $("vedit").style.display = "none"; $("vsave").style.display = "";
  ta.focus();
};
$("vsave").onclick = async () => {
  const ta = $("vedit-area");
  const d = await writeOp("/api/write", { path: vPath, content: ta.value, mtime: vMtime });
  if (!d) return;   // error (incl. conflict) already surfaced
  vMtime = d.mtime; $("vbody").textContent = ta.value;
  ta.style.display = "none"; $("vbody").style.display = "block";
  $("vsave").style.display = "none"; $("vedit").style.display = "";
  showOk("Saved");
};

// Per-row ⋯ menu (rename / delete-to-trash); native Telegram popups when available, prompt() otherwise.
function rowMenu(path, type) {
  const name = path.split("/").pop() || path;
  const buttons = [];
  if (type === "file") buttons.push({ id: "download", text: "Download" });
  if (WRITE) { buttons.push({ id: "rename", text: "Rename" }); buttons.push({ id: "delete", type: "destructive", text: "Delete" }); }
  if (buttons.length < 3) buttons.push({ id: "cancel", type: "cancel" });   // Telegram popups allow ≤3 buttons
  const act = id => {
    if (id === "download") download(path);
    else if (id === "rename") { const nn = prompt('Rename "' + name + '" to:', name); if (nn && nn !== name) writeOp("/api/rename", { path, newName: nn }).then(d => { if (d) { showOk("Renamed"); ls(cur); } }); }
    else if (id === "delete") confirmDelete(path, name);
  };
  if (tg && tg.showPopup) tg.showPopup({ title: name, message: "File actions", buttons }, act);
  else {
    const keys = [type === "file" ? "S to save" : null, WRITE ? "R to rename" : null, WRITE ? "D to delete" : null].filter(Boolean).join(", ");
    const c = prompt('"' + name + '" — type ' + keys);
    if (c === "S" || c === "s") act("download"); else if (c === "R" || c === "r") act("rename"); else if (c === "D" || c === "d") act("delete");
  }
}
function confirmDelete(path, name) {
  const go = () => writeOp("/api/rm", { path }).then(d => { if (d) { showOk("Moved to trash"); ls(cur); } });
  if (tg && tg.showConfirm) tg.showConfirm('Move "' + name + '" to trash?', ok => { if (ok) go(); });
  else if (confirm('Move "' + name + '" to trash?')) go();
}
async function newFolder() {
  const n = prompt("New folder name:");
  if (!n) return;
  const d = await writeOp("/api/mkdir", { path: cur, name: n });
  if (d) { showOk("Folder created"); ls(cur); }
}
// Upload from device: a hidden <input type=file> opens the native picker; each chosen file is POSTed
// as multipart to /api/upload (into the folder open when picked), then the folder refreshes. Collisions
// auto-dedup server-side, so re-uploading never clobbers. FormData sets its own content-type → AUTH only.
const uploadInput = $("upload-input");
function pickUpload() { uploadInput.value = ""; uploadInput.click(); }
uploadInput.onchange = async () => {
  const files = [...uploadInput.files];
  if (!files.length) return;
  const dir = cur;   // capture now — the user could navigate before uploads finish
  let okN = 0;
  for (const f of files) {
    const fd = new FormData();
    fd.append("dir", dir); fd.append("file", f, f.name);
    try {
      const r = await fetch(new URL("/api/upload", location.origin), { method: "POST", headers: AUTH, body: fd });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { showErr((f.name) + ": " + (d.reason || d.error || ("HTTP " + r.status))); continue; }
      okN++;
    } catch { showErr("upload failed: " + f.name); }
  }
  if (okN) { showOk("Uploaded " + okN + " file" + (okN === 1 ? "" : "s")); if (cur === dir) ls(dir); }
};

// Mint a short-lived download token (authed) so a header-less fetch — Telegram's native saver or the
// external browser — can pull the file. Returns the token, or null on failure.
async function dlToken(path) {
  try {
    const r = await fetch(new URL("/api/dl-token", location.origin), {
      method: "POST", headers: { ...AUTH, "content-type": "application/json" }, body: JSON.stringify({ path }),
    });
    const d = await r.json().catch(() => ({}));
    return r.ok ? d.token : null;
  } catch { return null; }
}

// Save a file to the device. Prefer Telegram's native "Save to Files" dialog (downloadFile, Bot API
// 8.0+); else open the tokenized URL in the external browser (it downloads via Content-Disposition);
// else (plain browser / dev) fetch with auth and click a blob <a download>. The first two fetch the URL
// without our header, so they go through a token; the blob path stays header-authed.
async function download(path) {
  const name = path.split("/").pop();
  const canNative = tg && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") && tg.downloadFile;
  const canOpen = tg && tg.openLink;
  if (canNative || canOpen) {
    const tok = await dlToken(path);
    if (tok) {
      const u = new URL("/api/download", location.origin);
      u.searchParams.set("path", path); u.searchParams.set("t", tok);
      const abs = u.toString();
      if (canNative) { tg.downloadFile({ url: abs, file_name: name }); return; }
      tg.openLink(abs); return;
    }

function md(s) {

  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:]|$)/g, "$1<i>$2</i>");

// message in the app, which is the owner's call and not this change's. Same sanitizer path: md() still escapes first, so nothing new can inject markup.
// Fenced blocks are split out BEFORE the line rules run — a `#` or `-` inside code is code, and a
// line-level regex over md()'s finished output would have rewritten it.

  $("spname").focus();
  // After the sheet is up, not before: one GET must never hold the sheet closed, and a failure here
  // costs the descriptions and nothing else.
  try {
    const d = await api("/api/settings");
    const val = k => { const v = d.settings?.[k]?.value; return v && v !== "off" ? String(v) : ""; };
    // prefMode's `value` is a LABEL with an emoji in it ("🚨 Bypass"); `raw` is the mode itself, which
    // is what a row can be matched against.
    spawnDefaults = { model: val("spawnModel"), effort: val("spawnEffort"), mode: d.settings?.prefMode?.raw || "" };
    paintSpawn();
  } catch { /* the rows read a bare "Follows Settings" — the spawn still resolves daemon-side */ }
}
$("spback").onclick = () => { $("spawn").classList.remove("p2"); dialHeight(SPAWN_HOST); };
$("spcancel").onclick = () => closeSheet("spawn");
$("spawn").onclick = e => { if (e.target.id === "spawn") closeSheet("spawn"); };
$("spgo").onclick = async () => {
  const name = $("spname").value.trim();
  if (!name) { showErr("Name required"); return; }
  $("spgo").disabled = true;
  const d = await writeOp("/api/session/spawn", {
    name,
    // A named value ships; the Default row ships NOTHING and the daemon resolves it at spawn time.
    // `mode: "default"` is a named value like any other — the daemon treats an explicitly named mode
    // as one to enforce, which is what makes the "Ask" row mean what it says on a box whose account
    // default is bypass.
    ...(spawnSel.model ? { model: spawnSel.model } : {}),
    ...(spawnSel.effort ? { effort: spawnSel.effort } : {}),
    ...(spawnSel.mode ? { mode: spawnSel.mode } : {}),
  });
  $("spgo").disabled = false;
  if (!d) return;   // writeOp surfaced the error
  closeSheet("spawn"); $("spname").value = "";
  showOk("Spawned " + d.name);
  renderSessions();
  if (d.sid) setTimeout(() => openDrill(d.sid, d.name), 500);
};

// ---- Scheduled board: cron + queued prompts + budget, each cancellable ----
async function renderAuto() {
  const el = $("tab-auto");
  let d; try { d = await api("/api/auto"); } catch { el.innerHTML = '<div class="notice">Automation unavailable.</div>'; return; }
  let html = "";
  html += '<div class="sechead">Scheduled (/cron)</div>';
  html += d.cron.length ? d.cron.map(m =>
    '<div class="evrow"><span class="who">' + (m.recurLabel ? "🔁 " + esc(m.recurLabel) : new Date(m.fireAt).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })) + "</span>" +
    '<span class="tx">' + esc(m.sessionLabel) + ": " + esc(m.text) + "</span>" +
    '<button class="xbtn" data-kind="cron" data-id="' + esc(m.id) + '">✕</button></div>').join("")
    : '<div class="notice">Nothing scheduled.</div>';
  html += '<div class="newsess" id="schedadd">➕ New schedule</div>';
  html += '<div class="sechead">Queued (/queue)</div>';
  html += d.queue.length ? d.queue.map(q =>
    '<div class="evrow"><span class="who">' + esc(q.session) + '</span><span class="tx">' + esc(q.text) + "</span>" +
    '<button class="xbtn" data-kind="queue" data-id="' + esc(q.id) + '">✕</button></div>').join("")
    : '<div class="notice">Queue is empty.</div>';
  if (d.budget && (d.budget.cap || d.budget.spent)) {
    html += '<div class="sechead">Budget today</div><div class="card"><div class="v">$' + d.budget.spent.toFixed(2) +
      (d.budget.cap ? " of $" + d.budget.cap.toFixed(2) : " · no cap") + "</div>" +
      (d.budget.cap ? pctBar((d.budget.spent / d.budget.cap) * 100) : "") + "</div>";
  }
  el.innerHTML = html;
  el.querySelectorAll(".xbtn").forEach(b => b.onclick = async () => {
    const d2 = await writeOp("/api/auto/cancel", { kind: b.dataset.kind, id: b.dataset.id });
    if (d2) { showOk("Cancelled"); renderAuto(); }
  });
  $("schedadd").onclick = openSchedSheet;
}

// New-schedule sheet: when spec + a session pick (live panes from /api/sessions) + message.
let schedSid = "";
async function openSchedSheet() {
  let live = [];
  try { live = (await api("/api/sessions")).sessions.filter(s => s.alive); } catch {}
  if (!live.length) { showErr("No live sessions to target"); return; }
  if (!live.some(s => s.sid === schedSid)) schedSid = live[0].sid;
  const row = $("scsess");
  const paint = () => {
    row.innerHTML = live.map(s =>
      '<button class="selchip' + (schedSid === s.sid ? " on" : "") + '" data-v="' + esc(s.sid) + '">' + esc(s.name) + "</button>").join("");
    row.querySelectorAll("button").forEach(b => b.onclick = () => { schedSid = b.dataset.v; paint(); });
  };
  paint();
  openSheet("sched");
  $("scwhen").focus();
}
$("sccancel").onclick = () => closeSheet("sched");
$("sched").onclick = e => { if (e.target.id === "sched") closeSheet("sched"); };
$("scgo").onclick = async () => {
  const when = $("scwhen").value.trim(), text = $("sctext").value.trim();
  if (!when || !text) { showErr("Schedule and message required"); return; }
  $("scgo").disabled = true;
  const d = await writeOp("/api/auto/create", { when, sid: schedSid, text });
  $("scgo").disabled = false;
  if (!d) return;   // writeOp surfaced the error
  closeSheet("sched"); $("scwhen").value = ""; $("sctext").value = "";
  showOk("Scheduled " + (d.summary || ""));
  renderAuto();
};

// Boot: Sessions is the homepage. A deep link (?start= folder, or startapp token → /api/resolve)
// still lands on Files at that folder — that's what the /files command promises. With the file
// browser omitted, deep links fall through to Sessions.
async function boot() {
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  const qs = new URLSearchParams(location.search).get("start");
  if (FILES && sp) {
    try { const r = await api("/api/resolve", { token: sp }); cur = r.cwd || "/"; filesLoaded = true; ls(cur); showTab("files"); return; } catch {}
  } else if (FILES && qs) { filesLoaded = true; ls(cur); showTab("files"); return; }
  showTab("sessions");
}
if (!INIT) $("tab-sessions").innerHTML = '<div class="notice">Open this from the Telegram button — it carries the sign-in token.</div>';
else boot();
</script>
